function saudacao(){ const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function graficoRecebidoHTML(recs){
  const hoje = new Date(), meses = Array.from({ length: 6 }, (_, i) => new Date(hoje.getFullYear(), hoje.getMonth() - 5 + i, 1));
  const val = meses.map(m => { const l = recs.filter(r => !r.estornado && r.data.slice(0, 7) === inputData(m).slice(0, 7));
    return { m, v: r2(l.reduce((s, r) => s + Number(r.valor), 0)), n: l.length }; });
  const max = Math.max(...val.map(x => x.v), 0);
  const passo = (() => { if (!max) return 1000; const bruto = max / 3, p = Math.pow(10, Math.floor(Math.log10(bruto))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= bruto); })();
  const topo = passo * Math.max(1, Math.ceil(max / passo));
  const W = 560, H = 210, L = 46, B = 26, T = 12, R = 8, iw = W - L - R, ih = H - T - B, band = iw / 6, bw = Math.min(24, band * 0.5);
  const y = v => T + ih - (v / topo) * ih;
  const compacto = v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : String(v);
  const ticks = Array.from({ length: Math.round(topo / passo) + 1 }, (_, i) => i * passo);
  const coluna = (x, v) => { const h = Math.max(0, T + ih - y(v)); if (!h) return ""; const r = Math.min(4, h, bw / 2), yy = y(v);
    return `<path d="M${x},${T + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${T + ih} Z" class="pn-col"/>`; };
  const ult = val[5];
  return `<div class="pn-graf" id="pnGraf">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido por mês nos últimos 6 meses: ${val.map(x => `${nomeMesCurto(x.m)} ${brl(x.v)}`).join(", ")}">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" class="pn-grid"/><text x="${L - 8}" y="${y(t) + 4}" class="pn-eixo" text-anchor="end">${t ? compacto(t) : "0"}</text>`).join("")}
      ${val.map((x, i) => `<rect x="${L + band * i}" y="${T}" width="${band}" height="${ih + B}" class="pn-hit" data-i="${i}"/>`).join("")}
      ${val.map((x, i) => { const cx = L + band * i + (band - bw) / 2;
        return `${coluna(cx, x.v)}<text x="${cx + bw / 2}" y="${H - 8}" class="pn-eixo${i === 5 ? " atual" : ""}" text-anchor="middle">${nomeMesCurto(x.m)}</text>`; }).join("")}
      ${ult.v ? `<text x="${L + band * 5 + band / 2}" y="${y(ult.v) - 7}" class="pn-rot" text-anchor="middle">${compacto(Math.round(ult.v))}</text>` : ""}
    </svg>
    <div class="pn-tip" id="pnTip" hidden></div>
    <table class="sr-only"><caption>Recebido por mês</caption><tr><th>Mês</th><th>Valor</th><th>Pagamentos</th></tr>${val.map(x => `<tr><td>${nomeMes(x.m)}</td><td>${brl(x.v)}</td><td>${x.n}</td></tr>`).join("")}</table>
  </div>`;
}
const nomeMesCurto = d => { const t = fmtDia(d, { month: "short" }).replace(".", ""); return t.charAt(0).toUpperCase() + t.slice(1); };

function desenharPainel(){
  const hoje = new Date(), u = E.usuario || {};
  const ag = (E.pnHoje || []).filter(a => a.status !== "cancelado").sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
  const conf = ag.filter(a => ["confirmado", "em_atendimento", "concluido"].includes(a.status)).length;
  const prox = (E.pnProx || []).filter(a => a.status === "agendado");
  const proxConf = (E.pnProx || []).filter(a => a.status === "confirmado").length;
  const nomeProx = mesmoDia(E.pnProxDia || hoje, somaDias(dia0(hoje), 1)) ? "amanhã" : fmtDia(E.pnProxDia || hoje, { weekday: "long" });
  const mesAtual = inputData(hoje).slice(0, 7), mesAnt = inputData(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1)).slice(0, 7);
  const recMes = r2((E.pnRecs || []).filter(r => !r.estornado && r.data.slice(0, 7) === mesAtual).reduce((s, r) => s + Number(r.valor), 0));
  const recAnt = r2((E.pnRecs || []).filter(r => !r.estornado && r.data.slice(0, 7) === mesAnt).reduce((s, r) => s + Number(r.valor), 0));
  const abertas = (E.pnAbertas || []).map(p => ({ ...p, saldo: r2(Number(p.valor) - Number(p.recebido || 0)) })).filter(p => p.saldo > 0.009);
  const atras = abertas.filter(p => p.vencimento < hojeStr()).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const somaAtras = r2(atras.reduce((s, p) => s + p.saldo, 0));
  const orcs = (E.pnOrcs || []).slice().sort((a, b) => String(a.apresentado_em || a.criado_em).localeCompare(String(b.apresentado_em || b.criado_em)));
  const faixa = o => { const t = (o.opcoes || []).map(x => totaisOpcao(x).total).filter(Boolean); return t.length ? (Math.min(...t) === Math.max(...t) ? brl(t[0]) : `${brl(Math.min(...t))} a ${brl(Math.max(...t))}`) : "—"; };
  const dias = d => Math.max(0, Math.round((dia0(new Date()) - dia0(new Date(d))) / 864e5));
  const ult = ultimoBackup(), backupAtrasado = souAdmin() && (!ult || Date.now() - ult > 7 * 864e5);
  const kpi = (rot, val, sub, cls = "", href = "") => `<${href ? `a href="${href}"` : "div"} class="pn-kpi ${cls}"><span>${rot}</span><b class="num">${val}</b>${sub ? `<small>${sub}</small>` : ""}</${href ? "a" : "div"}>`;
  const delta = recAnt ? Math.round((recMes - recAnt) / recAnt * 100) : null;
  const titulo = fmtDia(hoje, { weekday: "long", day: "numeric", month: "long" });

  $("#root").innerHTML = `<div class="app">${cabecalhoHTML()}
    <div class="pn-topo">
      <div><h1 class="pn-ola">${saudacao()}${u.nome ? ", " + esc(curto({ nome: u.nome }) || u.nome) : ""}</h1>
        <p class="pn-data">${titulo.charAt(0).toUpperCase() + titulo.slice(1)}</p></div>
      <div class="group"><a class="btn" href="#paciente/novo">+ Novo paciente</a><button type="button" class="btn primary" id="pnNova">+ Nova consulta</button></div>
    </div>
    ${(() => { const at = (E.pnProt || []).filter(atrasadaPr), pr = (E.pnProt || []).filter(p => p.etapa === "pronto");
      return at.length || pr.length ? `<div class="pn-aviso">${icone("proteses")}<span>${at.length ? `<b>${at.length} prótese${at.length > 1 ? "s" : ""} atrasada${at.length > 1 ? "s" : ""}</b> no laboratório. ` : ""}${pr.length ? `${pr.length} pronta${pr.length > 1 ? "s" : ""} para instalar.` : ""}</span><a class="btn" href="#proteses">Ver próteses</a></div>` : ""; })()}
    ${backupAtrasado ? `<div class="pn-aviso">${icone("backup")}<span>${ult ? `A última cópia de segurança foi em ${fmtDia(new Date(ult), { day: "2-digit", month: "2-digit" })}.` : "Ainda não foi feita nenhuma cópia de segurança neste computador."} Faça uma por semana.</span><button type="button" class="btn" id="pnBackup">Fazer agora</button></div>` : ""}
    <div class="pn-kpis">
      ${kpi("Consultas hoje", ag.length, ag.length ? `${conf} confirmada${conf === 1 ? "" : "s"}` : "agenda livre", "", "#agenda")}
      ${kpi("Recebido no mês", brl(recMes), delta === null ? "" : `${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}% em relação a ${nomeMesCurto(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1)).toLowerCase()}`, "ok", "#financeiro")}
      ${kpi("Atrasado", brl(somaAtras), atras.length ? `${atras.length} parcela${atras.length > 1 ? "s" : ""}` : "nada atrasado", somaAtras ? "bad" : "", "#financeiro")}
      ${vejoProntuario() ? kpi("Orçamentos aguardando", orcs.length, orcs.length ? "esperando a decisão do paciente" : "nenhum pendente") : ""}
      ${kpi("Pacientes novos no mês", E.pnNovos ?? "—", "", "", "#pacientes")}
    </div>
    <div class="pn-grade">
      <section class="panel pn-hoje">
        <div class="odo-head"><div><h2>Agenda de hoje</h2><p class="sub" style="margin:0">${ag.length ? `${ag.length} consulta${ag.length > 1 ? "s" : ""}` : "Nenhuma consulta marcada para hoje."}</p></div><a class="btn ghost" href="#agenda">Abrir agenda</a></div>
        ${ag.length ? `<div class="pn-lista">${ag.map(a => { const agora = new Date(), passou = new Date(a.fim) < agora, ja = new Date(a.inicio) <= agora && !passou;
          return `<a class="pn-cons${passou ? " passou" : ""}${ja ? " agora" : ""}" href="#paciente/${a.paciente_id}">
            <span class="h num">${hhmm(a.inicio)}</span><i class="pn-dot" style="--c:${esc(corDe(a.profissional_id))}"></i>
            <span class="n">${esc(a.paciente?.nome || "")}<small>${esc(a.procedimento || "Consulta")} · ${esc(curto(dentista(a.profissional_id)))}</small></span>
            <span class="pill ${a.status}">${STATUS[a.status].rot}</span></a>`; }).join("")}</div>` : `<p class="empty">Aproveite para confirmar as consultas de ${esc(nomeProx)} ao lado.</p>`}
      </section>
      <section class="panel">
        <h2>Confirmar ${esc(nomeProx)}</h2>
        <p class="sub">${prox.length ? `${prox.length} aguardando · ${proxConf} já confirmada${proxConf === 1 ? "" : "s"}` : (proxConf ? `Todas as ${proxConf} consultas confirmadas.` : "Nenhuma consulta marcada.")}</p>
        <div class="list">${prox.map(a => `<div class="li"><span class="h num">${hhmm(a.inicio)}</span>
          <span class="n">${esc(a.paciente?.nome)}<small>${esc(curto(dentista(a.profissional_id)))}${a.procedimento ? " · " + esc(a.procedimento) : ""}</small></span>
          ${a.paciente?.telefone ? `<a class="wa" href="${linkWhats(a)}" target="_blank" rel="noopener" data-wa="${a.id}">WhatsApp</a>` : `<span class="note">sem telefone</span>`}</div>`).join("")}</div>
      </section>
      <section class="panel">
        <h2>Recebido nos últimos 6 meses</h2>
        <p class="sub">Pagamentos registrados no sistema, sem estornos. Passe o mouse nas colunas.</p>
        ${graficoRecebidoHTML(E.pnRecs || [])}
      </section>
      <section class="panel">
        ${vejoProntuario() ? `<h2>Orçamentos aguardando o paciente</h2>
        <p class="sub">${orcs.length ? "Apresentados e ainda sem resposta. Vale retomar o contato." : "Nenhum orçamento esperando resposta."}</p>
        <div class="list">${orcs.slice(0, 6).map(o => `<a class="li pn-link" href="#orcamento/${o.id}"><span class="h num">Nº ${o.numero}</span>
          <span class="n">${esc(o.paciente?.nome || "")}<small>${faixa(o)} · há ${dias(o.apresentado_em || o.criado_em)} dia${dias(o.apresentado_em || o.criado_em) === 1 ? "" : "s"}</small></span><span class="pill orc-apresentado">abrir</span></a>`).join("")}</div>
        ${orcs.length > 6 ? `<p class="note" style="margin:6px 0 0">e mais ${orcs.length - 6}.</p>` : ""}
        <h2 style="margin-top:16px">Pagamentos atrasados</h2>` : `<h2>Pagamentos atrasados</h2>`}
        <p class="sub">${atras.length ? `${atras.length} parcela${atras.length > 1 ? "s" : ""} · ${brl(somaAtras)}` : "Nenhum pagamento atrasado."}</p>
        <div class="list">${atras.slice(0, 5).map(p => `<div class="li"><span class="h num">${dataBR(p.vencimento).slice(0, 5)}</span>
          <span class="n"><a class="pn-a" href="#paciente/${p.paciente_id}">${esc(p.paciente?.nome || "")}</a><small>${esc(p.descricao)} · falta ${brl(p.saldo)}</small></span>
          ${p.paciente?.telefone ? `<a class="wa" target="_blank" rel="noopener" href="${linkCobranca(p)}">Lembrar</a>` : ""}</div>`).join("")}</div>
        ${atras.length > 5 ? `<a class="mais-lista" href="#financeiro">Ver todos no Financeiro</a>` : ""}
        ${podeDespesas() ? (() => { const em7 = inputData(somaDias(new Date(), 7)), l = (E.pnDesp || []).filter(d => d.vencimento <= em7).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
          return `<h2 style="margin-top:16px">Contas a pagar</h2>
          <p class="sub">${l.length ? `${l.length} vencida${l.length > 1 ? "s" : ""} ou vencendo em 7 dias` : "Nada vence nos próximos 7 dias."}</p>
          <div class="list">${l.slice(0, 5).map(d => `<a class="li pn-link" href="#despesas"><span class="h num">${dataBR(d.vencimento).slice(0, 5)}</span>
            <span class="n">${esc(d.descricao)}<small>${d.valor_total == null ? "valor a informar" : brl(vCons(d)) + (Number(d.pct_consultorio) < 100 ? " (parte do consultório)" : "")}</small></span>
            <span class="pill ${situacaoDesp(d).cls}">${situacaoDesp(d).rot}</span></a>`).join("")}</div>
          ${l.length > 5 ? `<a class="mais-lista" href="#despesas">Ver todas</a>` : ""}`; })() : ""}
      </section>
    </div>
  </div>`;
  ligarSair();
  $("#pnNova").onclick = () => abrirForm({ data: inputData(new Date()) });
  const pb = $("#pnBackup"); if (pb) pb.onclick = () => fazerBackup();
  document.querySelectorAll("[data-wa]").forEach(a => a.addEventListener("click", () => marcarEnvio(a.dataset.wa)));
  // dica do gráfico
  const g = $("#pnGraf"), tip = $("#pnTip");
  if (g){
    const hoje2 = new Date(), meses = Array.from({ length: 6 }, (_, i) => new Date(hoje2.getFullYear(), hoje2.getMonth() - 5 + i, 1));
    g.querySelectorAll(".pn-hit").forEach(h => {
      h.addEventListener("mouseenter", () => { const m = meses[h.dataset.i], l = (E.pnRecs || []).filter(r => !r.estornado && r.data.slice(0, 7) === inputData(m).slice(0, 7));
        tip.innerHTML = `<b>${nomeMes(m)}</b><span class="num">${brl(l.reduce((s, r) => s + Number(r.valor), 0))}</span><small>${l.length} pagamento${l.length === 1 ? "" : "s"}</small>`;
        tip.hidden = false; const gb = g.getBoundingClientRect(), hb = h.getBoundingClientRect();
        tip.style.left = Math.min(gb.width - 150, Math.max(0, hb.left - gb.left + hb.width / 2 - 70)) + "px"; tip.style.top = "0px"; h.classList.add("on"); });
      h.addEventListener("mouseleave", () => { tip.hidden = true; h.classList.remove("on"); });
    });
  }
}

/* ---------------- Login e início ---------------- */
// E-mails já usados neste computador (só o e-mail; a senha nunca é guardada pelo sistema)
const LOGINS_KEY = "odonto_logins";
const lerLogins = () => { try{ return JSON.parse(localStorage.getItem(LOGINS_KEY) || "[]"); }catch(e){ return []; } };
const guardarLogin = (email, nome) => { try{
  const l = lerLogins().filter(x => x.email !== email); l.unshift({ email, nome });
  localStorage.setItem(LOGINS_KEY, JSON.stringify(l.slice(0, 5)));
}catch(e){} };
const esquecerLogin = email => { try{ localStorage.setItem(LOGINS_KEY, JSON.stringify(lerLogins().filter(x => x.email !== email))); }catch(e){} };

function telaLogin(msg){
  const logins = lerLogins();
  $("#root").innerHTML = `
  <div class="login">
    <form id="fLogin" novalidate>
      <div><h1>${CONSULTORIO}</h1><p>${logins.length ? "Escolha quem vai entrar ou digite outro e-mail." : "Entre com seu e-mail e senha do consultório."}</p></div>
      ${logins.length ? `<div class="quem">${logins.map(l => `<span class="quem-i"><button type="button" class="btn" data-email="${esc(l.email)}">${esc(l.nome || l.email)}</button><button type="button" class="x" data-esquecer="${esc(l.email)}" aria-label="Esquecer ${esc(l.nome || l.email)} neste computador" title="Esquecer neste computador">×</button></span>`).join("")}</div>` : ""}
      <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required value="${esc(logins[0]?.email || "")}"></div>
      <div class="field"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required></div>
      <div class="err" id="eLogin" ${msg ? "" : "hidden"}>${esc(msg||"")}</div>
      <button class="btn primary" type="submit" style="justify-content:center;padding:10px">Entrar</button>
      <p class="note" style="margin:0">Só o e-mail fica lembrado neste computador. A senha é sempre digitada (ou guardada pelo próprio navegador, se você permitir).</p>
    </form>
  </div>`;
  const marcar = email => { $("#lEmail").value = email; document.querySelectorAll("[data-email]").forEach(b => b.setAttribute("aria-pressed", b.dataset.email === email)); $("#lSenha").value = ""; $("#lSenha").focus(); };
  document.querySelectorAll("[data-email]").forEach(b => b.onclick = () => marcar(b.dataset.email));
  document.querySelectorAll("[data-esquecer]").forEach(b => b.onclick = () => { esquecerLogin(b.dataset.esquecer); telaLogin(); });
  if (logins.length) marcar(logins[0].email); else $("#lEmail").focus();
  $("#fLogin").onsubmit = async ev => {
    ev.preventDefault();
    const err = $("#eLogin");
    const email = $("#lEmail").value.trim().toLowerCase();
    try{
      await api.entrar(email, $("#lSenha").value);
      let nome = email; try{ const u = await api.usuario(); if (u?.nome) nome = u.nome; }catch(e){}
      guardarLogin(email, nome);
      iniciar();
    }
    catch(e){
      let m = erroAmigavel(e);
      if (/incorretos/.test(m) && /^odontoramirezolmedo@/.test(email)) m += ' Atenção: o login das dentistas tem "+nome" no e-mail, por exemplo odontoramirezolmedo+dorcas@gmail.com.';
      err.textContent = m; err.hidden = false;
    }
  };
}

async function iniciar(){
  if (configurado && !bibliotecaOk){
    $("#root").innerHTML = `<div class="login"><form><h1>${CONSULTORIO}</h1>
      <div class="err">Não foi possível carregar o componente de conexão com o banco. Verifique a internet e recarregue a página (F5). Se continuar, avise quem configurou o sistema.</div></form></div>`;
    return;
  }
  try{
    if (!api.demo && !(await api.sessao())) return telaLogin();
    E.usuario = await api.usuario();
    E.equipe = await api.equipe();
    E.visiveis = new Set(E.equipe.map(e=>e.id));
    E.semanaDe = E.equipe[0]?.id;
    if (E.data.getDay()===0) E.data = somaDias(E.data,1);
    lerEndereco();
    await carregar();
  }catch(e){
    if (!api.demo){ await api.sair().catch(()=>{}); telaLogin(erroAmigavel(e)); }
    else toast(erroAmigavel(e));
  }
}

// Atualiza sozinha: a cada minuto e quando a janela volta ao foco (outras pessoas marcam consultas ao mesmo tempo)
// Atualização automática só na agenda (na ficha apagaria o que está sendo digitado)
const podeAtualizar = () => E.equipe.length && ["agenda", "painel"].includes(E.tela) && !document.querySelector("dialog[open]");
setInterval(() => { if (podeAtualizar()) carregar(); }, 60000);
window.addEventListener("focus", () => { if (podeAtualizar()) carregar(); });

// Navegação por endereço: #agenda, #pacientes, #paciente/<id>, #paciente/novo
function lerEndereco(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "pacientes") E.tela = "pacientes";
  else if (h === "anamneses" && vejoProntuario()) E.tela = "anamneses";
  else if (h.startsWith("anamnese/") && h.length > 9 && vejoProntuario()){ E.tela = "editor"; E.modeloId = h.slice(9); }
  else if (h === "procedimentos") E.tela = "procedimentos";
  else if (h === "financeiro") E.tela = "financeiro";
  else if (h === "despesas" && podeDespesas()) E.tela = "despesas";
  else if (h === "crm") E.tela = "crm";
  else if (h === "proteses" && vejoProntuario()) E.tela = "proteses";
  else if (h.startsWith("orcamento/") && h.length > 10 && vejoProntuario()){ E.tela = "orcamento"; E.orcId = h.slice(10); }
  else if (h.startsWith("paciente/") && h.length > 9){ E.tela = "ficha"; E.pacienteId = h.slice(9); }
  else if (h === "agenda") E.tela = "agenda";
  else E.tela = "painel";
}
window.addEventListener("hashchange", () => {
  if (!E.equipe.length) return;
  if (E.orcTimer) salvarOrc();   // rascunho do orçamento: salva antes de sair
  if (!lerEndereco._ok && (fichaAlterada() || rascunhoAlterado())){
    // alterações não salvas: pergunta na própria tela antes de sair
    const destino = location.hash;
    history.replaceState(null, "", E.tela === "editor" ? "#anamnese/" + E.modeloId : "#paciente/" + E.pacienteId);
    avisoNaoSalvo(destino); return;
  }
  lerEndereco._ok = false;
  lerEndereco(); document.querySelectorAll("dialog[open]").forEach(d=>d.close()); window.scrollTo(0,0); carregar();
});

iniciar();
</script>

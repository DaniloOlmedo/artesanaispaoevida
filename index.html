      ${semNome.length ? `<p class="note" style="margin:6px 0 0;color:var(--warn)">${semNome.length} conta${semNome.length > 1 ? "s pagas não têm" : " paga não tem"} "em nome de" e não entra${semNome.length > 1 ? "m" : ""} aqui.</p>` : ""}
      <p class="note" style="margin:8px 0 0">Só entra a parte do consultório (a da casa não é dedutível). Guarde os boletos e comprovantes: anexe na própria conta. Na dúvida sobre o que pode ser deduzido, confirme no manual do Carnê-Leão ou com um contador.</p>
    </section>
  </div>`;
  ligarSair();
  const muda = n => { E.dpMes = new Date(E.dpMes.getFullYear(), E.dpMes.getMonth() + n, 1); carregar(); };
  $("#dpAnt").onclick = () => muda(-1); $("#dpProx").onclick = () => muda(1);
  const dh = $("#dpHoje"); if (dh) dh.onclick = () => { E.dpMes = new Date(new Date().getFullYear(), new Date().getMonth(), 1); carregar(); };
  document.querySelectorAll("[data-dpa]").forEach(b => b.onclick = () => { E.dpAba = b.dataset.dpa; desenhar(); });
  $("#dpNova").onclick = () => abrirDespesa(null);
  $("#dpFixas").onclick = () => abrirFixas();
  const todas = [...(E.dpMesRows || []), ...(E.dpAbertas || [])], acha = id => todas.find(x => x.id === id);
  document.querySelectorAll("tr[data-desp]").forEach(tr => { tr.onclick = ev => { if (ev.target.closest("[data-dpagar]")) return; const d = acha(tr.dataset.desp); d.status === "aberta" ? abrirDespesa(d) : verDespesa(d); };
    tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(e); }; });
  document.querySelectorAll("[data-dpagar]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const d = acha(b.dataset.dpagar); d.valor_total == null ? abrirDespesa(d, { focoValor: true }) : abrirPagar(d); });
  document.querySelectorAll("[data-rateio]").forEach(b => b.onclick = async () => { b.disabled = true;
    try{ await api.salvarConfig("rateio_despesas", b.dataset.rateio); E.dpRateio = b.dataset.rateio; toast("Forma de divisão alterada"); desenhar(); }
    catch(e){ toast(erroAmigavel(e)); b.disabled = false; } });
}
const fmtPct = v => String(r2(Number(v))).replace(".", ",") + "%";

/* Nova despesa / editar conta em aberto */
function abrirDespesa(d, op = {}){
  const dlg = $("#dlgFin"), nova = !d;
  const st = nova ? { descricao: "", categoria: "outros", fornecedor: "", valor: NaN, venc: hojeStr(), pct: 100, nome: dentPadrao(), arca: "", dedutivel: true, obs: "", repetir: "uma", n: 2 }
    : { descricao: d.descricao, categoria: d.categoria, fornecedor: d.fornecedor || "", valor: d.valor_total == null ? NaN : Number(d.valor_total), venc: d.vencimento, pct: Number(d.pct_consultorio),
        nome: d.em_nome_de || "", arca: d.arca_profissional_id || "", dedutivel: d.dedutivel !== false, obs: d.observacao || "" };
  let arquivo = null, cancelando = false;
  const catOpts = sel => Object.entries(CAT_DESP).map(([k, r]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${r}</option>`).join("");
  const nomeOpts = sel => `<option value="">— escolha —</option>` + E.equipe.map(e => `<option value="${e.id}" ${e.id === sel ? "selected" : ""}>${esc(e.nome)}</option>`).join("");
  const arcaOpts = sel => `<option value="" ${!sel ? "selected" : ""}>Dividida entre as dentistas (comum)</option>` + E.equipe.map(e => `<option value="${e.id}" ${e.id === sel ? "selected" : ""}>Só ${esc(curto(e))}</option>`).join("");
  const guarda = () => { const g = s => $(s, dlg);
    st.descricao = g("#dpDesc").value; st.categoria = g("#dpCat").value; st.fornecedor = g("#dpForn").value; st.valor = g("#dpValor").value.trim() ? lerValor(g("#dpValor").value) : NaN;
    st.venc = g("#dpVenc").value; const p = lerValor(g("#dpPct").value); st.pct = isNaN(p) ? st.pct : p; st.nome = g("#dpNome").value; st.arca = g("#dpArca").value;
    st.dedutivel = g("#dpDed").checked; st.obs = g("#dpObs").value; const n = g("#dpN"); if (n) st.n = Number(n.value) || 2; };
  const parteTxt = () => { const v = st.valor, p = st.pct; return isNaN(v) || isNaN(p) ? "" : p >= 100 ? "Tudo do consultório." : `Consultório: ${brl(r2(v * p / 100))} · casa: ${brl(r2(v - v * p / 100))}`; };
  const pinta = () => {
    dlg.innerHTML = `<form class="dlg" id="fDesp" novalidate><header><div><h3>${nova ? "Nova despesa" : "Conta a pagar"}</h3><p>${nova ? "Conta do consultório ou da casa dividida" : esc(d.descricao) + (d.fixa_id ? " · despesa fixa" : "")}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        <div class="grid2"><div class="field"><label for="dpDesc">Descrição</label><input id="dpDesc" value="${esc(st.descricao)}" placeholder="Ex.: Energia elétrica; Resina Z350; Prótese da paciente Ana"></div>
          <div class="field"><label for="dpCat">Categoria</label><select id="dpCat">${catOpts(st.categoria)}</select></div></div>
        <div class="field"><label for="dpForn">Fornecedor (opcional)</label><input id="dpForn" value="${esc(st.fornecedor)}" placeholder="Ex.: Dental Cremer; laboratório; imobiliária"></div>
        ${nova ? `<div class="field"><label>Repetir</label><div class="seg" role="group">${[["uma", "Só esta vez"], ["mensal", "Todo mês"], ["parcelado", "Parcelada"]].map(([k, r]) => `<button type="button" data-rep="${k}" aria-pressed="${st.repetir === k}">${r}</button>`).join("")}</div>
          ${st.repetir === "mensal" ? `<small class="note">Vira uma despesa fixa: o sistema cria a conta de todo mês, no mesmo dia. Em contas que mudam de valor (energia, água), deixe o valor em branco e informe quando chegar.</small>` : ""}</div>` : ""}
        <div class="grid3">
          <div class="field"><label for="dpValor">${st.repetir === "parcelado" && nova ? "Valor de cada parcela (R$)" : "Valor da conta inteira (R$)"}</label><input id="dpValor" inputmode="decimal" value="${isNaN(st.valor) ? "" : fmtValor(st.valor)}" placeholder="${st.repetir === "mensal" ? "em branco se varia" : ""}"></div>
          <div class="field"><label for="dpVenc">${st.repetir === "parcelado" && nova ? "1º vencimento" : "Vencimento"}</label><input id="dpVenc" type="date" value="${esc(st.venc)}"></div>
          ${st.repetir === "parcelado" && nova ? `<div class="field"><label for="dpN">Parcelas</label><select id="dpN">${Array.from({ length: 47 }, (_, i) => `<option value="${i + 2}" ${st.n === i + 2 ? "selected" : ""}>${i + 2}×</option>`).join("")}</select></div>`
            : `<div class="field"><label for="dpPct">Parte do consultório (%)</label><input id="dpPct" inputmode="decimal" value="${fmtValor(st.pct).replace(",00", "")}"></div>`}
        </div>
        ${st.repetir === "parcelado" && nova ? `<div class="field"><label for="dpPct">Parte do consultório (%)</label><input id="dpPct" inputmode="decimal" value="${fmtValor(st.pct).replace(",00", "")}" style="max-width:120px"></div>` : ""}
        <p class="note" id="dpParte" style="margin:0">${parteTxt()}</p>
        <div class="grid2"><div class="field"><label for="dpNome">Em nome de (CPF do boleto)</label><select id="dpNome">${nomeOpts(st.nome)}</select><small class="note">Quem pode deduzir no Carnê-Leão.</small></div>
          <div class="field"><label for="dpArca">Quem arca</label><select id="dpArca">${arcaOpts(st.arca)}</select><small class="note">Laboratório e material de um caso: a dentista do caso.</small></div></div>
        <label class="chk"><input type="checkbox" id="dpDed" ${st.dedutivel ? "checked" : ""}> Despesa dedutível no Carnê-Leão (livro-caixa)</label>
        <div class="field"><label for="dpObs">Observação (opcional)</label><input id="dpObs" value="${esc(st.obs)}"></div>
        <div class="field"><label for="dpArq">Boleto ou nota (opcional)</label>${!nova && d.anexo_caminho ? `<p style="margin:0 0 4px"><button type="button" class="btn ghost" id="dpVerAnx">Ver arquivo anexado</button></p>` : ""}<input id="dpArq" type="file" accept="image/*,application/pdf">${arquivo ? `<small class="note">${esc(arquivo.name)}</small>` : ""}</div>
        ${!nova ? `<div id="boxCanc" ${cancelando ? "" : "hidden"}><div class="field"><label for="dpMot">Motivo do cancelamento</label><input id="dpMot" placeholder="Ex.: lançada em duplicidade; conta não veio este mês"></div>
          <p class="note" style="margin:0">A conta continua no histórico, riscada, e deixa de contar.</p></div>` : ""}
        <div class="err" id="eDesp" hidden></div>
      </div>
      <footer>${!nova ? `<button type="button" class="btn ghost danger" id="dpCanc" style="margin-right:auto">${cancelando ? "Confirmar cancelamento" : "Cancelar conta"}</button>` : ""}
        <button type="button" class="btn ghost" data-fechar>Fechar</button>
        ${!nova ? `<button type="button" class="btn" id="dpSalvarPagar">Salvar e pagar</button>` : ""}<button type="submit" class="btn primary" id="dpOk">${nova ? "Lançar" : "Salvar"}</button></footer></form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    dlg.querySelectorAll("[data-rep]").forEach(b => b.onclick = () => { guarda(); st.repetir = b.dataset.rep; pinta(); });
    $("#dpCat", dlg).onchange = e => { guarda(); if (nova) st.pct = PCT_CASA[e.target.value] ?? 100; pinta(); };
    const atual = () => { guarda(); $("#dpParte", dlg).textContent = parteTxt(); };
    $("#dpValor", dlg).oninput = atual; $("#dpPct", dlg).oninput = atual;
    $("#dpArq", dlg).onchange = e => { arquivo = e.target.files[0] || null; };
    const va = $("#dpVerAnx", dlg); if (va) va.onclick = () => abrirAnexoDespesa(d.anexo_caminho);
    const err = $("#eDesp", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const valida = () => {
      guarda();
      if (!st.descricao.trim()) return "Escreva a descrição da conta.";
      if (!st.venc) return "Informe o vencimento.";
      if (!isNaN(st.valor) && st.valor <= 0) return "Valor inválido.";
      if (isNaN(st.valor) && (st.repetir === "uma" || st.repetir === "parcelado") && nova) return "Informe o valor.";
      if (isNaN(st.pct) || st.pct <= 0 || st.pct > 100) return "A parte do consultório vai de 1% a 100%.";
      return "";
    };
    const sobe = async () => arquivo ? await api.enviarAnexoDespesa(arquivo) : null;
    const salvar = async (pagarDepois) => {
      const m = valida(); if (m) return erro(m);
      dlg.querySelectorAll("footer button").forEach(b => b.disabled = true);
      try{
        const caminho = await sobe();
        const base = { descricao: st.descricao.trim(), categoria: st.categoria, fornecedor: st.fornecedor.trim() || null, pct_consultorio: st.pct,
          em_nome_de: st.nome || null, arca_profissional_id: st.arca || null, dedutivel: st.dedutivel, observacao: st.obs.trim() || null };
        if (!nova){
          const c = { ...base, valor_total: isNaN(st.valor) ? null : st.valor, vencimento: st.venc, competencia: d.fixa_id ? d.competencia : primeiroDia(st.venc) };
          if (caminho) c.anexo_caminho = caminho;
          const r = await api.atualizarDespesa(d.id, c);
          dlg.close(); toast("Conta salva");
          if (pagarDepois){ if (r.valor_total == null){ await carregar(); return toast("Informe o valor antes de pagar."); } abrirPagar(r); return; }
          return carregar();
        }
        if (st.repetir === "mensal"){
          const dia = Number(st.venc.slice(8, 10));
          const f = await api.salvarFixa({ ...base, valor_previsto: isNaN(st.valor) ? null : st.valor, dia_vencimento: dia, inicio: primeiroDia(st.venc), ativo: true });
          await api.gerarDespesas([{ ...base, fixa_id: f.id, competencia: primeiroDia(st.venc), vencimento: st.venc, valor_total: isNaN(st.valor) ? null : st.valor, anexo_caminho: caminho }]);
          dlg.close(); toast("Despesa fixa criada"); return carregar();
        }
        const n = st.repetir === "parcelado" ? st.n : 1, grupo = n > 1 ? uid() : null;
        const rows = Array.from({ length: n }, (_, i) => { const venc = somaMeses(st.venc, i);
          return { ...base, descricao: base.descricao, competencia: primeiroDia(venc), vencimento: venc, valor_total: st.valor, parcela: i + 1, parcelas: n, grupo, anexo_caminho: i === 0 ? caminho : null }; });
        await api.criarDespesas(rows);
        dlg.close(); toast(n > 1 ? `${n} parcelas lançadas` : "Despesa lançada"); carregar();
      }catch(e){ erro(erroAmigavel(e)); dlg.querySelectorAll("footer button").forEach(b => b.disabled = false); }
    };
    $("#fDesp", dlg).onsubmit = ev => { ev.preventDefault(); salvar(false); };
    const sp = $("#dpSalvarPagar", dlg); if (sp) sp.onclick = () => salvar(true);
    const cc = $("#dpCanc", dlg);
    if (cc) cc.onclick = async () => {
      if (!cancelando){ guarda(); cancelando = true; pinta(); $("#dpMot", dlg).focus(); return; }
      const mot = $("#dpMot", dlg).value.trim(); if (mot.length < 4) return erro("Escreva o motivo do cancelamento.");
      cc.disabled = true;
      try{ await api.atualizarDespesa(d.id, { status: "cancelada", motivo_cancelamento: mot }); dlg.close(); toast("Conta cancelada"); carregar(); }
      catch(e){ erro(erroAmigavel(e)); cc.disabled = false; }
    };
  };
  pinta(); dlg.showModal(); setTimeout(() => (op.focoValor ? $("#dpValor", dlg) : $("#dpDesc", dlg))?.focus(), 30);
}

/* Pagar uma conta */
function abrirPagar(d){
  const dlg = $("#dlgFin");
  const st = { valor: Number(d.valor_total), data: hojeStr(), quem: d.em_nome_de || d.arca_profissional_id || dentPadrao(), forma: "pix" };
  let arquivo = null;
  dlg.innerHTML = `<form class="dlg" id="fPag" novalidate><header><div><h3>Pagar conta</h3><p>${esc(d.descricao)} · vencimento ${dataBR(d.vencimento)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="grid2"><div class="field"><label for="pgValor">Valor pago (R$)</label><input id="pgValor" inputmode="decimal" value="${fmtValor(st.valor)}"><small class="note">Se pagou com multa ou juros, corrija aqui.</small></div>
        <div class="field"><label for="pgData">Data do pagamento</label><input id="pgData" type="date" value="${st.data}" max="${hojeStr()}"></div></div>
      <div class="grid2"><div class="field"><label for="pgQuem">Pago com o dinheiro de</label><select id="pgQuem">${E.equipe.map(e => `<option value="${e.id}" ${e.id === st.quem ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>
        <div class="field"><label for="pgForma">Forma</label><select id="pgForma">${Object.entries(FORMAS_DESP).map(([k, r]) => `<option value="${k}">${r}</option>`).join("")}</select></div></div>
      ${Number(d.pct_consultorio) < 100 ? `<p class="note" style="margin:0" id="pgParte"></p>` : ""}
      <div class="field"><label for="pgArq">Comprovante (opcional)</label><input id="pgArq" type="file" accept="image/*,application/pdf"></div>
      <div class="err" id="ePag" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="pgOk">Registrar pagamento</button></footer></form>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  const parte = () => { const p = $("#pgParte", dlg); if (!p) return; const v = lerValor($("#pgValor", dlg).value); p.textContent = isNaN(v) ? "" : `Parte do consultório (${fmtPct(d.pct_consultorio)}): ${brl(r2(v * Number(d.pct_consultorio) / 100))}.`; };
  $("#pgValor", dlg).oninput = parte; parte();
  $("#pgArq", dlg).onchange = e => { arquivo = e.target.files[0] || null; };
  $("#fPag", dlg).onsubmit = async ev => {
    ev.preventDefault();
    const err = $("#ePag", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const v = lerValor($("#pgValor", dlg).value), data = $("#pgData", dlg).value;
    if (isNaN(v) || v <= 0) return erro("Informe o valor pago.");
    if (!data || data > hojeStr()) return erro("Data inválida.");
    const bt = $("#pgOk", dlg); bt.disabled = true;
    try{
      const c = { status: "paga", valor_total: v, pago_em: data, pago_por_prof: $("#pgQuem", dlg).value, forma_pagamento: $("#pgForma", dlg).value };
      if (arquivo) c.anexo_caminho = await api.enviarAnexoDespesa(arquivo);
      await api.atualizarDespesa(d.id, c);
      dlg.close(); toast("Pagamento registrado"); carregar();
    }catch(e){ erro(erroAmigavel(e)); bt.disabled = false; }
  };
  dlg.showModal(); setTimeout(() => $("#pgValor", dlg)?.select(), 30);
}

/* Conta paga ou cancelada: ver, anexar comprovante, desfazer pagamento */

  const dlg = $("#dlgFin"); let desfazendo = false;
  const pinta = () => {
    dlg.innerHTML = `<div class="dlg"><header><div><h3>${esc(d.descricao)}</h3><p>${d.status === "paga" ? "Paga" : "Cancelada"}${d.fornecedor ? " · " + esc(d.fornecedor) : ""}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        ${d.status === "cancelada" ? `<p class="err" style="margin:0">Cancelada${d.cancelado_em ? " em " + dataBR(d.cancelado_em) : ""}. Motivo: ${esc(d.motivo_cancelamento || "")}</p>` : ""}
        <dl class="kv">
          <dt>Categoria</dt><dd>${esc(CAT_DESP[d.categoria] || d.categoria)}</dd>
          <dt>Vencimento</dt><dd class="num">${dataBR(d.vencimento)}</dd>
          <dt>Valor da conta</dt><dd class="num">${d.valor_total == null ? "—" : brl(d.valor_total)}</dd>
          <dt>Consultório</dt><dd class="num"><b>${vCons(d) == null ? "—" : brl(vCons(d))}</b> (${fmtPct(d.pct_consultorio)})</dd>
          ${d.status === "paga" ? `<dt>Pago em</dt><dd class="num">${dataBR(d.pago_em)} · ${esc(FORMAS_DESP[d.forma_pagamento] || d.forma_pagamento || "")}</dd><dt>Dinheiro de</dt><dd>${esc(nomeDent(d.pago_por_prof))}</dd>` : ""}
          <dt>Em nome de</dt><dd>${esc(nomeDent(d.em_nome_de))}</dd>
          <dt>Quem arca</dt><dd>${esc(quemArca(d))}</dd>
          <dt>Dedutível</dt><dd>${d.dedutivel ? "sim" : "não"}</dd>
          ${d.observacao ? `<dt>Observação</dt><dd>${esc(d.observacao)}</dd>` : ""}
        </dl>
        ${d.anexo_caminho ? `<p style="margin:0"><button type="button" class="btn ghost" id="vdAnx">Ver boleto / comprovante</button></p>` : ""}
        ${d.status === "paga" ? `<div class="field"><label for="vdArq">${d.anexo_caminho ? "Trocar o arquivo" : "Anexar comprovante"}</label><input id="vdArq" type="file" accept="image/*,application/pdf"></div>` : ""}
        ${desfazendo ? `<p class="note" style="margin:0">A conta volta a ficar em aberto. Use quando o pagamento foi lançado por engano (fica registrado no histórico).</p>` : ""}
        <div class="err" id="eVd" hidden></div>
      </div>
      <footer>${d.status === "paga" ? `<button type="button" class="btn ghost danger" id="vdDesf" style="margin-right:auto">${desfazendo ? "Confirmar: desfazer pagamento" : "Desfazer pagamento"}</button>` : ""}
        <button type="button" class="btn primary" data-fechar>Fechar</button></footer></div>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    const err = $("#eVd", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const va = $("#vdAnx", dlg); if (va) va.onclick = () => abrirAnexoDespesa(d.anexo_caminho);
    const arq = $("#vdArq", dlg);
    if (arq) arq.onchange = async e => { const f = e.target.files[0]; if (!f) return;
      try{ const caminho = await api.enviarAnexoDespesa(f); d = await api.atualizarDespesa(d.id, { anexo_caminho: caminho }); toast("Arquivo anexado"); pinta(); carregar(); }
      catch(ex){ erro(erroAmigavel(ex)); } };
    const df = $("#vdDesf", dlg);
    if (df) df.onclick = async () => {
      if (!desfazendo){ desfazendo = true; return pinta(); }
      df.disabled = true;
      try{ await api.atualizarDespesa(d.id, { status: "aberta" }); dlg.close(); toast("Pagamento desfeito"); carregar(); }
      catch(e){ erro(erroAmigavel(e)); df.disabled = false; }
    };
  };
  pinta(); dlg.showModal();
}
async function abrirAnexoDespesa(caminho){
  const w = window.open("", "_blank");
  try{ const url = await api.urlAnexoDespesa(caminho); if (w) w.location = url; else location.href = url; }
  catch(e){ if (w) w.close(); toast(erroAmigavel(e)); }
}

/* Despesas fixas: lista e edição */
function abrirFixas(editar){
  const dlg = $("#dlgFin"), fixas = (E.dpFixas || []).slice().sort((a, b) => (b.ativo - a.ativo) || a.descricao.localeCompare(b.descricao));
  if (editar !== undefined){
    const f = editar || { descricao: "", categoria: "outros", fornecedor: "", valor_previsto: null, dia_vencimento: 10, pct_consultorio: 100, em_nome_de: dentPadrao(), arca_profissional_id: null, dedutivel: true, ativo: true };
    dlg.innerHTML = `<form class="dlg" id="fFixa" novalidate><header><div><h3>${f.id ? "Editar despesa fixa" : "Nova despesa fixa"}</h3><p>Conta que se repete todo mês</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        <div class="grid2"><div class="field"><label for="fxDesc">Descrição</label><input id="fxDesc" value="${esc(f.descricao)}"></div>
          <div class="field"><label for="fxCat">Categoria</label><select id="fxCat">${Object.entries(CAT_DESP).map(([k, r]) => `<option value="${k}" ${k === f.categoria ? "selected" : ""}>${r}</option>`).join("")}</select></div></div>
        <div class="field"><label for="fxForn">Fornecedor (opcional)</label><input id="fxForn" value="${esc(f.fornecedor || "")}"></div>
        <div class="grid3"><div class="field"><label for="fxValor">Valor de todo mês (R$)</label><input id="fxValor" inputmode="decimal" value="${f.valor_previsto == null ? "" : fmtValor(f.valor_previsto)}" placeholder="em branco se varia"></div>
          <div class="field"><label for="fxDia">Dia do vencimento</label><input id="fxDia" type="number" min="1" max="31" value="${f.dia_vencimento}"></div>
          <div class="field"><label for="fxPct">Parte do consultório (%)</label><input id="fxPct" inputmode="decimal" value="${fmtValor(f.pct_consultorio).replace(",00", "")}"></div></div>
        <div class="grid2"><div class="field"><label for="fxNome">Em nome de (CPF do boleto)</label><select id="fxNome"><option value="">— escolha —</option>${E.equipe.map(e => `<option value="${e.id}" ${e.id === f.em_nome_de ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>
          <div class="field"><label for="fxArca">Quem arca</label><select id="fxArca"><option value="">Dividida entre as dentistas (comum)</option>${E.equipe.map(e => `<option value="${e.id}" ${e.id === f.arca_profissional_id ? "selected" : ""}>Só ${esc(curto(e))}</option>`).join("")}</select></div></div>
        <label class="chk"><input type="checkbox" id="fxDed" ${f.dedutivel !== false ? "checked" : ""}> Dedutível no Carnê-Leão</label>
        ${f.id ? `<label class="chk"><input type="checkbox" id="fxAtivo" ${f.ativo ? "checked" : ""}> Ativa (desmarque quando a conta deixar de existir)</label>` : ""}
        <p class="note" style="margin:0">As mudanças valem para os próximos meses. Contas já criadas se ajustam uma a uma na lista.</p>
        <div class="err" id="eFx" hidden></div>
      </div>
      <footer><button type="button" class="btn ghost" id="fxVoltar">Voltar</button><button type="submit" class="btn primary" id="fxOk">Salvar</button></footer></form>`;
    $("[data-fechar]", dlg).onclick = () => dlg.close();
    $("#fxVoltar", dlg).onclick = () => abrirFixas();
    $("#fFixa", dlg).onsubmit = async ev => {
      ev.preventDefault();
      const err = $("#eFx", dlg), erro = m => { err.textContent = m; err.hidden = false; };
      const desc = $("#fxDesc", dlg).value.trim(), vt = $("#fxValor", dlg).value.trim(), v = vt ? lerValor(vt) : null, dia = Number($("#fxDia", dlg).value), pct = lerValor($("#fxPct", dlg).value);
      if (!desc) return erro("Escreva a descrição.");
      if (v !== null && (isNaN(v) || v <= 0)) return erro("Valor inválido (ou deixe em branco).");
      if (!(dia >= 1 && dia <= 31)) return erro("Dia do vencimento de 1 a 31.");
      if (isNaN(pct) || pct <= 0 || pct > 100) return erro("A parte do consultório vai de 1% a 100%.");
      const c = { descricao: desc, categoria: $("#fxCat", dlg).value, fornecedor: $("#fxForn", dlg).value.trim() || null, valor_previsto: v, dia_vencimento: dia, pct_consultorio: pct,
        em_nome_de: $("#fxNome", dlg).value || null, arca_profissional_id: $("#fxArca", dlg).value || null, dedutivel: $("#fxDed", dlg).checked };
      const at = $("#fxAtivo", dlg); if (at) c.ativo = at.checked;
      $("#fxOk", dlg).disabled = true;
      try{ await api.salvarFixa(f.id ? { id: f.id, ...c } : { ...c, ativo: true }); toast("Despesa fixa salva"); await carregar(); abrirFixas(); }
      catch(e){ erro(erroAmigavel(e)); $("#fxOk", dlg).disabled = false; }
    };
    if (!dlg.open) dlg.showModal(); setTimeout(() => $("#fxDesc", dlg)?.focus(), 30);
    return;
  }
  dlg.innerHTML = `<div class="dlg"><header><div><h3>Despesas fixas</h3><p>O sistema cria a conta de cada mês sozinho</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      ${fixas.length ? `<div class="tbl-wrap"><table class="tbl fin-tbl"><thead><tr><th>Conta</th><th class="r">Valor</th><th class="r">Dia</th><th class="r">Consultório</th><th>Em nome de</th></tr></thead><tbody>
        ${fixas.map(f => `<tr data-fixa="${f.id}" tabindex="0" class="${f.ativo ? "" : "estornado"}"><td class="nm">${esc(f.descricao)}${f.ativo ? "" : " <small class=\"note\">(inativa)</small>"}<small class="dp-sub">${esc(CAT_DESP[f.categoria] || f.categoria)}${f.fornecedor ? " · " + esc(f.fornecedor) : ""}</small></td>
          <td class="num r">${f.valor_previsto == null ? "varia" : brl(f.valor_previsto)}</td><td class="num r">${f.dia_vencimento}</td><td class="num r">${fmtPct(f.pct_consultorio)}</td><td>${esc(nomeDent(f.em_nome_de))}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="empty">Nenhuma despesa fixa ainda.</p>`}
      <p class="note" style="margin:0">Clique numa linha para editar. Aluguel, energia e água estão em 50% porque a casa é dividida entre moradia e consultório.</p>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Fechar</button><button type="button" class="btn primary" id="fxNova">+ Nova despesa fixa</button></footer></div>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#fxNova", dlg).onclick = () => abrirFixas(null);
  dlg.querySelectorAll("tr[data-fixa]").forEach(tr => { tr.onclick = () => abrirFixas(fixas.find(f => f.id === tr.dataset.fixa)); tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); }; });
  if (!dlg.open) dlg.showModal();
}

/* ---------- CRM: funil de contatos, orçamentos sem resposta, retornos, aniversários e reativação ----------
   Cada mensagem enviada pelo WhatsApp a partir daqui fica registrada no histórico (crm_interacoes). */
const ETAPAS = { novo: "Novo contato", avaliacao: "Avaliação marcada", orcamento: "Orçamento", fechou: "Fechou", perdido: "Não fechou" };
const ORIGENS = ["WhatsApp", "Instagram", "Facebook", "Site", "Google", "Indicação de paciente", "Passou em frente", "Outro"];
const TIPOS_INT = { whatsapp: "WhatsApp", ligacao: "Ligação", presencial: "Pessoalmente", nota: "Anotação" };
const ASSUNTOS = { contato: "Contato", orcamento: "Orçamento", retorno: "Retorno", aniversario: "Aniversário", reativacao: "Reativação", outro: "Outro" };
const primeiroNome = n => String(n || "").trim().split(/\s+/)[0] || "";
const diasDesde = d => d ? Math.max(0, Math.round((dia0(new Date()) - dia0(new Date(d))) / 864e5)) : null;
const mesesDesde = d => d ? Math.floor(diasDesde(d) / 30.4) : null;
function msgCrm(tipo, x){
  const n = primeiroNome(x.nome);
  return {
    contato: `Olá, ${n}! Aqui é do ${CONSULTORIO}. Recebemos o seu contato${x.interesse ? ` sobre ${x.interesse}` : ""}. Podemos agendar uma avaliação? Responda com o melhor dia e horário para você.`,
    orcamento: `Olá, ${n}! Aqui é do ${CONSULTORIO}. Passando para saber se ficou alguma dúvida sobre o orçamento que apresentamos. Se quiser, podemos conversar ou já agendar o início do tratamento.`,
    retorno: `Olá, ${n}! Aqui é do ${CONSULTORIO}. Está chegando a hora do seu retorno${x.retorno_motivo ? ` (${x.retorno_motivo.toLowerCase()})` : ""}. Vamos agendar? Responda com o melhor dia e horário para você.`,
    aniversario: `Feliz aniversário, ${n}! A equipe do ${CONSULTORIO} deseja um novo ano com muita saúde e muitos sorrisos.`,
    reativacao: `Olá, ${n}! Tudo bem? Aqui é do ${CONSULTORIO}. Faz um tempo desde a sua última visita. Que tal agendar uma revisão? Responda com o melhor dia e horário para você.`,
  }[tipo];
}
const waCrm = (fone, tipo, x) => `https://wa.me/${numWhats(fone)}?text=${encodeURIComponent(msgCrm(tipo, x))}`;
// botão de WhatsApp que registra o envio no histórico
const botaoWaCrm = (fone, tipo, x, ref) => fone ? `<a class="wa" target="_blank" rel="noopener" href="${waCrm(fone, tipo, x)}" data-crmwa='${esc(JSON.stringify({ ...ref, assunto: tipo }))}'>WhatsApp</a>` : `<span class="note">sem telefone</span>`;
document.addEventListener("click", ev => {
  const a = ev.target.closest("[data-crmwa]"); if (!a) return;
  const r = JSON.parse(a.dataset.crmwa);
  api.registrarInteracao({ contato_id: r.contato_id || null, paciente_id: r.paciente_id || null, orcamento_id: r.orcamento_id || null, tipo: "whatsapp", assunto: r.assunto, texto: "Mensagem enviada pelo WhatsApp" })
    .then(() => { if (E.tela === "crm") setTimeout(carregar, 400); }).catch(e => toast(erroAmigavel(e)));
});

async function carregarCrm(){
  const desde = inputData(somaDias(new Date(), -120));
  try{
    [E.crmContatos, E.crmPacs, E.crmInts, E.crmOrcs] = await Promise.all([api.contatos(), api.crmPacientes(), api.interacoesDesde(desde),
      vejoProntuario() ? api.orcamentosAguardando().catch(() => []) : []]);
    E.crmFalta = false;
  }catch(e){
    const m = String(e.message || e);
    if (/(contatos|crm_)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m)) toast("Falta rodar o arquivo 18_crm.sql no Supabase para usar o CRM."); else toast(erroAmigavel(e));
    E.crmContatos = []; E.crmPacs = []; E.crmInts = []; E.crmOrcs = []; E.crmFalta = true;
  }
}
function crmListas(){
  const hoje = hojeStr(), em30 = inputData(somaDias(new Date(), 30)), ints = E.crmInts || [];
  const ultInt = f => ints.filter(f).sort((a, b) => b.criado_em.localeCompare(a.criado_em))[0] || null;
  const pacs = E.crmPacs || [];
  const retornos = pacs.filter(p => p.retorno_em && p.retorno_em <= em30 && !p.proxima_consulta).sort((a, b) => a.retorno_em.localeCompare(b.retorno_em));
  const sugestoes = pacs.filter(p => !p.retorno_em && !p.proxima_consulta && p.ultima_consulta && diasDesde(p.ultima_consulta) >= 165 && diasDesde(p.ultima_consulta) < 365)
    .sort((a, b) => a.ultima_consulta.localeCompare(b.ultima_consulta));
  const md = d => d.slice(5, 10), hojeMd = hoje.slice(5, 10);
  const prox7 = Array.from({ length: 7 }, (_, i) => inputData(somaDias(new Date(), i)).slice(5, 10));
  const aniver = pacs.filter(p => p.data_nascimento && prox7.includes(md(p.data_nascimento)))
    .sort((a, b) => prox7.indexOf(md(a.data_nascimento)) - prox7.indexOf(md(b.data_nascimento)));
  const reativar = pacs.filter(p => !p.proxima_consulta && !(p.retorno_em && p.retorno_em >= hoje) &&
    (p.ultima_consulta ? diasDesde(p.ultima_consulta) >= 365 : diasDesde(p.criado_em) >= 365))
    .sort((a, b) => String(a.ultima_consulta || a.criado_em).localeCompare(String(b.ultima_consulta || b.criado_em)));
  const orcs = (E.crmOrcs || []).map(o => ({ ...o, dias: diasDesde(o.apresentado_em || o.criado_em), ult: ultInt(i => i.orcamento_id === o.id || (i.paciente_id === o.paciente_id && i.assunto === "orcamento" && i.criado_em >= String(o.apresentado_em || o.criado_em))) }))
    .sort((a, b) => b.dias - a.dias);
  const contatos = E.crmContatos || [];
  return { hoje, hojeMd, retornos, sugestoes, aniver, reativar, orcs, contatos, ultInt };
}
const faixaOrc = o => { const t = (o.opcoes || []).map(x => totaisOpcao(x).total).filter(Boolean); return t.length ? (Math.min(...t) === Math.max(...t) ? brl(t[0]) : `${brl(Math.min(...t))} a ${brl(Math.max(...t))}`) : "—"; };
const quandoTxt = d => { const n = diasDesde(d); return n === 0 ? "hoje" : n === 1 ? "ontem" : `há ${n} dias`; };

function desenharCrm(){
  const L = crmListas(), aba = E.crmAba || "funil";
  const abertos = L.contatos.filter(c => !["fechou", "perdido"].includes(c.etapa));
  const fin90 = L.contatos.filter(c => ["fechou", "perdido"].includes(c.etapa) && diasDesde(c.atualizado_em) <= 90);
  const conv = fin90.length ? Math.round(100 * fin90.filter(c => c.etapa === "fechou").length / fin90.length) : null;
  const paraRetomar = L.orcs.filter(o => o.dias >= 3 && (!o.ult || diasDesde(o.ult.criado_em) >= 3));
  const retVenc = L.retornos.filter(p => p.retorno_em < L.hoje).length;
  const anivHoje = L.aniver.filter(p => p.data_nascimento.slice(5, 10) === L.hojeMd).length;

  const contatoFeito = (f, assunto) => { const i = L.ultInt(f); return i ? `<small class="dp-sub">${i.assunto === assunto || !assunto ? "contato " : ""}${quandoTxt(i.criado_em)} · ${esc(TIPOS_INT[i.tipo])}</small>` : ""; };
  let corpo = "";
  if (aba === "funil"){
    const col = k => { const l = L.contatos.filter(c => c.etapa === k && (!["fechou", "perdido"].includes(k) || diasDesde(c.atualizado_em) <= 30))
      .sort((a, b) => String(a.proxima_acao || "9999").localeCompare(String(b.proxima_acao || "9999")) || b.atualizado_em.localeCompare(a.atualizado_em));
      return `<div class="crm-col" data-etapa="${k}"><h3>${ETAPAS[k]} <span class="num">${l.length}</span></h3>
        ${l.map(c => { const atras = c.proxima_acao && c.proxima_acao <= L.hoje;
          return `<div class="crm-card" data-contato="${c.id}" tabindex="0"><b>${esc(c.nome)}</b>
            <small>${esc([c.origem, c.interesse].filter(Boolean).join(" · ") || "—")}</small>
            <small>${c.etapa === "perdido" ? esc(c.motivo_perda || "") : c.proxima_acao ? `<span class="${atras ? "crm-atras" : ""}">Próxima ação: ${dataBR(c.proxima_acao).slice(0, 5)}</span>` : `entrou ${quandoTxt(c.criado_em)}`}</small>
            ${!["fechou", "perdido"].includes(k) ? `<div class="crm-acts">${botaoWaCrm(c.telefone, "contato", c, { contato_id: c.id })}${k !== "orcamento" ? `<button type="button" class="btn icon" data-avanca="${c.id}" title="Avançar etapa" aria-label="Avançar para ${ETAPAS[{ novo: "avaliacao", avaliacao: "orcamento" }[k]]}">→</button>` : ""}</div>` : ""}
          </div>`; }).join("") || `<p class="note crm-vazio">—</p>`}</div>`; };
    corpo = `<section class="panel"><div class="odo-head"><div><h2>Funil de contatos</h2><p class="sub" style="margin:0">Quem procurou o consultório e ainda não é paciente. Clique no cartão para ver o histórico, mudar a etapa ou transformar em paciente. Fechou e Não fechou mostram os últimos 30 dias.</p></div>
      <button type="button" class="btn primary" id="crmNovo">+ Novo contato</button></div>
      <div class="crm-funil">${Object.keys(ETAPAS).map(col).join("")}</div></section>`;
  } else if (aba === "orcamentos"){
    corpo = `<section class="panel"><h2>Orçamentos sem resposta</h2><p class="sub">Apresentados e ainda sem decisão do paciente. Vale retomar com 3, 7 e 15 dias. Em destaque, os que estão há 3 dias ou mais sem contato.</p>
      ${L.orcs.length ? `<div class="tbl-wrap"><table class="tbl fin-tbl"><thead><tr><th>Orçamento</th><th>Paciente</th><th class="r">Valor</th><th>Apresentado</th><th>Último contato</th><th></th></tr></thead><tbody>
      ${L.orcs.map(o => `<tr class="${paraRetomar.includes(o) ? "crm-dest" : ""}" style="cursor:default"><td class="num">Nº ${o.numero}</td><td class="nm">${esc(o.paciente?.nome || "")}</td><td class="num r">${faixaOrc(o)}</td>
        <td>${quandoTxt(o.apresentado_em || o.criado_em)}</td><td>${o.ult ? `${quandoTxt(o.ult.criado_em)} · ${esc(TIPOS_INT[o.ult.tipo])}` : `<span class="crm-atras">nenhum</span>`}</td>

      </tbody></table></div>` : `<p class="empty">${vejoProntuario() ? "Nenhum orçamento esperando resposta." : "Só dentistas e gestão veem orçamentos."}</p>`}</section>`;
  } else if (aba === "retornos"){

      <td class="nm"><a class="pn-a" href="#paciente/${p.id}">${esc(p.nome)}</a><small class="dp-sub">${sug ? `última visita ${quandoTxt(p.ultima_consulta)}` : esc(p.retorno_motivo || "Retorno")}</small>${contatoFeito(i => i.paciente_id === p.id && i.assunto === "retorno", "retorno")}</td>

      ${L.sugestoes.length ? `<h3 class="fin-h3">Sugestão: revisão de 6 meses (${L.sugestoes.length})</h3><p class="sub" style="margin-top:0">Vieram há 6 a 12 meses, não têm retorno definido nem consulta marcada.</p>

  } else if (aba === "aniversarios"){
    corpo = `<section class="panel"><h2>Aniversários desta semana</h2><p class="sub">Uma mensagem de parabéns aproxima o paciente do consultório. Só felicitação, sem oferta.</p>

        const enviado = L.ultInt(i => i.paciente_id === p.id && i.assunto === "aniversario" && diasDesde(i.criado_em) <= 7);
        return `<tr style="cursor:default" class="${hojeE ? "crm-dest" : ""}"><td class="num">${hojeE ? "<b>hoje</b>" : md.split("-").reverse().join("/")}</td><td class="nm"><a class="pn-a" href="#paciente/${p.id}">${esc(p.nome)}</a></td><td class="num r">${faz} anos</td>
          <td class="r fin-acts">${enviado ? `<span class="pill confirmado">parabéns enviado</span>` : botaoWaCrm(p.telefone, "aniversario", p, { paciente_id: p.id })}</td></tr>`; }).join("")}
      </tbody></table></div>` : `<p class="empty">Nenhum aniversariante nos próximos 7 dias.</p>`}</section>`;
  } else {
    corpo = `<section class="panel"><h2>Pacientes para reativar</h2><p class="sub">Não vêm há mais de 1 ano e não têm consulta nem retorno marcados. Um convite para revisão costuma trazer de volta.</p>
      ${L.reativar.length ? `<div class="tbl-wrap"><table class="tbl fin-tbl"><thead><tr><th>Paciente</th><th>Última visita</th><th>Último contato</th><th></th></tr></thead><tbody>
      ${L.reativar.slice(0, 200).map(p => { const i = L.ultInt(x => x.paciente_id === p.id);

          <td>${i ? `${quandoTxt(i.criado_em)} · ${esc(ASSUNTOS[i.assunto])}` : "—"}</td><td class="r fin-acts">${botaoWaCrm(p.telefone, "reativacao", p, { paciente_id: p.id })}<button type="button" class="btn" data-retorno="${p.id}">Definir retorno</button></td></tr>`; }).join("")}
      </tbody></table></div>${L.reativar.length > 200 ? `<p class="note">Mostrando os 200 mais antigos de ${L.reativar.length}.</p>` : ""}` : `<p class="empty">Nenhum paciente parado há mais de 1 ano.</p>`}</section>`;

  $("#root").innerHTML = `<div class="app">${cabecalhoHTML()}

      ${tile("reativar", "Para reativar", L.reativar.length, "mais de 1 ano sem vir")}
    </div>
    ${corpo}

  const nv = $("#crmNovo"); if (nv) nv.onclick = () => abrirContato(null);
  document.querySelectorAll("[data-contato]").forEach(c => { c.onclick = ev => { if (ev.target.closest("a,button")) return; abrirContato(L.contatos.find(x => x.id === c.dataset.contato)); };
    c.onkeydown = e => { if (e.key === "Enter") c.onclick(e); }; });
  document.querySelectorAll("[data-avanca]").forEach(b => b.onclick = async () => { const c = L.contatos.find(x => x.id === b.dataset.avanca); b.disabled = true;
    try{ await api.salvarContato({ id: c.id, etapa: { novo: "avaliacao", avaliacao: "orcamento" }[c.etapa] }); toast(`${primeiroNome(c.nome)} → ${ETAPAS[{ novo: "avaliacao", avaliacao: "orcamento" }[c.etapa]]}`); carregar(); }
    catch(e){ toast(erroAmigavel(e)); b.disabled = false; } });
  document.querySelectorAll("[data-retorno]").forEach(b => b.onclick = () => abrirRetorno((E.crmPacs || []).find(p => p.id === b.dataset.retorno), () => carregar()));
  document.querySelectorAll("[data-nota]").forEach(b => b.onclick = () => abrirNota(JSON.parse(b.dataset.nota), () => carregar()));
}

/* Registrar um contato (ligação, conversa, anotação) */
function abrirNota(ref, depois){
  const dlg = $("#dlgFin");
  dlg.innerHTML = `<form class="dlg" id="fNota" novalidate><header><div><h3>Registrar contato</h3><p>${esc(ref.nome || "")}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body"><div class="field"><label>Como foi</label><div class="seg" role="group">${Object.entries(TIPOS_INT).map(([k, r], i) => `<button type="button" data-ti="${k}" aria-pressed="${i === 1}">${r}</button>`).join("")}</div></div>
      <div class="field"><label for="ntTxt">O que foi conversado</label><textarea id="ntTxt" rows="3" placeholder="Ex.: vai conversar com o marido e responde na sexta; pediu parcelar em 10×"></textarea></div><div class="err" id="eNt" hidden></div></div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary">Registrar</button></footer></form>`;
  let tipo = "ligacao";
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  dlg.querySelectorAll("[data-ti]").forEach(b => b.onclick = () => { tipo = b.dataset.ti; dlg.querySelectorAll("[data-ti]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  $("#fNota", dlg).onsubmit = async ev => { ev.preventDefault(); const t = $("#ntTxt", dlg).value.trim(), err = $("#eNt", dlg);
    if (t.length < 3){ err.textContent = "Escreva um resumo do contato."; err.hidden = false; return; }
    try{ await api.registrarInteracao({ contato_id: ref.contato_id || null, paciente_id: ref.paciente_id || null, orcamento_id: ref.orcamento_id || null, tipo, assunto: ref.assunto || "outro", texto: t });
      dlg.close(); toast("Contato registrado"); depois && depois(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; } };
  dlg.showModal(); setTimeout(() => $("#ntTxt", dlg)?.focus(), 30);
}

/* Contato do funil: dados, etapa, histórico, virar paciente */

  const dlg = $("#dlgFin"), novo = !c;

  const pinta = () => {
    dlg.innerHTML = `<form class="dlg" id="fCont" novalidate><header><div><h3>${novo ? "Novo contato" : esc(st.nome)}</h3><p>${novo ? "Alguém que procurou o consultório" : `${ETAPAS[st.etapa]} · entrou ${quandoTxt(c.criado_em)}`}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">

        <div class="grid2"><div class="field"><label for="ctOrig">Como chegou</label><select id="ctOrig">${ORIGENS.map(o => `<option ${o === st.origem ? "selected" : ""}>${o}</option>`).join("")}</select></div>

          <div class="field"><label for="ctProx">Próxima ação (lembrete)</label><input id="ctProx" type="date" value="${esc(st.proxima_acao || "")}"></div></div>
        <div class="field"><label>Etapa</label><div class="seg crm-etapas" role="group">${Object.entries(ETAPAS).map(([k, r]) => `<button type="button" data-et="${k}" aria-pressed="${st.etapa === k}">${r}</button>`).join("")}</div></div>
        ${st.etapa === "perdido" ? `<div class="field"><label for="ctPerda">Por que não fechou</label><input id="ctPerda" list="lPerda" value="${esc(st.motivo_perda || "")}"><datalist id="lPerda"><option value="Achou caro"><option value="Foi para outro dentista"><option value="Parou de responder"><option value="Só queria saber o preço"><option value="Mudou de cidade"></datalist></div>` : ""}
        <div class="field"><label for="ctObs">Observação</label><textarea id="ctObs" rows="2">${esc(st.observacao || "")}</textarea></div>
        ${!novo ? `<div class="crm-hist"><div class="odo-head"><h3 class="fin-h3" style="margin:0">Histórico</h3><div class="group">${botaoWaCrm(st.telefone, "contato", st, { contato_id: c.id })}<button type="button" class="btn" id="ctNota">Registrar contato</button></div></div>
          ${hist.length ? `<ul class="fin-mini">${hist.map(i => `<li><b>${dataBR(i.criado_em)}</b> · ${esc(TIPOS_INT[i.tipo])}${i.texto ? ": " + esc(i.texto) : ""}</li>`).join("")}</ul>` : `<p class="note" style="margin:6px 0 0">Nenhum contato registrado ainda.</p>`}</div>` : ""}
        <div class="err" id="eCt" hidden></div>

      <footer>${!novo ? (c.paciente_id ? `<a class="btn ghost" href="#paciente/${c.paciente_id}" style="margin-right:auto">Abrir ficha do paciente</a>` : `<button type="button" class="btn ghost" id="ctPac" style="margin-right:auto">Virar paciente e marcar avaliação</button>`) : ""}
        <button type="button" class="btn ghost" data-fechar>Fechar</button><button type="submit" class="btn primary" id="ctOk">Salvar</button></footer></form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    dlg.querySelector(".crm-hist a[data-crmwa]")?.addEventListener("click", () => setTimeout(async () => { hist = await api.interacoes({ contato_id: c.id }).catch(() => hist); guarda(); pinta(); }, 500));
    dlg.querySelectorAll("[data-et]").forEach(b => b.onclick = () => { guarda(); st.etapa = b.dataset.et; pinta(); });
    const nt = $("#ctNota", dlg); if (nt) nt.onclick = () => { guarda(); abrirNota({ contato_id: c.id, assunto: "contato", nome: st.nome }, () => abrirContato({ ...c, ...st })); };
    const err = $("#eCt", dlg), erro = m => { err.textContent = m; err.hidden = false; };

      if (st.etapa === "perdido" && !(st.motivo_perda || "").trim()) return "Diga por que não fechou."; return ""; };
    const dados = () => ({ nome: st.nome.trim(), telefone: soDigitos(st.telefone) || null, origem: st.origem, interesse: (st.interesse || "").trim() || null, profissional_id: st.profissional_id || null,

      vp.disabled = true;
      try{
        const pac = await api.criarPaciente({ nome: st.nome.trim(), telefone: soDigitos(st.telefone), como_conheceu: st.origem, ...(st.profissional_id ? { dentista_responsavel: st.profissional_id } : {}) });
        await api.salvarContato({ id: c.id, ...dados(), paciente_id: pac.id, etapa: st.etapa === "novo" ? "avaliacao" : st.etapa });

}

/* ---------- Controle de próteses (serviços protéticos) ----------
   Cada trabalho é uma ordem de serviço: moldagem → no laboratório → prova → (ajuste) → pronta → instalada.
   Ao instalar, o custo pode ir para Contas a pagar (por conta da dentista do caso) e o paciente ganha
   retorno de manutenção. */
const ETAPAS_PR = { moldagem: "Moldagem / a enviar", enviado: "No laboratório", ajuste: "No laboratório (ajuste)", prova: "Prova com o paciente", pronto: "Pronta para instalar", instalado: "Instalada", cancelado: "Cancelada" };
const COLS_PR = [["moldagem", "Moldagem / a enviar", ["moldagem"]], ["lab", "No laboratório", ["enviado", "ajuste"]], ["prova", "Prova com o paciente", ["prova"]], ["pronto", "Pronta para instalar", ["pronto"]], ["instalado", "Instalada (30 dias)", ["instalado"]]];
const noLab = p => ["enviado", "ajuste"].includes(p.etapa);
const atrasadaPr = p => noLab(p) && p.prazo && p.prazo < hojeStr();
const dentesTxt = d => (d || []).length ? "dente" + (d.length > 1 ? "s " : " ") + d.join(", ") : "";
const ACOES_PR = {
  moldagem: [["enviar", "Enviar ao laboratório"]],
  enviado: [["chegou_prova", "Chegou para prova"], ["chegou_pronta", "Chegou pronta"]],
  ajuste: [["chegou_prova", "Chegou para prova"], ["chegou_pronta", "Chegou pronta"]],
  prova: [["aprovada", "Aprovada na prova"], ["ajuste", "Voltar ao laboratório"]],
  pronto: [["instalar", "Instalada"]],
};
function msgLab(p, tipo){
  const pac = p.paciente?.nome ? primeiroNome(p.paciente.nome) + " " + (p.paciente.nome.trim().split(/\s+/).slice(-1)[0] || "").charAt(0) + "." : "";
  const dent = nomeDent(p.profissional_id);
  if (tipo === "cobrar") return `Olá! Aqui é do ${CONSULTORIO} (${dent}). Como está a ordem de serviço nº ${p.numero} (${p.trabalho}${p.dentes?.length ? ", " + dentesTxt(p.dentes) : ""}, paciente ${pac})? O prazo combinado era ${dataBR(p.prazo)}. Obrigada!`;
  return [`Olá! Aqui é do ${CONSULTORIO} (${dent}). Segue a ordem de serviço nº ${p.numero}:`, `• Trabalho: ${p.trabalho}`, p.dentes?.length ? `• ${dentesTxt(p.dentes).replace(/^d/, "D")}` : "", p.cor ? `• Cor: ${p.cor}` : "", p.material ? `• Material: ${p.material}` : "",
    `• Paciente: ${pac}`, p.prazo ? `• Prazo: ${dataBR(p.prazo)}` : "", p.observacao ? `• Observação: ${p.observacao}` : "", "Obrigada!"].filter(Boolean).join("\n");
}
const waLab = (p, tipo) => { const f = p.laboratorio?.whatsapp || p.laboratorio?.telefone; return f ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${numWhats(f)}?text=${encodeURIComponent(msgLab(p, tipo))}">${tipo === "cobrar" ? "Cobrar laboratório" : "WhatsApp laboratório"}</a>` : ""; };

async function carregarProteses(){
  try{ [E.prLabs, E.prList] = await Promise.all([api.laboratorios(), api.proteses()]); E.prFalta = false; }
  catch(e){ const m = String(e.message || e);
    if (/(proteses|laboratorios)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m)) toast("Falta rodar o arquivo 19_proteses.sql no Supabase para usar o controle de próteses."); else toast(erroAmigavel(e));
    E.prLabs = []; E.prList = []; E.prFalta = true; }
}
function desenharProteses(){
  const q = semAcento((E.prBusca || "").trim()), l = (E.prList || []).filter(p => !q || semAcento([p.paciente?.nome, p.trabalho, p.laboratorio?.nome, "n" + p.numero].join(" ")).includes(q));
  const mesStr = hojeStr().slice(0, 7);
  const lab = l.filter(noLab), atras = l.filter(atrasadaPr), prontas = l.filter(p => p.etapa === "pronto"), inst = l.filter(p => p.etapa === "instalado" && (p.instalado_em || "").slice(0, 7) === mesStr);
  const tile = (rot, val, sub, cls = "") => `<div class="tile ${cls}"><span>${rot}</span><b class="num">${val}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  const card = p => { const at = atrasadaPr(p);
    return `<div class="crm-card pr-card" data-prot="${p.id}" tabindex="0"><b>${esc(p.paciente?.nome || "")}</b>
      <small>Nº ${p.numero} · ${esc(p.trabalho)}${p.dentes?.length ? " · " + esc(dentesTxt(p.dentes)) : ""}</small>
      <small>${esc(p.laboratorio?.nome || "sem laboratório")}${noLab(p) && p.prazo ? ` · <span class="${at ? "crm-atras" : ""}">prazo ${dataBR(p.prazo).slice(0, 5)}${at ? " (atrasada)" : ""}</span>` : ""}${p.etapa === "instalado" ? ` · instalada ${dataBR(p.instalado_em).slice(0, 5)}` : ""}${p.etapa === "ajuste" ? " · ajuste" : ""}</small>
      ${ACOES_PR[p.etapa] ? `<div class="crm-acts">${at ? waLab(p, "cobrar") : `<span></span>`}<button type="button" class="btn" data-pracao="${p.id}|${ACOES_PR[p.etapa][0][0]}">${ACOES_PR[p.etapa][0][1]}</button></div>` : ""}</div>`; };
  $("#root").innerHTML = `<div class="app">${cabecalhoHTML()}
    <div class="tools">
      <input id="prtBusca" class="search-in" type="search" placeholder="Buscar paciente, trabalho, laboratório ou nº" value="${esc(E.prBusca || "")}" autocomplete="off" aria-label="Buscar prótese">
      <div class="group"><button type="button" class="btn" id="prtLabs">Laboratórios (${(E.prLabs || []).filter(x => x.ativo).length})</button>${souDentista() || api.demo ? `<button type="button" class="btn primary" id="prtNova">+ Nova prótese</button>` : ""}</div>
    </div>
    ${E.prFalta ? `<p class="err">Para usar o controle de próteses, rode o arquivo 19_proteses.sql no Supabase.</p>` : ""}
    <div class="tiles fin-tiles fin-top">
      ${tile("No laboratório", lab.length, lab.length ? "aguardando o laboratório" : "nenhuma")}
      ${tile("Atrasadas", atras.length, atras.length ? "passaram do prazo" : "nada atrasado", atras.length ? "bad" : "")}
      ${tile("Prontas para instalar", prontas.length, prontas.length ? "marcar com o paciente" : "", prontas.length ? "ok" : "")}
      ${tile("Instaladas no mês", inst.length, "")}
    </div>
    <section class="panel"><div class="odo-head"><div><h2>Próteses</h2><p class="sub" style="margin:0">Cada cartão é uma ordem de serviço. O botão do cartão avança a etapa; clique no cartão para ver tudo, mandar o pedido ao laboratório ou cancelar.</p></div></div>
      <div class="crm-funil pr-funil">${COLS_PR.map(([k, rot, ets]) => { const c = l.filter(p => ets.includes(p.etapa) && (k !== "instalado" || diasDesde(p.instalado_em) <= 30))
        .sort((a, b) => String(a.prazo || a.criado_em).localeCompare(String(b.prazo || b.criado_em)));
        return `<div class="crm-col" data-etapa="${k}"><h3>${rot} <span class="num">${c.length}</span></h3>${c.map(card).join("") || `<p class="note crm-vazio">—</p>`}</div>`; }).join("")}</div>
    </section>
  </div>`;
  ligarSair();
  $("#prtBusca").oninput = e => { E.prBusca = e.target.value; const pos = e.target.selectionStart; desenhar(); const i = $("#prtBusca"); i.focus(); i.setSelectionRange(pos, pos); };
  $("#prtLabs").onclick = () => abrirLabs();
  const nv = $("#prtNova"); if (nv) nv.onclick = () => abrirProtese(null);
  document.querySelectorAll("[data-prot]").forEach(c => { c.onclick = ev => { if (ev.target.closest("a,button")) return; abrirProtese((E.prList || []).find(p => p.id === c.dataset.prot)); };
    c.onkeydown = e => { if (e.key === "Enter") c.onclick(e); }; });
  document.querySelectorAll("[data-pracao]").forEach(b => b.onclick = () => { const [id, a] = b.dataset.pracao.split("|"); acaoProtese((E.prList || []).find(p => p.id === id), a); });
}

/* Avançar a etapa (com data) */
function acaoProtese(p, acao){
  const dlg = $("#dlgFin"), labp = (E.prLabs || []).find(x => x.id === p.laboratorio_id);
  const tit = { enviar: "Enviar ao laboratório", chegou_prova: "Chegou para prova", chegou_pronta: "Chegou pronta", aprovada: "Aprovada na prova", ajuste: "Voltar ao laboratório", instalar: "Prótese instalada" }[acao];
  const vaiLab = acao === "enviar" || acao === "ajuste", chegou = acao === "chegou_prova" || acao === "chegou_pronta";
  const podeLancar = acao === "instalar" && Number(p.custo) > 0 && !p.despesa_id && podeDespesas();
  dlg.innerHTML = `<form class="dlg" id="fPrA" novalidate><header><div><h3>${tit}</h3><p>Nº ${p.numero} · ${esc(p.paciente?.nome || "")} · ${esc(p.trabalho)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="grid2"><div class="field"><label for="paData">Data</label><input id="paData" type="date" value="${hojeStr()}" max="${hojeStr()}"></div>
        ${vaiLab ? `<div class="field"><label for="paPrazo">Prazo do laboratório</label><input id="paPrazo" type="date" value="${inputData(somaDias(new Date(), labp?.prazo_dias || 7))}"><small class="note">${labp ? `${esc(labp.nome)}: ${labp.prazo_dias} dias em média` : ""}</small></div>` : "<div></div>"}</div>
      ${vaiLab && !p.laboratorio_id ? `<p class="err" style="margin:0">Escolha o laboratório na ordem de serviço antes de enviar.</p>` : ""}
      ${chegou ? `<label class="chk"><input type="checkbox" id="paMarcar" checked> Marcar a ${acao === "chegou_prova" ? "prova" : "instalação"} na agenda agora</label>` : ""}
      ${podeLancar ? `<label class="chk"><input type="checkbox" id="paDesp" checked> Lançar o custo do laboratório (${brl(p.custo)}) em Contas a pagar, por conta da ${esc(nomeDent(p.profissional_id))}</label>` : ""}
      ${acao === "instalar" && p.garantia_meses ? `<label class="chk"><input type="checkbox" id="paRet" checked> Marcar retorno de manutenção do paciente em ${p.garantia_meses} meses</label>` : ""}
      <div class="err" id="ePa" hidden></div></div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="paOk">Confirmar</button></footer></form>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#fPrA", dlg).onsubmit = async ev => {
    ev.preventDefault(); const err = $("#ePa", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const d = $("#paData", dlg).value; if (!d) return erro("Escolha a data.");
    if (vaiLab && !p.laboratorio_id) return erro("Escolha o laboratório na ordem de serviço.");
    const c = vaiLab ? { etapa: acao === "enviar" ? "enviado" : "ajuste", enviado_em: d, prazo: $("#paPrazo", dlg).value || null }
      : chegou ? { etapa: acao === "chegou_prova" ? "prova" : "pronto", chegou_em: d }
      : acao === "aprovada" ? { etapa: "pronto" } : { etapa: "instalado", instalado_em: d };
    $("#paOk", dlg).disabled = true;
    try{
      let r = await api.salvarProtese({ id: p.id, ...c });
      if (acao === "instalar"){
        if ($("#paDesp", dlg)?.checked){
          const venc = labp?.cobranca === "mensal" ? vencNoMes(somaMeses(primeiroDia(d), 1), 10) : d;
          const [ds] = await api.criarDespesas([{ descricao: `Laboratório — ${p.trabalho} (${p.paciente?.nome || ""}, OS ${p.numero})`, categoria: "laboratorio", fornecedor: labp?.nome || null,
            competencia: primeiroDia(venc), vencimento: venc, valor_total: Number(p.custo), pct_consultorio: 100, em_nome_de: p.profissional_id || null, arca_profissional_id: p.profissional_id || null, dedutivel: true, parcela: 1, parcelas: 1 }]);
          r = await api.salvarProtese({ id: p.id, despesa_id: ds.id });
        }
        if ($("#paRet", dlg)?.checked) await api.atualizarPaciente(p.paciente_id, { retorno_em: somaMeses(d, p.garantia_meses), retorno_motivo: "Manutenção da prótese" }).catch(() => {});
      }
      dlg.close(); toast(ETAPAS_PR[r.etapa] || "Atualizado");
      if (chegou && $("#paMarcar", dlg)?.checked){ abrirForm({ data: inputData(somaDias(new Date(), 1)), paciente: p.paciente, profissional_id: p.profissional_id || undefined }); }
      carregar();
    }catch(e){ erro(erroAmigavel(e)); $("#paOk", dlg).disabled = false; }
  };
  dlg.showModal();
}

/* Ordem de serviço: criar / ver / editar / cancelar */
async function abrirProtese(p){
  const dlg = $("#dlgFin"), nova = !p, fechada = p && ["instalado", "cancelado"].includes(p.etapa);
  const labs = (E.prLabs || []).filter(x => x.ativo || x.id === p?.laboratorio_id);
  const st = nova ? { paciente: null, profissional_id: dentPadrao(), laboratorio_id: labs[0]?.id || "", trabalho: "", dentes: "", cor: "", material: "", custo: "", garantia_meses: 12, observacao: "" }
    : { ...p, dentes: (p.dentes || []).join(", "), custo: p.custo == null ? "" : fmtValor(p.custo) };
  const pacs = nova ? await api.listarPacientes("", false).catch(() => []) : [];
  const procs = (E.procs && E.procs.length ? E.procs : await api.procedimentos().catch(() => [])).filter(x => /prót|coroa|faceta|lente|inlay|onlay|overlay|protocolo|ppr|dentadura|placa|provis/i.test(x.nome));
  const hist = nova ? [] : await api.eventosProtese(p.id).catch(() => []);
  let cancelando = false;
  const pinta = () => {
    const dis = fechada ? "disabled" : "";
    dlg.innerHTML = `<form class="dlg" id="fPr" novalidate><header><div><h3>${nova ? "Nova prótese" : `Prótese nº ${p.numero}`}</h3><p>${nova ? "Ordem de serviço para o laboratório" : `${esc(p.paciente?.nome || "")} · ${ETAPAS_PR[p.etapa]}`}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        ${p?.etapa === "cancelado" ? `<p class="err" style="margin:0">Cancelada: ${esc(p.motivo_cancelamento || "")}</p>` : ""}
        ${nova ? `<div class="field"><label for="prPac">Paciente</label><input id="prPac" list="lPrPac" autocomplete="off" placeholder="Digite o nome" value="${esc(st.paciente?.nome || "")}"><datalist id="lPrPac">${pacs.map(x => `<option value="${esc(x.nome)}">`).join("")}</datalist></div>` : ""}
        <div class="grid2"><div class="field"><label for="prTrab">Trabalho</label><input id="prTrab" list="lPrTrab" value="${esc(st.trabalho)}" placeholder="Ex.: Coroa em porcelana" ${dis}><datalist id="lPrTrab">${procs.map(x => `<option value="${esc(x.nome)}">`).join("")}</datalist></div>
          <div class="field"><label for="prDentes">Dentes</label><input id="prDentes" value="${esc(st.dentes)}" placeholder="Ex.: 11, 21" ${dis}></div></div>
        <div class="grid3"><div class="field"><label for="prCor">Cor</label><input id="prCor" value="${esc(st.cor || "")}" placeholder="Ex.: A2" ${dis}></div>
          <div class="field"><label for="prMat">Material</label><input id="prMat" value="${esc(st.material || "")}" placeholder="Ex.: dissilicato" ${dis}></div>
          <div class="field"><label for="prCusto">Custo do laboratório (R$)</label><input id="prCusto" inputmode="decimal" value="${esc(st.custo)}" ${dis}></div></div>
        <div class="grid3"><div class="field"><label for="prDent">Dentista</label><select id="prDent" ${dis}>${E.equipe.map(e => `<option value="${e.id}" ${e.id === st.profissional_id ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>
          <div class="field"><label for="prLab">Laboratório</label><select id="prLab" ${dis}><option value="">— escolha —</option>${labs.map(x => `<option value="${x.id}" ${x.id === st.laboratorio_id ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select></div>
          <div class="field"><label for="prGar">Garantia (meses)</label><input id="prGar" type="number" min="0" max="120" value="${st.garantia_meses}" ${dis}></div></div>
        <div class="field"><label for="prObs">Observação para o laboratório</label><textarea id="prObs" rows="2" ${dis}>${esc(st.observacao || "")}</textarea></div>
        ${!nova ? `<dl class="kv">${p.enviado_em ? `<dt>Enviada</dt><dd class="num">${dataBR(p.enviado_em)}${p.prazo ? ` · prazo ${dataBR(p.prazo)}${atrasadaPr(p) ? ' <b class="crm-atras">atrasada</b>' : ""}` : ""}</dd>` : ""}
          ${p.chegou_em ? `<dt>Chegou</dt><dd class="num">${dataBR(p.chegou_em)}</dd>` : ""}${p.instalado_em ? `<dt>Instalada</dt><dd class="num">${dataBR(p.instalado_em)}${p.garantia_meses ? ` · garantia até ${dataBR(somaMeses(p.instalado_em, p.garantia_meses))}` : ""}</dd>` : ""}
          ${p.despesa_id ? `<dt>Custo</dt><dd>lançado em Contas a pagar</dd>` : ""}</dl>
          ${hist.length ? `<details class="ed-hist"><summary>Histórico (${hist.length})</summary><ul class="fin-mini">${hist.map(h => `<li><b>${dataBR(h.data)}</b> · ${esc(ETAPAS_PR[h.etapa] || h.etapa)}${h.observacao ? ": " + esc(h.observacao) : ""}</li>`).join("")}</ul></details>` : ""}
          ${!fechada ? `<div class="group">${(ACOES_PR[p.etapa] || []).map(([a, r]) => `<button type="button" class="btn" data-pa="${a}">${r}</button>`).join("")}${waLab(p, atrasadaPr(p) ? "cobrar" : "pedido")}</div>` : ""}
          <div id="boxPrC" ${cancelando ? "" : "hidden"}><div class="field"><label for="prMot">Motivo do cancelamento</label><input id="prMot" placeholder="Ex.: paciente desistiu; refazer com outra cor"></div></div>` : ""}
        <div class="err" id="ePr" hidden></div>
      </div>
      <footer>${!nova && !fechada ? `<button type="button" class="btn ghost danger" id="prCanc" style="margin-right:auto">${cancelando ? "Confirmar cancelamento" : "Cancelar prótese"}</button>` : ""}
        ${!nova ? `<a class="btn ghost" href="#paciente/${p.paciente_id}">Ficha</a>` : ""}<button type="button" class="btn ghost" data-fechar>Fechar</button>${fechada ? "" : `<button type="submit" class="btn primary" id="prOk">${nova ? "Criar" : "Salvar"}</button>`}</footer></form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    dlg.querySelectorAll("[data-pa]").forEach(b => b.onclick = () => acaoProtese(p, b.dataset.pa));
    const err = $("#ePr", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const cc = $("#prCanc", dlg);
    if (cc) cc.onclick = async () => { if (!cancelando){ Object.assign(st, lerSt()); cancelando = true; pinta(); $("#prMot", dlg).focus(); return; }
      const m = $("#prMot", dlg).value.trim(); if (m.length < 4) return erro("Escreva o motivo.");
      try{ await api.salvarProtese({ id: p.id, etapa: "cancelado", motivo_cancelamento: m }); dlg.close(); toast("Prótese cancelada"); carregar(); }catch(e){ erro(erroAmigavel(e)); } };
    const f = $("#fPr", dlg);
    f.onsubmit = async ev => { ev.preventDefault(); if (fechada) return;
      const v = lerSt(); let pac = p?.paciente;
      if (nova){ const nm = $("#prPac", dlg).value.trim(); pac = pacs.find(x => x.nome === nm) || pacs.find(x => semAcento(x.nome) === semAcento(nm)); if (!pac) return erro("Escolha o paciente da lista."); }
      if (v.trabalho.length < 3) return erro("Descreva o trabalho.");
      if (v.dentes.some(d => !(d >= 11 && d <= 85))) return erro("Dentes no padrão FDI, separados por vírgula (ex.: 11, 21).");
      if (v.custo !== null && (isNaN(v.custo) || v.custo < 0)) return erro("Custo inválido.");
      $("#prOk", dlg).disabled = true;
      try{ await api.salvarProtese(nova ? { paciente_id: pac.id, ...v } : { id: p.id, ...v }); dlg.close(); toast(nova ? "Prótese criada" : "Prótese salva"); carregar(); }
      catch(e){ erro(erroAmigavel(e)); $("#prOk", dlg).disabled = false; } };
  };
  const lerSt = () => { const g = s => $(s, dlg); if (!g("#prTrab")) return {};
    const ct = g("#prCusto").value.trim();
    return { trabalho: g("#prTrab").value.trim(), dentes: g("#prDentes").value.split(/[^\d]+/).filter(Boolean).map(Number), cor: g("#prCor").value.trim() || null, material: g("#prMat").value.trim() || null,
      custo: ct ? lerValor(ct) : null, profissional_id: g("#prDent").value || null, laboratorio_id: g("#prLab").value || null, garantia_meses: Number(g("#prGar").value) || 0, observacao: g("#prObs").value.trim() || null }; };
  pinta(); if (!dlg.open) dlg.showModal();
}

/* Laboratórios */
function abrirLabs(editar){
  const dlg = $("#dlgFin"), labs = (E.prLabs || []).slice().sort((a, b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome));
  if (editar !== undefined){
    const l = editar || { nome: "", whatsapp: "", telefone: "", endereco: "", prazo_dias: 7, cobranca: "peca", observacao: "", ativo: true };
    dlg.innerHTML = `<form class="dlg" id="fLab" novalidate><header><div><h3>${l.id ? "Laboratório" : "Novo laboratório"}</h3></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        <div class="field"><label for="lbNome">Nome</label><input id="lbNome" value="${esc(l.nome)}"></div>
        <div class="grid2"><div class="field"><label for="lbWa">WhatsApp</label><input id="lbWa" inputmode="tel" value="${esc(l.whatsapp || "")}"></div><div class="field"><label for="lbTel">Telefone</label><input id="lbTel" inputmode="tel" value="${esc(l.telefone || "")}"></div></div>
        <div class="field"><label for="lbEnd">Endereço</label><input id="lbEnd" value="${esc(l.endereco || "")}"></div>
        <div class="grid2"><div class="field"><label for="lbPrazo">Prazo médio (dias)</label><input id="lbPrazo" type="number" min="1" max="90" value="${l.prazo_dias}"></div>
          <div class="field"><label for="lbCob">Cobrança</label><select id="lbCob"><option value="peca" ${l.cobranca === "peca" ? "selected" : ""}>Por peça (paga na entrega)</option><option value="mensal" ${l.cobranca === "mensal" ? "selected" : ""}>Fechamento mensal (vence dia 10)</option></select></div></div>
        <div class="field"><label for="lbObs">Observação</label><input id="lbObs" value="${esc(l.observacao || "")}"></div>
        ${l.id ? `<label class="chk"><input type="checkbox" id="lbAt" ${l.ativo ? "checked" : ""}> Em uso</label>` : ""}
        <div class="err" id="eLb" hidden></div></div>
      <footer><button type="button" class="btn ghost" id="lbVolta">Voltar</button><button type="submit" class="btn primary">Salvar</button></footer></form>`;
    $("[data-fechar]", dlg).onclick = () => dlg.close(); $("#lbVolta", dlg).onclick = () => abrirLabs();
    $("#fLab", dlg).onsubmit = async ev => { ev.preventDefault(); const err = $("#eLb", dlg);
      const c = { nome: $("#lbNome", dlg).value.trim(), whatsapp: soDigitos($("#lbWa", dlg).value) || null, telefone: soDigitos($("#lbTel", dlg).value) || null, endereco: $("#lbEnd", dlg).value.trim() || null,
        prazo_dias: Number($("#lbPrazo", dlg).value) || 7, cobranca: $("#lbCob", dlg).value, observacao: $("#lbObs", dlg).value.trim() || null };
      const at = $("#lbAt", dlg); if (at) c.ativo = at.checked;
      if (c.nome.length < 2){ err.textContent = "Escreva o nome."; err.hidden = false; return; }
      try{ await api.salvarLaboratorio(l.id ? { id: l.id, ...c } : c); toast("Laboratório salvo"); await carregar(); abrirLabs(); }catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; } };
    if (!dlg.open) dlg.showModal(); return;
  }
  dlg.innerHTML = `<div class="dlg"><header><div><h3>Laboratórios</h3><p>Clique para editar</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">${labs.length ? `<div class="list">${labs.map(l => `<button type="button" class="li pn-link lab-li" data-lab="${l.id}"><span class="n">${esc(l.nome)}${l.ativo ? "" : " (fora de uso)"}<small>${l.prazo_dias} dias · ${l.cobranca === "mensal" ? "fechamento mensal" : "por peça"}${l.whatsapp ? " · WhatsApp " + esc(l.whatsapp) : ""}</small></span></button>`).join("")}</div>` : `<p class="empty">Nenhum laboratório.</p>`}</div>
    <footer><button type="button" class="btn ghost" data-fechar>Fechar</button><button type="button" class="btn primary" id="lbNovo">+ Novo laboratório</button></footer></div>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#lbNovo", dlg).onclick = () => abrirLabs(null);
  dlg.querySelectorAll("[data-lab]").forEach(b => b.onclick = () => abrirLabs(labs.find(l => l.id === b.dataset.lab)));
  if (!dlg.open) dlg.showModal();
}


/* ---------- Receita Saúde: arquivo para emitir os recibos em lote no Carnê-Leão Web ----------
   Leiaute do manual Receita Saúde v2.1 (perguntas 24 e 25): CSV com ";" e até 1.000 linhas, um
   recibo por linha, todos do mesmo ano. Campos: data; R01.001.001; 226 (odontólogo); valor;
   (dedução vazia); descrição; PF; CPF do pagador; CPF do beneficiário; ; ; ; ; S; CPF da dentista;
   registro profissional (vazio quando só há um registro ativo). */
const tiraAcento = s => String(s || "").normalize("NFD").replace(/\p{Diacritic}/gu, "");
function pagadorBenef(pac){
  const menor = (idade(pac?.data_nascimento) ?? 99) < 18, cpf = soDigitos(pac?.cpf), rcpf = soDigitos(pac?.responsavel_cpf);
  if (menor && rcpf.length === 11) return { pag: rcpf, ben: cpf, falta: cpf.length === 11 ? "" : "CPF do paciente" };
  if (menor) return { pag: "", ben: cpf, falta: "CPF do responsável" };
  return { pag: cpf, ben: cpf, falta: cpf.length === 11 ? "" : "CPF do paciente" };
}
function linhaReceitaSaude(r, cpfProf){
  const pb = pagadorBenef(r.paciente);
  const ref = tiraAcento(r.parcela?.descricao || r.descricao || "").replace(/[\u2013\u2014]/g, "-").replace(/[^\x20-\x7E]/g, "").replace(/;/g, ",").replace(/\s+/g, " ").trim();
  const desc = ("Servicos odontologicos" + (ref ? " - " + ref : "")).slice(0, 255);
  return [dataBR(r.data), "R01.001.001", "226", Number(r.valor).toFixed(2).replace(".", ","), "", desc, "PF", pb.pag, pb.ben, "", "", "", "", "S", cpfProf, ""].join(";");
}
function baixarArquivo(nome, texto, tipo = "text/csv;charset=utf-8"){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function receitaSaudeLista(){
  return (E.finRecsMes || []).filter(r => r.profissional_id === E.rsProf && (!r.estornado || r.receita_saude_em))
    .sort((a, b) => a.data.localeCompare(b.data)).map(r => {
      const pb = pagadorBenef(r.paciente);
      const sit = r.estornado ? "estornado" : r.receita_saude_em ? "emitido" : pb.falta ? "falta" : "pendente";
      return { r, pb, sit };
    });
}
function receitaSaudeHTML(){
  const d = dentista(E.rsProf), cpfProf = soDigitos(E.cpfProfs?.[E.rsProf]), l = receitaSaudeLista();
  const pend = l.filter(x => x.sit === "pendente"), falta = l.filter(x => x.sit === "falta"), est = l.filter(x => x.sit === "estornado");
  const pode = editoPrecos() || souDentista() || E.usuario?.papel === "gestor";
  const SIT = { pendente: ["Pendente", "agendado"], emitido: ["Emitido", "confirmado"], falta: ["Falta dado", "vence-hoje"], estornado: ["Estornado: cancelar o recibo", "faltou"] };
  return `<section class="panel" id="rsaude">
    <div class="odo-head"><div><h2>Receita Saúde <small class="dobra-res" style="display:inline">· recibos para o Imposto de Renda</small></h2>
      <p class="sub" style="margin:0">O sistema monta o arquivo com os pagamentos do mês; no e-CAC (Carnê-Leão) você importa e todos os recibos são emitidos de uma vez.</p></div>
      <div class="seg" role="group" aria-label="Dentista">${E.equipe.map(e => `<button type="button" data-rsp="${e.id}" aria-pressed="${E.rsProf === e.id}">${esc(curto(e))}</button>`).join("")}</div></div>
    ${E.cfgFalta ? `<p class="err" style="margin-top:10px">Rode o arquivo 13_configuracoes.sql no Supabase para usar esta parte.</p>` : `
    <div class="group" style="margin-top:10px">
      <label class="chk">CPF da ${esc(curto(d))} <input id="rsCpf" class="fin-in num" inputmode="numeric" placeholder="000.000.000-00" value="${esc(fmtCpf(cpfProf))}" ${pode ? "" : "disabled"}></label>
      ${pode ? `<button type="button" class="btn" id="rsCpfSalvar">Salvar CPF</button>` : ""}
      ${cpfProf.length === 11 ? "" : `<span class="note" style="color:var(--warn);font-weight:600">Informe o CPF da dentista: ele vai em cada recibo.</span>`}
    </div>
    ${l.length ? `<div class="tbl-wrap" style="margin-top:10px"><table class="tbl fin-tbl"><thead><tr><th>Data</th><th>Paciente</th><th>Quem pagou (CPF)</th><th class="r">Valor</th><th>Recibo</th></tr></thead><tbody>

function ligarReceitaSaude(){
  document.querySelectorAll("[data-rsp]").forEach(b => b.onclick = () => { E.rsProf = b.dataset.rsp; const el = $("#rsaude"); el.outerHTML = receitaSaudeHTML(); ligarReceitaSaude(); });
  const cs = $("#rsCpfSalvar");
  if (cs) cs.onclick = async () => {
    const v = soDigitos($("#rsCpf").value);
    if (v && !cpfValido(v)) return toast("CPF inválido. Confira os números.");
    cs.disabled = true;
    try{ E.cpfProfs = { ...(E.cpfProfs || {}), [E.rsProf]: v || null }; await api.salvarConfig("cpf_profissionais", E.cpfProfs); toast("CPF salvo"); const el = $("#rsaude"); el.outerHTML = receitaSaudeHTML(); ligarReceitaSaude(); }
    catch(e){ toast(erroAmigavel(e)); cs.disabled = false; }
  };
  const bx = $("#rsBaixar");
  if (bx) bx.onclick = () => {
    const pend = receitaSaudeLista().filter(x => x.sit === "pendente"), cpfProf = soDigitos(E.cpfProfs?.[E.rsProf]);
    if (pend.length > 1000) return toast("Mais de 1.000 recibos: o Carnê-Leão aceita até 1.000 por arquivo.");
    const nome = tiraAcento(curto(dentista(E.rsProf))).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const mes = `${E.finMes.getFullYear()}-${String(E.finMes.getMonth() + 1).padStart(2, "0")}`;
    baixarArquivo(`receita-saude-${nome}-${mes}.csv`, pend.map(x => linhaReceitaSaude(x.r, cpfProf)).join("\r\n") + "\r\n");
    toast("Arquivo baixado. Depois de importar no Carnê-Leão, clique em “Marcar como emitidos”.");
  };
  const mk = $("#rsMarcar");
  if (mk) confirmaDuplo(mk, "Confirmar: já importei no Carnê-Leão", async () => {
    const ids = receitaSaudeLista().filter(x => x.sit === "pendente").map(x => x.r.id);
    try{ await api.marcarReceitaSaude(ids, true); toast("Recibos marcados como emitidos"); await carregar(); }
    catch(e){ toast(erroAmigavel(e)); }
  });
  document.querySelectorAll("#rsaude tr[data-rsid]").forEach(tr => {
    tr.onclick = () => {
      const lin = receitaSaudeLista().find(x => x.r.id === tr.dataset.rsid); if (!lin) return;
      if (lin.sit === "emitido" || lin.sit === "estornado") return desmarcarReceitaSaude(lin.r);
      if (lin.sit === "falta"){ E.cadMais = true; }
      location.hash = "#paciente/" + tr.dataset.fpac;
    };
    tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); };
  });
}

async function fazerBackup(){

}

  const ini6 = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1), iniMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const nada = () => [];
  const [ag, prox, recs, abertas, orcs, novos, desp, prot] = await Promise.all([
    api.agenda(hoje, somaDias(hoje, 1)).catch(nada), api.agenda(alvo, somaDias(alvo, 1)).catch(nada),
    api.recebimentosPeriodo(inputData(ini6), hojeStr()).catch(nada), api.parcelasAbertas().catch(nada),

  Object.assign(E, { pnHoje: ag, pnProx: prox, pnProxDia: alvo, pnRecs: recs, pnAbertas: abertas, pnOrcs: orcs, pnNovos: novos, pnDesp: desp, pnProt: prot });

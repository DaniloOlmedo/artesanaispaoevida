      cpf: soDigitos(v.cpf) || null, data_nascimento: v.data_nascimento || null, sexo: v.sexo || null,
      como_conheceu: v.como_conheceu || null, endereco: v.endereco || null,
      cep: soDigitos(v.cep) || null, numero: v.numero || null, complemento: v.complemento || null,
      bairro: v.bairro || null, cidade: v.cidade || null, uf: (v.uf || "").toUpperCase() || null,
      responsavel: v.responsavel || null, observacoes: v.observacoes || null,
    };
    if ("ativo" in v) c.ativo = v.ativo;
    if (v.dentista_responsavel || "dentista_responsavel" in p) c.dentista_responsavel = v.dentista_responsavel || null;
    if (soDigitos(v.responsavel_cpf) || "responsavel_cpf" in p) c.responsavel_cpf = soDigitos(v.responsavel_cpf) || null;
    if (c.responsavel_cpf && !cpfValido(c.responsavel_cpf)) return erro("O CPF do responsável não é válido. Confira ou deixe em branco.");
    if (c.nome.split(" ").length < 2) return erro("Informe nome e sobrenome do paciente.");
    if (!c.telefone || c.telefone.length < 10) return erro("Informe o WhatsApp ou telefone com DDD (10 ou 11 dígitos).");
    if (c.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) return erro("O e-mail parece incompleto. Confira ou deixe em branco.");
    if (c.cpf && !cpfValido(c.cpf)) return erro("O CPF não é válido. Confira os números ou deixe em branco.");
    if (c.data_nascimento && new Date(c.data_nascimento) > new Date()) return erro("A data de nascimento está no futuro.");
    if (c.cep && c.cep.length !== 8) return erro("O CEP precisa ter 8 números. Confira ou deixe em branco.");
    if (c.uf && !/^[A-Z]{2}$/.test(c.uf)) return erro("A UF são duas letras, por exemplo SP.");
    const a = idade(c.data_nascimento);
    if (a !== null && a < 18 && !c.responsavel){ $("#boxResp").hidden = false; return erro("Paciente menor de idade: informe o responsável."); }
    const bt = $("#pSalvar"); bt.disabled = true;
    try{
      if (novo){
        const r = await api.criarPaciente(c);
        toast("Paciente cadastrado"); lerEndereco._ok = true; location.hash = "#paciente/" + r.id;
      } else {
        E.paciente = await api.atualizarPaciente(p.id, c);
        toast("Alterações salvas"); desenhar();
      }
    }catch(e){ erro(erroAmigavel(e)); bt.disabled = false; }
  };
}

/* =================================================================
   ANAMNESE — modelos com versões, preenchimento e alertas
   Pergunta: {id, tipo: secao|texto|sim_nao|multipla|escala, texto,
              obrigatoria, detalhar (sim_nao), alerta (sim_nao|multipla),
              opcoes[], varias (multipla), min, max, rot_min, rot_max (escala)}
   Resposta: {<id>: valor, "<id>_det": detalhe}
   ================================================================= */
const TIPOS = {
  secao:{rot:"Título de seção"}, texto:{rot:"Texto livre"}, sim_nao:{rot:"Sim / Não"},
  multipla:{rot:"Múltipla escolha"}, escala:{rot:"Escala (0 a 10)"},
};
const souDentista = () => E.usuario?.papel === "dentista";
const novaPerg = tipo => ({ id: "q" + Math.random().toString(36).slice(2, 8), tipo, texto: "", obrigatoria: false,
  ...(tipo === "multipla" ? { opcoes: ["", ""], varias: true } : {}),
  ...(tipo === "escala" ? { min: 0, max: 10, rot_min: "", rot_max: "" } : {}) });
const versaoAtual = m => (m.versoes || []).slice().sort((a, b) => b.versao - a.versao)[0] || null;

const MODELO_SUGERIDO = [
  ["secao", "Queixa e histórico"],
  ["texto", "Qual o motivo da consulta?", { obrigatoria: true }],
  ["texto", "Quando foi sua última visita ao dentista?"],
  ["secao", "Saúde geral"],
  ["sim_nao", "Está em tratamento médico atualmente?", { detalhar: true }],
  ["sim_nao", "Usa algum medicamento?", { detalhar: true, alerta: true, rotulo_alerta: "Medicamentos" }],
  ["sim_nao", "Tem alergia a algum medicamento, anestésico ou material?", { detalhar: true, alerta: true, obrigatoria: true, rotulo_alerta: "Alergia" }],
  ["multipla", "Tem ou já teve alguma destas condições?", { alerta: true, varias: true, rotulo_alerta: "Condições",
    opcoes: ["Hipertensão", "Diabetes", "Problema cardíaco", "Problema de coagulação", "Asma", "Epilepsia", "Hepatite", "Problema renal", "Problema de tireoide"] }],
  ["sim_nao", "Já teve reação a anestesia odontológica?", { detalhar: true, alerta: true, rotulo_alerta: "Reação a anestesia" }],
  ["sim_nao", "Está grávida ou amamentando?", { alerta: true, rotulo_alerta: "Gestante ou lactante" }],
  ["sim_nao", "Fuma?", { detalhar: true }],
  ["sim_nao", "Já fez cirurgia ou foi internado(a)?", { detalhar: true }],
  ["secao", "Saúde bucal"],
  ["sim_nao", "A gengiva sangra ao escovar?"],
  ["sim_nao", "Sente sensibilidade nos dentes?", { detalhar: true }],
  ["sim_nao", "Range ou aperta os dentes (bruxismo)?"],
  ["escala", "Quanto se sente ansioso(a) em consultas odontológicas?", { min: 0, max: 10, rot_min: "tranquilo", rot_max: "muito ansioso" }],
  ["secao", "Estética"],
  ["texto", "O que gostaria de mudar no seu sorriso?"],
].map(([tipo, texto, extra]) => ({ ...novaPerg(tipo), texto, ...(extra || {}) }));

/* ---------- Formulário (preencher e ver) ---------- */
function formAnamneseHTML(perguntas, resp = {}, soLeitura = false){
  const dis = soLeitura ? "disabled" : "";
  return perguntas.map(q => {
    if (q.tipo === "secao") return `<h4 class="an-secao">${esc(q.texto)}</h4>`;
    const obr = q.obrigatoria ? ` <span class="obr" title="Obrigatória">*</span>` : "";
    const nome = `an_${q.id}`;
    let campo = "";
    if (q.tipo === "texto")
      campo = `<textarea name="${nome}" rows="2" ${dis}>${esc(resp[q.id] || "")}</textarea>`;
    if (q.tipo === "sim_nao"){
      const v = resp[q.id] || "";
      campo = `<div class="an-opts">${["sim", "nao"].map(o => `<label class="an-op"><input type="radio" name="${nome}" value="${o}" ${v === o ? "checked" : ""} ${dis}> ${o === "sim" ? "Sim" : "Não"}</label>`).join("")}</div>
        ${q.detalhar ? `<input class="an-det" name="${nome}_det" placeholder="Se sim, qual?" value="${esc(resp[q.id + "_det"] || "")}" ${dis} ${v === "sim" || soLeitura ? "" : "hidden"}>` : ""}`;
      if (soLeitura && !resp[q.id + "_det"]) campo = campo.replace(/<input class="an-det"[^>]*>/, "");
    }
    if (q.tipo === "multipla"){
      const sel = [].concat(resp[q.id] || []);
      campo = `<div class="an-opts">${(q.opcoes || []).filter(Boolean).map(o => `<label class="an-op"><input type="${q.varias ? "checkbox" : "radio"}" name="${nome}" value="${esc(o)}" ${sel.includes(o) ? "checked" : ""} ${dis}> ${esc(o)}</label>`).join("")}</div>`;
    }
    if (q.tipo === "escala"){
      const v = resp[q.id];
      const min = Number(q.min ?? 0), max = Number(q.max ?? 10);
      campo = `<div class="an-escala">${q.rot_min ? `<small>${esc(q.rot_min)}</small>` : ""}
        ${Array.from({ length: max - min + 1 }, (_, k) => min + k).map(n => `<label class="an-n"><input type="radio" name="${nome}" value="${n}" ${Number(v) === n && v !== undefined && v !== "" ? "checked" : ""} ${dis}><span class="num">${n}</span></label>`).join("")}
        ${q.rot_max ? `<small>${esc(q.rot_max)}</small>` : ""}</div>`;
    }
    const alerta = soLeitura && ehAlerta(q, resp) ? " alerta" : "";
    return `<div class="an-q${alerta}" data-q="${q.id}"><div class="an-t">${esc(q.texto)}${obr}</div>${campo}</div>`;
  }).join("");
}
function ehAlerta(q, resp){
  if (!q.alerta) return false;
  if (q.tipo === "sim_nao") return resp[q.id] === "sim";
  if (q.tipo === "multipla") return [].concat(resp[q.id] || []).length > 0;
  return false;
}
function lerAnamnese(form, perguntas){
  const out = {}, falta = [];
  for (const q of perguntas){
    if (q.tipo === "secao") continue;
    const nome = `an_${q.id}`;
    if (q.tipo === "texto"){ const v = form.querySelector(`[name="${nome}"]`).value.trim(); if (v) out[q.id] = v; }
    if (q.tipo === "sim_nao" || q.tipo === "escala" || (q.tipo === "multipla" && !q.varias)){
      const c = form.querySelector(`[name="${nome}"]:checked`);
      if (c) out[q.id] = q.tipo === "escala" ? Number(c.value) : c.value;
      const d = form.querySelector(`[name="${nome}_det"]`);
      if (d && out[q.id] === "sim" && d.value.trim()) out[q.id + "_det"] = d.value.trim();
    }
    if (q.tipo === "multipla" && q.varias){
      const vs = [...form.querySelectorAll(`[name="${nome}"]:checked`)].map(c => c.value);
      if (vs.length) out[q.id] = vs;
    }
    if (q.obrigatoria && (out[q.id] === undefined || out[q.id] === "")) falta.push(q.texto);
  }
  return { respostas: out, falta };
}
function ligarFormAnamnese(form){
  form.querySelectorAll('input[type="radio"][value="sim"], input[type="radio"][value="nao"]').forEach(r => r.addEventListener("change", () => {
    const det = form.querySelector(`[name="${r.name}_det"]`); if (det){ det.hidden = r.value !== "sim"; if (r.value === "sim") det.focus(); }
  }));
}
function alertasDe(respostasPac){
  // alertas da anamnese mais recente de cada modelo
  const vistos = new Set(), out = [];
  for (const r of respostasPac){
    const mid = r.versao?.modelo?.id; if (vistos.has(mid)) continue; vistos.add(mid);
    for (const q of r.versao?.perguntas || []){
      if (!ehAlerta(q, r.respostas)) continue;
      const det = q.tipo === "multipla" ? [].concat(r.respostas[q.id]).join(", ") : (r.respostas[q.id + "_det"] || "");
      out.push({ texto: q.texto, rotulo: (q.rotulo_alerta || "").trim() || (q.texto.length > 40 ? q.texto.slice(0, 38) + "…" : q.texto.replace(/\?$/, "")), det });
    }
  }
  return out;
}

function ligarAnamneseFicha(){
  const b = $("#anPreencher"); if (b) b.onclick = () => abrirPreencher();
  document.querySelectorAll("[data-resp]").forEach(x => x.onclick = () => verResposta(x.dataset.resp));
}
function abrirPreencher(){
  const modelos = (E.modelos || []).filter(m => m.ativo && versaoAtual(m));
  const dlg = $("#dlgAn"); const p = E.paciente;
  let mSel = modelos[0];
  const pintar = () => {
    const v = versaoAtual(mSel);
    dlg.innerHTML = `<form class="dlg" id="fAn" novalidate>
      <header><div><h3>Anamnese</h3><p>${esc(p.nome)} · ${fmtDia(new Date(), { day: "numeric", month: "long", year: "numeric" })}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        ${modelos.length > 1 ? `<div class="field"><label for="anModelo">Ficha</label><select id="anModelo">${modelos.map(m => `<option value="${m.id}" ${m.id === mSel.id ? "selected" : ""}>${esc(m.nome)} (versão ${versaoAtual(m).versao})</option>`).join("")}</select></div>`
          : `<p class="note" style="margin:0">${esc(mSel.nome)} · versão ${v.versao}</p>`}
        <div class="an-form">${formAnamneseHTML(v.perguntas)}</div>
        <div class="err" id="eAn" hidden></div>
      </div>
      <footer><span class="note" style="margin-right:auto">Fica registrada em seu nome e não pode ser alterada depois.</span><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="anSalvar">Salvar anamnese</button></footer>
    </form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    const sel = $("#anModelo", dlg); if (sel) sel.onchange = () => { mSel = modelos.find(m => m.id === sel.value); pintar(); };
    ligarFormAnamnese($("#fAn", dlg));
    $("#fAn", dlg).onsubmit = async ev => {
      ev.preventDefault();
      const { respostas, falta } = lerAnamnese($("#fAn", dlg), v.perguntas);
      const err = $("#eAn", dlg);
      if (falta.length){ err.textContent = "Responda as perguntas obrigatórias: " + falta.join("; "); err.hidden = false; return; }
      if (!Object.keys(respostas).length){ err.textContent = "Nenhuma pergunta foi respondida."; err.hidden = false; return; }
      const bt = $("#anSalvar", dlg); bt.disabled = true;
      try{ await api.salvarResposta({ paciente_id: p.id, versao_id: v.id, respostas }); dlg.close(); toast("Anamnese registrada. Clique nela para coletar a assinatura do paciente."); carregar(); }
      catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; bt.disabled = false; }
    };
  };
  pintar(); dlg.showModal();
}
function verResposta(id){
  const r = (E.respostas || []).find(x => x.id === id); if (!r) return;
  const dlg = $("#dlgAn");
  dlg.innerHTML = `<div class="dlg">
    <header><div><h3>${esc(r.versao?.modelo?.nome || "Anamnese")}</h3>
      <p class="num">${esc(E.paciente?.nome)} · ${fmtDia(r.preenchido_em, { day: "numeric", month: "long", year: "numeric" })} às ${hhmm(r.preenchido_em)} · ${esc(dentista(r.profissional_id)?.nome || "")} · versão ${r.versao?.versao}</p></div>
      <button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body"><div class="an-form leitura">${formAnamneseHTML(r.versao?.perguntas || [], r.respostas, true)}</div></div>
    <footer><span class="note" style="margin-right:auto">${assinaturaDaAnamnese(r.id) ? "Assinada pelo paciente." : "Registro permanente. Para atualizar, preencha uma nova anamnese."}</span>
      ${!assinaturaDaAnamnese(r.id) && souDentista() ? `<button type="button" class="btn" id="anAssinar">Coletar assinatura do paciente</button>` : ""}
      ${assinaturaDaAnamnese(r.id) ? `<button type="button" class="btn" id="anVerAss">Ver assinatura</button>` : ""}
      <button type="button" class="btn" data-fechar>Fechar</button></footer>
  </div>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  const aa = $("#anAssinar", dlg); if (aa) aa.onclick = () => { dlg.close(); abrirColeta("a:" + r.id); };
  const va = $("#anVerAss", dlg); if (va) va.onclick = () => { dlg.close(); verAssinatura(assinaturaDaAnamnese(r.id).id); };
  dlg.showModal();
}

/* =================================================================
   ODONTOGRAMA — FDI, 5 faces, marcações como eventos
   Estado atual = marcação mais recente de cada dente/face (visão odontograma_atual)
   ================================================================= */
const COND = {
  a_fazer:          { rot: "A fazer",          cor: "#C0392B" },
  tratado:          { rot: "Tratado",          cor: "#2E8B57" },
  ausente:          { rot: "Ausente",          cor: "#1F1B17", inteiro: true },
  protese_implante: { rot: "Prótese / implante", cor: "#2F6DB5", inteiro: true },
  orcado:           { rot: "Nesta opção do orçamento", cor: "#7B4FA0", oculto: true },
  limpo:            { rot: "Limpar",           cor: null },
};
const FACE_NOME = { O: "oclusal/incisal", V: "vestibular", L: "lingual/palatina", M: "mesial", D: "distal" };
const ARCADAS = {
  permanente: [[18,17,16,15,14,13,12,11], [21,22,23,24,25,26,27,28], [48,47,46,45,44,43,42,41], [31,32,33,34,35,36,37,38]],
  decidua:    [[55,54,53,52,51], [61,62,63,64,65], [85,84,83,82,81], [71,72,73,74,75]],
};
const quad = d => Math.floor(d / 10);
// lados do desenho → face, conforme a posição do dente na boca
function facesDoDente(d){
  const q = quad(d), sup = [1,2,5,6].includes(q), esqTela = [1,4,5,8].includes(q);
  return { top: sup ? "V" : "L", bottom: sup ? "L" : "V", left: esqTela ? "D" : "M", right: esqTela ? "M" : "D", center: "O" };
}
function estadoOdonto(){
  // atual (do banco) + pendentes (ainda não salvos)
  const st = {};
  const pôr = (d, f, c, pend) => { (st[d] ||= { faces: {}, inteiro: null, pend: new Set() }); if (f) st[d].faces[f] = c; else st[d].inteiro = c; if (pend) st[d].pend.add(f || "*"); };
  for (const m of E.odonto || []) pôr(m.dente, m.face, m.condicao);
  for (const m of E.odoPend || []) pôr(m.dente, m.face, m.condicao, true);
  return st;
}
function denteSVG(d, s){
  const F = facesDoDente(d);
  const inteiro = s?.inteiro && s.inteiro !== "limpo" ? s.inteiro : null;
  const cor = f => { const c = s?.faces?.[F[f]]; if (c && c !== "limpo") return COND[c].cor;
    if (inteiro && !COND[inteiro].inteiro) return COND[inteiro].cor; return null; };
  const P = { top: "M1,1 L39,1 L28,12 L12,12 Z", bottom: "M12,28 L28,28 L39,39 L1,39 Z", left: "M1,1 L12,12 L12,28 L1,39 Z", right: "M39,1 L39,39 L28,28 L28,12 Z" };
  const pend = f => s?.pend?.has(F[f]) || s?.pend?.has("*");
  const face = (k, shape) => { const c = cor(k);
    return `<${shape} data-d="${d}" data-f="${F[k]}" class="fc${pend(k) ? " pend" : ""}" style="fill:${c || "var(--surface)"}" ${shape === "path" ? `d="${P[k]}"` : 'x="12" y="12" width="16" height="16"'}><title>${d} · ${FACE_NOME[F[k]]}${s?.faces?.[F[k]] && s.faces[F[k]] !== "limpo" ? " · " + COND[s.faces[F[k]]].rot : ""}</title></${shape}>`; };
  return `<svg viewBox="0 0 40 40" class="dente${inteiro === "ausente" ? " ausente" : ""}" aria-hidden="true">
    ${face("top", "path")}${face("bottom", "path")}${face("left", "path")}${face("right", "path")}${face("center", "rect")}
    ${inteiro === "ausente" ? `<path d="M3,3 L37,37 M37,3 L3,37" class="xis"/>` : ""}
    ${inteiro === "protese_implante" ? `<rect x="0.5" y="0.5" width="39" height="39" rx="3" class="anel"/>` : ""}
  </svg>`;
}
/* ---------- Odontograma anatômico (estilo Dental Office) ----------
   Cada dente: desenho de perfil (coroa + raízes, pelo tipo do dente) e,
   junto dele, o círculo das 5 faces. O desenho vale para o dente inteiro;
   o círculo, para cada face. Superior: raízes para cima. */
const tipoDente = d => { const n = d % 10, dec = d > 50; if (dec) return n <= 2 ? "inc" : n === 3 ? "can" : "mol"; return n <= 2 ? "inc" : n === 3 ? "can" : n <= 5 ? "pre" : "mol"; };
const FORMAS = {   // desenho do dente inferior (coroa em cima), caixa 40 x 80
  inc: { coroa: "M13,2 L27,2 Q29,14 26,28 L14,28 Q11,14 13,2 Z", raiz: ["M14,28 L26,28 Q24,60 20,78 Q16,60 14,28 Z"], canal: ["M20,31 L20,70"] },
  can: { coroa: "M20,0 L27,8 Q29,18 26,28 L14,28 Q11,18 13,8 Z", raiz: ["M14,28 L26,28 Q25,62 20,80 Q15,62 14,28 Z"], canal: ["M20,31 L20,72"] },
  pre: { coroa: "M11,6 Q14,0 20,3 Q26,0 29,6 Q31,18 27,28 L13,28 Q9,18 11,6 Z", raiz: ["M13,28 L27,28 Q24,58 20,75 Q16,58 13,28 Z"], canal: ["M20,31 L20,68"] },
  mol: { coroa: "M7,6 Q10,0 15,4 Q20,0 25,4 Q30,0 33,6 Q35,18 31,28 L9,28 Q5,18 7,6 Z",
         raiz: ["M9,28 L19,28 Q18,52 13,72 Q9,52 9,28 Z", "M21,28 L31,28 Q31,52 27,72 Q22,52 21,28 Z"], canal: ["M14,31 L13.5,64", "M26,31 L26.5,64"] },
};
function arcoSeg(a0, a1, R = 18, r = 7.5, c = 20){
  const p = (a, rad) => [c + rad * Math.cos(a * Math.PI / 180), c + rad * Math.sin(a * Math.PI / 180)].map(v => v.toFixed(2)).join(",");
  return `M${p(a0, R)} A${R},${R} 0 0 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 0 0 ${p(a0, r)} Z`;
}
function facesCirculoSVG(d, s){
  const F = facesDoDente(d);
  const inteiro = s?.inteiro && s.inteiro !== "limpo" ? s.inteiro : null;
  const cor = k => { const c = s?.faces?.[F[k]]; if (c && c !== "limpo") return COND[c].cor; if (inteiro && !COND[inteiro].inteiro) return COND[inteiro].cor; return null; };
  const pend = k => s?.pend?.has(F[k]) || s?.pend?.has("*");
  const tit = k => `${d} · ${FACE_NOME[F[k]]}${s?.faces?.[F[k]] && s.faces[F[k]] !== "limpo" ? " · " + COND[s.faces[F[k]]].rot : ""}`;
  const seg = (k, dpath) => `<path data-d="${d}" data-f="${F[k]}" class="fc${pend(k) ? " pend" : ""}" style="fill:${cor(k) || "var(--surface)"}" d="${dpath}"><title>${tit(k)}</title></path>`;
  return `<svg viewBox="0 0 40 40" class="circ${inteiro === "ausente" ? " ausente" : ""}" aria-hidden="true">
    ${seg("top", arcoSeg(225, 315))}${seg("right", arcoSeg(315, 405))}${seg("bottom", arcoSeg(45, 135))}${seg("left", arcoSeg(135, 225))}
    <circle data-d="${d}" data-f="${F.center}" class="fc${pend("center") ? " pend" : ""}" cx="20" cy="20" r="7.5" style="fill:${cor("center") || "var(--surface)"}"><title>${tit("center")}</title></circle>
  </svg>`;
}
function denteAnatomicoSVG(d, s, sup){
  const f = FORMAS[tipoDente(d)], dec = d > 50;
  const inteiro = s?.inteiro && s.inteiro !== "limpo" ? s.inteiro : null;
  const faceCores = Object.values(s?.faces || {}).filter(c => c && c !== "limpo");
  const corCoroa = inteiro && !COND[inteiro].inteiro ? COND[inteiro].cor : null;
  const canal = (E.odonto || []).concat(E.odoPend || []).find(m => m.dente === d && m.condicao !== "limpo" && /canal|endo/i.test(m.procedimento || ""));
  const implante = inteiro === "protese_implante";
  const pend = s?.pend?.has("*");
  const trans = `${sup ? "translate(0,80) scale(1,-1) " : ""}${dec ? "translate(3,4) scale(0.85)" : ""}`;
  const raizes = implante
    ? `<rect x="15" y="30" width="10" height="44" rx="3" class="impl"/>${[36, 43, 50, 57, 64].map(y => `<line x1="14" x2="26" y1="${y}" y2="${y + 3}" class="rosca"/>`).join("")}`
    : f.raiz.map(p => `<path d="${p}" class="raiz"/>`).join("") + (canal ? f.canal.map(p => `<path d="${p}" class="canal" style="stroke:${COND[canal.condicao].cor}"/>`).join("") : "");
  const marcas = !corCoroa && faceCores.length ? `<circle cx="20" cy="15" r="3.2" style="fill:${COND[faceCores[0]].cor}" class="marca"/>` : "";
  return `<svg viewBox="0 0 40 80" class="anat${inteiro === "ausente" ? " ausente" : ""}${implante ? " implante" : ""}${pend ? " pend" : ""}" aria-hidden="true">
    <g data-d="${d}" data-f="" class="fc-dente"><title>Dente ${d}${inteiro ? " · " + COND[inteiro].rot : ""}${canal ? " · canal" : ""}</title>
      <g transform="${trans}">
        <rect x="0" y="0" width="40" height="80" fill="transparent"/>
        ${raizes}
        <path d="${f.coroa}" class="coroa" style="${corCoroa ? `fill:${corCoroa}` : ""}"/>
        ${marcas}
      </g>
      ${inteiro === "ausente" ? `<path d="M6,10 L34,70 M34,10 L6,70" class="xis"/>` : ""}
    </g>
  </svg>`;
}
function linhaAnatomica(a, b, sup, st){
  return `<div class="odo-linha anat-linha">${[a, b].map((lado, i) => `<div class="odo-lado ${i ? "dir" : "esq"}">${lado.map(d => {
    const num = `<span class="num">${d}</span>`, anat = denteAnatomicoSVG(d, st[d], sup), circ = facesCirculoSVG(d, st[d]);
    return `<div class="odo-d odo-a" data-dente="${d}" aria-label="Dente ${d}">${sup ? num + anat + circ : circ + anat + num}</div>`;
  }).join("")}</div>`).join("")}</div>`;
}

// Limpar: tira a marcação da face clicada; se a face não tem marcação própria mas o dente

function limparOdonto(d, face){
  const sv = {}; for (const m of (E.odonto || []).filter(m => m.dente === d)) sv[m.face || "*"] = m.condicao;
  const st = estadoOdonto()[d] || { faces: {}, inteiro: null };
  const marcada = c => c && c !== "limpo";
  let alvos;
  if (face && marcada(st.faces[face])) alvos = [face];
  else if (face && !marcada(st.inteiro)) alvos = [];
  else alvos = [null, ...Object.keys(st.faces).filter(f => marcada(st.faces[f]))];
  for (const f of alvos){
    E.odoPend = E.odoPend.filter(m => !(m.dente === d && m.face === f));
    if (marcada(sv[f || "*"])) E.odoPend.push({ dente: d, face: f, condicao: "limpo", procedimento: null });
  }
}
function ligarOdonto(){
  const repinta = () => { const el = $("#odo"); if (!el) return; el.outerHTML = odontogramaHTML(); ligarOdonto(); };
  document.querySelectorAll("[data-deci]").forEach(b => b.onclick = () => { E.odoDecidua = b.dataset.deci === "1"; repinta(); });
  document.querySelectorAll("[data-vis]").forEach(b => b.onclick = () => { E.odoVisual = b.dataset.vis; try{ localStorage.setItem("odonto_visual_odo", E.odoVisual); }catch(e){} repinta(); });
  if (!souDentista()) return;
  document.querySelectorAll(".odo-t").forEach(b => b.onclick = () => { E.odoFerr = b.dataset.cond; repinta(); });
  const it = $("#odoInteiro"); if (it) it.onchange = () => { E.odoInteiro = it.checked; };
  const pr = $("#odoProc"); if (pr) pr.oninput = () => { E.odoProc = pr.value; };
  document.querySelectorAll(".odo-d .fc, .odo-d .fc-dente").forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation();
    const d = Number(el.dataset.d), cond = E.odoFerr;
    if (!cond){ const e = $("#eOdo"); e.textContent = "Escolha primeiro a marcação (A fazer, Tratado…) nos botões acima."; e.hidden = false; return; }
    E.odoPend = E.odoPend || [];
    if (cond === "limpo"){ limparOdonto(d, E.odoInteiro || !el.dataset.f ? null : el.dataset.f); $("#eOdo").hidden = true; return repinta(); }
    const face = COND[cond].inteiro || E.odoInteiro || !el.dataset.f ? null : el.dataset.f;
    E.odoPend = E.odoPend.filter(m => !(m.dente === d && m.face === face));
    E.odoPend.push({ dente: d, face, condicao: cond, procedimento: (E.odoProc || "").trim() || null });
    repinta();
  }));
  const ds = $("#odoDesc"); if (ds) ds.onclick = () => { E.odoPend = []; repinta(); };
  const sv = $("#odoSalvar");
  if (sv) sv.onclick = async () => {
    sv.disabled = true;
    try{
      await api.salvarMarcacoes(E.odoPend.map(m => ({ ...m, paciente_id: E.paciente.id })));
      E.odoPend = []; toast("Odontograma salvo no prontuário"); const av = $("#ePac"); if (av) av.hidden = true;
      [E.odonto, E.odoHist] = await Promise.all([api.odontograma(E.paciente.id), api.historicoOdonto(E.paciente.id)]);
      repinta();
    }catch(e){ const x = $("#eOdo"); x.textContent = erroAmigavel(e); x.hidden = false; sv.disabled = false; }
  };
}

/* =================================================================
   EVOLUÇÃO DO TRATAMENTO — registro de cada atendimento
   Não se edita nem apaga: correção = novo registro com corrige_id.
   ================================================================= */
const DENTES_VALIDOS = new Set([...ARCADAS.permanente.flat(), ...ARCADAS.decidua.flat()]);
function lerDentes(txt){
  const nums = (txt.match(/\d+/g) || []).map(Number);
  const invalidos = nums.filter(n => !DENTES_VALIDOS.has(n));
  return { dentes: [...new Set(nums.filter(n => DENTES_VALIDOS.has(n)))].sort((a, b) => a - b), invalidos };
}

function ligarEvolucao(){
  const em = $("#evoMais"); if (em) em.onclick = () => { E.evoTodos = !E.evoTodos; desenhar(); };
  const repinta = () => { const el = $("#evo"); if (!el) return; el.outerHTML = evolucaoHTML(); ligarEvolucao(); };
  document.querySelectorAll("[data-corrigir]").forEach(b => b.onclick = () => { E.evoCorrigindo = b.dataset.corrigir; repinta(); $("#evo").scrollIntoView({ block: "start" }); $("#evoTxt").focus(); });
  const cc = $("#evoCancCor"); if (cc) cc.onclick = () => { E.evoCorrigindo = null; repinta(); };
  const f = $("#fEvo"); if (!f) return;
  const txt = $("#evoTxt"), den = $("#evoDentes"), sel = $("#evoCons"), box = $("#evoConclBox");
  if (!E.evoCorrigindo){ txt.oninput = () => E.evoRasc = txt.value; den.oninput = () => E.evoDentesRasc = den.value; }
  const mostraConcl = () => { if (!box) return; const a = (E.consultas || []).find(x => x.id === sel.value); box.hidden = !a || a.status === "concluido"; };
  sel.onchange = mostraConcl; mostraConcl();
  const erro = m => { const e = $("#eEvo"); e.textContent = m; e.hidden = false; };
  f.onsubmit = async ev => {
    ev.preventDefault();
    const texto = txt.value.trim();
    if (texto.length < 5) return erro("Descreva o que foi feito no atendimento.");
    const { dentes, invalidos } = lerDentes(den.value);
    if (invalidos.length) return erro(`Número de dente inválido: ${invalidos.join(", ")}. Use a numeração FDI (11 a 48; de leite 51 a 85).`);
    const cor = E.evoCorrigindo ? E.evolucoes.find(e => e.id === E.evoCorrigindo) : null;
    if (cor && texto === cor.texto && JSON.stringify(dentes) === JSON.stringify(cor.dentes || [])) return erro("O texto está igual ao original. Altere o que precisa ser corrigido.");
    const bt = $("#evoSalvar"); bt.disabled = true;
    try{
      await api.registrarEvolucao({ paciente_id: E.paciente.id, texto, dentes: dentes.length ? dentes : null,
        agendamento_id: sel.value || null, corrige_id: cor ? cor.id : null });
      const concl = $("#evoConcl");
      const a = (E.consultas || []).find(x => x.id === sel.value);
      if (!cor && concl?.checked && a && a.status !== "concluido" && new Date(a.inicio) <= new Date())
        await api.atualizarAgendamento(a.id, { status: "concluido" });
      toast(cor ? "Correção registrada" : "Evolução registrada");
      E.evoRasc = ""; E.evoDentesRasc = ""; E.evoCorrigindo = null; E.evoPre = null;
      carregar();
    }catch(e){ erro(erroAmigavel(e)); bt.disabled = false; }
  };
}

/* =================================================================
   EXAMES E IMAGENS — raio-x, fotos e documentos
   Arquivo no armazenamento privado "prontuario" (<paciente>/<arquivo>);
   a visualização usa links temporários (1 hora). Nada é apagado.
   ================================================================= */
const TIPO_ANEXO = { raio_x: "Raio-x", foto: "Foto", documento: "Documento" };
const MAX_MB = 25;
const ehPdf = a => /\.pdf$/i.test(a.caminho || a.name || "") || a.type === "application/pdf";
const tamanho = b => b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";

// Fotos grandes de celular são reduzidas (máx. 2400 px, JPEG 85%). Raio-x e PDF vão como estão.
async function prepararArquivo(file, tipo){
  if (tipo !== "foto" || !/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.2 * 1048576) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  }catch(e){ return file; }
}

        <span class="anx-tag">${TIPO_ANEXO[a.tipo]}</span>

      <figcaption><b>${esc(a.descricao || TIPO_ANEXO[a.tipo])}</b><small class="num">${a.data_exame ? fmtDia(a.data_exame + "T12:00:00", { day: "2-digit", month: "2-digit", year: "numeric" }) : fmtDia(a.enviado_em, { day: "2-digit", month: "2-digit", year: "numeric" })}</small></figcaption>
    </figure>`;
  };
  return `<section class="panel anxs" id="anxs" data-dobra="anxs">
    <div class="odo-head">
      <div>${tituloDobra("Exames e imagens", "anxs", todos.length ? `${todos.length} arquivo${todos.length > 1 ? "s" : ""}` : "nenhum arquivo")}<p class="sub">Raio-x, fotos e documentos do paciente. Guardados em espaço privado, visíveis só para dentistas e gestão.</p></div>
      ${souDentista() ? `<button type="button" class="btn primary" id="anxNovo">+ Enviar arquivos</button>` : ""}
    </div>
    ${todos.length ? `<div class="anx-bar">
      <div class="seg" role="group" aria-label="Filtrar por tipo">
        ${[["todos", `Todos (${todos.length})`], ["raio_x", `Raio-x (${cont("raio_x")})`], ["foto", `Fotos (${cont("foto")})`], ["documento", `Documentos (${cont("documento")})`]]
          .map(([k, r]) => `<button type="button" data-anxf="${k}" aria-pressed="${filtro === k}">${r}</button>`).join("")}
      </div>
      ${sel.length ? `<span class="note">${sel.length === 1 ? "Escolha mais uma imagem para comparar." : ""}</span>
        ${sel.length === 2 ? `<button type="button" class="btn" id="anxComparar">Comparar lado a lado</button>` : ""}
        <button type="button" class="btn ghost" id="anxLimparSel">Limpar seleção</button>` : `<span class="note">Marque "comparar" em duas fotos para ver antes e depois.</span>`}
    </div>
    <div class="anx-grid">${lista.map(card).join("") || `<p class="empty">Nenhum arquivo deste tipo.</p>`}</div>`
    : `<p class="empty">Nenhum exame ou imagem ainda.${souDentista() ? " Envie radiografias, fotos intraorais ou documentos (PDF)." : ""}</p>`}
  </section>`;
}

async function carregarUrlsAnexos(){
  const faltam = (E.anexos || []).map(a => a.caminho).filter(c => !E.anxUrls?.[c]);
  if (!faltam.length) return;
  try{ E.anxUrls = { ...(E.anxUrls || {}), ...(await api.urlsAnexos(faltam)) }; }catch(e){ toast(erroAmigavel(e)); }
}
function ligarImagens(){
  const repinta = () => { const el = $("#anxs"); if (!el) return; el.outerHTML = imagensHTML(); ligarImagens(); };
  if ((E.anexos || []).some(a => !E.anxUrls?.[a.caminho])) carregarUrlsAnexos().then(repinta);
  const nv = $("#anxNovo"); if (nv) nv.onclick = abrirEnvio;
  document.querySelectorAll("[data-anxf]").forEach(b => b.onclick = () => { E.anxFiltro = b.dataset.anxf; repinta(); });
  document.querySelectorAll("[data-cmp]").forEach(c => {
    c.onclick = ev => ev.stopPropagation();
    c.onchange = () => {
      let s = (E.anxSel || []).filter(x => x !== c.dataset.cmp);
      if (c.checked) s = [...s, c.dataset.cmp].slice(-2);
      E.anxSel = s; repinta();
    };
  });
  document.querySelectorAll("[data-anx]").forEach(f => {
    const abre = () => verAnexo(f.dataset.anx);
    f.onclick = ev => { if (!ev.target.closest(".anx-chk")) abre(); };
    f.onkeydown = ev => { if (ev.key === "Enter") abre(); };
  });
  const cp = $("#anxComparar"); if (cp) cp.onclick = compararAnexos;
  const ls = $("#anxLimparSel"); if (ls) ls.onclick = () => { E.anxSel = []; repinta(); };
}

function abrirEnvio(){
  const dlg = $("#dlgAn"); const p = E.paciente;
  let arquivos = [];
  dlg.innerHTML = `<form class="dlg" id="fAnx" novalidate>
    <header><div><h3>Enviar arquivos</h3><p>${esc(p.nome)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <label class="drop" id="anxDrop" for="anxFile">
        <b>Clique para escolher</b> ou arraste os arquivos aqui
        <small>Imagens (JPG, PNG) ou PDF, até ${MAX_MB} MB cada. Pode enviar vários de uma vez.</small>
        <input type="file" id="anxFile" accept="image/*,application/pdf" multiple hidden>
      </label>
      <ul class="anx-fila" id="anxFila"></ul>
      <div class="grid3">
        <div class="field"><label for="anxTipo">Tipo</label><select id="anxTipo">${Object.entries(TIPO_ANEXO).map(([k, r]) => `<option value="${k}">${r}</option>`).join("")}</select></div>
        <div class="field"><label for="anxData">Data do exame</label><input type="date" id="anxData" value="${inputData(new Date())}" max="${inputData(new Date())}"></div>
        <div class="field"><label for="anxDesc">Descrição</label><input id="anxDesc" placeholder="Ex.: Panorâmica inicial" list="lAnx"><datalist id="lAnx">
          <option value="Radiografia panorâmica"><option value="Periapical"><option value="Interproximal (bite-wing)"><option value="Tomografia"><option value="Foto inicial (antes)"><option value="Foto final (depois)"><option value="Foto intraoral"><option value="Termo assinado"></datalist></div>
      </div>
      <p class="note" style="margin:0">Fotos grandes são reduzidas automaticamente para economizar espaço. Radiografias e PDFs são guardados como estão.</p>
      <div class="err" id="eAnx" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="anxEnviar" disabled>Enviar</button></footer>
  </form>`;
  dlg.showModal();
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  const fila = $("#anxFila", dlg), bt = $("#anxEnviar", dlg), err = $("#eAnx", dlg);
  const pinta = () => {
    fila.innerHTML = arquivos.map((a, i) => `<li data-i="${i}"><span>${esc(a.file.name)}</span><small class="num">${tamanho(a.file.size)}</small>
      <span class="st ${a.st || ""}">${a.msg || ""}</span>${a.st ? "" : `<button type="button" class="x" data-tira="${i}" aria-label="Tirar ${esc(a.file.name)}">×</button>`}</li>`).join("");
    fila.querySelectorAll("[data-tira]").forEach(b => b.onclick = () => { arquivos.splice(Number(b.dataset.tira), 1); pinta(); });
    bt.disabled = !arquivos.some(a => !a.st);
  };
  const add = lista => {
    err.hidden = true;
    for (const f of lista){
      if (!/^image\//.test(f.type) && f.type !== "application/pdf"){ err.textContent = `"${f.name}" não é imagem nem PDF.`; err.hidden = false; continue; }
      if (f.size > MAX_MB * 1048576){ err.textContent = `"${f.name}" tem mais de ${MAX_MB} MB.`; err.hidden = false; continue; }
      arquivos.push({ file: f });
    }
    if (arquivos.some(a => ehPdf(a.file))) $("#anxTipo", dlg).value = arquivos.every(a => ehPdf(a.file)) ? "documento" : $("#anxTipo", dlg).value;
    pinta();
  };
  $("#anxFile", dlg).onchange = e => { add([...e.target.files]); e.target.value = ""; };
  const drop = $("#anxDrop", dlg);
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => add([...e.dataTransfer.files]));
  $("#fAnx", dlg).onsubmit = async ev => {
    ev.preventDefault();
    const tipo = $("#anxTipo", dlg).value, data = $("#anxData", dlg).value || null, desc = $("#anxDesc", dlg).value.trim() || null;
    bt.disabled = true; let ok = 0;
    for (const a of arquivos.filter(a => !a.st)){
      a.st = "env"; a.msg = "enviando…"; pinta();
      try{
        const f = await prepararArquivo(a.file, tipo);
        const pdfMisturado = ehPdf(f) && tipo !== "documento";
        await api.enviarAnexo(p.id, f, { tipo: ehPdf(f) ? "documento" : tipo, data_exame: data, descricao: pdfMisturado ? a.file.name.replace(/\.pdf$/i, "") : (desc || a.file.name.replace(/\.\w+$/, "")) });
        a.st = "ok"; a.msg = "enviado"; ok++;
      }catch(e){ a.st = "erro"; a.msg = erroAmigavel(e); }

const temCampo = (t, c) => t.includes("{" + c + "}");

function preencherTermo(texto, extras = {}){
  const p = E.paciente || {}, eu = E.usuario || {};
  const mapa = {
    paciente: p.nome || "", cpf: p.cpf ? fmtCpf(p.cpf) : "não informado", responsavel: p.responsavel || "",
    dentista: eu.papel === "dentista" ? `${eu.nome}${eu.cro ? " (" + eu.cro + ")" : ""}` : "dentista responsável",
    data: fmtDia(new Date(), { day: "numeric", month: "long", year: "numeric" }), ...extras,
  };
  return texto.replace(/\{(\w+)\}/g, (m, k) => k in mapa ? mapa[k] : m);
}
function textoAnamnese(r){
  const linhas = [`Declaro que as informações abaixo, prestadas por mim na anamnese de ${fmtDia(r.preenchido_em, { day: "2-digit", month: "2-digit", year: "numeric" })}, são verdadeiras, e que comunicarei ao consultório qualquer mudança no meu estado de saúde.`, ""];
  for (const q of r.versao?.perguntas || []){
    if (q.tipo === "secao"){ linhas.push("", q.texto.toUpperCase()); continue; }
    const v = r.respostas[q.id];
    if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) continue;
    const val = q.tipo === "sim_nao" ? (v === "sim" ? "Sim" : "Não") : Array.isArray(v) ? v.join(", ") : String(v);
    const det = r.respostas[q.id + "_det"];
    linhas.push(`${q.texto} ${val}${det ? " — " + det : ""}`);
  }
  return linhas.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function sha256(txt){
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch(e){ return null; }
}

    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());

      const nome = $("#assNome", dlg).value.trim().replace(/\s+/g, " ");

    };

// Área de assinatura (dedo, caneta ou mouse). Fundo branco para ficar legível em qualquer tema.
function criarPad(cv){
  const ctx = cv.getContext("2d"); let vazio = true, desenhando = false, ult = null;
  const ajusta = () => {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#141414"; vazio = true;
  };
  requestAnimationFrame(ajusta);
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); desenhando = true; ult = pos(e);
    ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = "#141414"; ctx.fill(); vazio = false; });
  cv.addEventListener("pointermove", e => { if (!desenhando) return; e.preventDefault(); const p = pos(e);
    ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p; vazio = false; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => cv.addEventListener(t, () => desenhando = false));
  return { limpar: ajusta, vazio: () => vazio, png: () => cv.toDataURL("image/png") };
}

/* =================================================================
   ORÇAMENTOS — tabela de procedimentos e orçamento pelo odontograma
   Fluxo: rascunho (3+ opções) → apresentado → paciente escolhe →
   aprovado (travado) → consentimento assinado (assinaturas.tipo
   'orcamento', referencia_id = orçamento).
   Opção: {numero, titulo, itens[], desc_tipo, desc_valor, forma,
           parcelas, entrada, obs, subtotal, desconto, total}
   Item:  {procedimento_id, codigo, nome, cobranca, dentes[], faces[],
           arcadas[], qtd, valor_unit, valor_total}
   ================================================================= */
const COBRANCA = {
  dente:     { rot: "por dente",            suf: "/dente" },
  conjunto:  { rot: "valor fechado",        suf: "" },
  arcada:    { rot: "por arcada",           suf: "/arcada" },
  quadrante: { rot: "por quadrante",        suf: "/quadrante" },
  unico:     { rot: "valor fechado, sem dente", suf: "" },
};
const ORC_STATUS = { rascunho: "Rascunho", apresentado: "Apresentado", aprovado: "Aprovado", recusado: "Recusado", cancelado: "Cancelado" };
const foiEscolhida = (o, i) => ["aprovado", "cancelado"].includes(o.status) && o.opcao_escolhida === i + 1;
const FORMAS_PAG = ["À vista (Pix ou dinheiro)", "Cartão de crédito", "Cartão de débito", "Entrada + parcelas", "Boleto / carnê"];
const COM_PARCELAS = ["Cartão de crédito", "Entrada + parcelas", "Boleto / carnê"];
const ORDEM_FACES = ["O", "V", "L", "M", "D"];
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtValor = v => isNaN(v) ? "" : Number(v || 0).toFixed(2).replace(".", ",");
const lerValor = s => { s = String(s ?? "").replace(/[R$\s]/g, ""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN; };
const r2 = v => Math.round(v * 100) / 100;
const editoPrecos = () => souDentista() || !!E.usuario?.admin;
const novaOpcao = n => ({ numero: n, titulo: "", itens: [], desc_tipo: "valor", desc_valor: 0, forma: FORMAS_PAG[0], parcelas: 1, entrada: 0, obs: "" });
const nomeOpcao = (op, i) => `Opção ${i + 1}${op.titulo?.trim() ? " — " + op.titulo.trim() : ""}`;
const arcadaDe = d => [1, 2, 5, 6].includes(quad(d)) ? "sup" : "inf";
const clone = x => JSON.parse(JSON.stringify(x));
const consentDe = o => (E.assinaturas || []).find(a => a.tipo === "orcamento" && a.referencia_id === o.id);

function totaisOpcao(o){
  const subtotal = r2((o.itens || []).reduce((s, i) => s + Number(i.valor_total || 0), 0));
  const dv = Number(o.desc_valor || 0);
  const desconto = Math.min(subtotal, r2(o.desc_tipo === "pct" ? subtotal * dv / 100 : dv));
  return { subtotal, desconto, total: r2(subtotal - desconto) };
}
// Cartão de crédito: até "sem juros" parcelas o consultório absorve a taxa; acima, a taxa é
// repassada (valor ajustado para que o líquido seja o total do orçamento). No rascunho usa a
// configuração atual; ao apresentar, a configuração fica guardada na opção (op.cartao).
function cfgCartao(op){
  if (op?.cartao && E.orc?.status !== "rascunho") return op.cartao;
  const taxas = {}; taxasDe(E.orc?.profissional_id).filter(x => x.tipo === "credito").forEach(x => taxas[x.parcelas] = Number(x.taxa_pct));
  return { sem_juros: Number(E.semJuros ?? 12), taxas };
}
const acrescimoPct = (op, n) => { const c = cfgCartao(op); return n > c.sem_juros ? Number(c.taxas[n] || 0) : 0; };
const comAcrescimo = (total, pct) => pct ? r2(total / (1 - pct / 100)) : total;
function totalCobrado(op){
  const t = totaisOpcao(op).total;
  return op.forma === "Cartão de crédito" ? comAcrescimo(t, acrescimoPct(op, Math.min(12, Math.max(1, Number(op.parcelas) || 1)))) : t;
}
function simulacaoCartao(op){
  const t = totaisOpcao(op).total;
  return Array.from({ length: 12 }, (_, i) => { const n = i + 1, p = acrescimoPct(op, n), tot = comAcrescimo(t, p); return { n, p, tot, parc: r2(tot / n) }; });
}
function resumoCartao(op){
  const sim = simulacaoCartao(op), c = cfgCartao(op), sj = Math.min(12, Math.max(1, c.sem_juros));
  const s = sim[sj - 1];
  return sj >= 12 ? `No cartão: até 12× de ${brl(s.parc)} sem juros` : `No cartão: até ${sj}× de ${brl(s.parc)} sem juros, ou até 12× de ${brl(sim[11].parc)}`;
}
function pagamentoTexto(o){
  const { total } = totaisOpcao(o), n = Math.max(1, Number(o.parcelas) || 1);
  if (o.forma === "Entrada + parcelas"){ const ent = Math.min(total, Number(o.entrada) || 0); return `Entrada de ${brl(ent)} + ${n}× de ${brl((total - ent) / n)}`; }
  if (o.forma === "Cartão de crédito"){ const tc = totalCobrado(o);
    return `Cartão de crédito em ${n}× de ${brl(tc / n)}${tc > total + 0.009 ? ` (total ${brl(tc)}, com acréscimo da operadora)` : n > 1 ? " sem juros" : ""}`; }
  if (COM_PARCELAS.includes(o.forma) && n > 1) return `${o.forma} em ${n}× de ${brl(total / n)}`;
  return o.forma || "";
}
function simHTML(op, pode){
  if (op.forma !== "Cartão de crédito" || !(op.itens || []).length) return "";
  const sim = simulacaoCartao(op), atual = Math.max(1, Number(op.parcelas) || 1);
  return `<div class="orc-sim"><div class="orc-sim-t">Simulação no cartão de crédito${pode ? " <small>(clique para escolher)</small>" : ""}</div>
    <div class="orc-sim-g">${sim.map(x => `<button type="button" data-simn="${x.n}" aria-pressed="${x.n === atual}" ${pode ? "" : "disabled"}><b>${x.n}×</b> <span class="num">${brl(x.parc)}</span><small>${x.p ? "total " + brl(x.tot) : "sem juros"}</small></button>`).join("")}</div></div>`;
}
function localItem(i){
  const p = [];
  if (i.dentes?.length) p.push((i.dentes.length > 1 ? "dentes " : "dente ") + i.dentes.join(", ") + (i.faces?.length ? ` (${i.faces.join(", ")})` : ""));
  if (i.arcadas?.length) p.push(i.arcadas.length === 2 ? "arcadas superior e inferior" : i.arcadas[0] === "sup" ? "arcada superior" : "arcada inferior");
  return p.join(" · ");
}
function resumoOrc(o){
  const ops = o.opcoes || [];
  if (o.status === "cancelado") return `Cancelado: ${o.motivo_cancelamento || ""}`;
  if (o.status === "aprovado" && ops[o.opcao_escolhida - 1]) return `${nomeOpcao(ops[o.opcao_escolhida - 1], o.opcao_escolhida - 1)} · ${brl(totaisOpcao(ops[o.opcao_escolhida - 1]).total)}`;
  const tt = ops.filter(x => (x.itens || []).length).map(x => totaisOpcao(x).total);
  return `${ops.length} ${ops.length === 1 ? "opção" : "opções"}${tt.length ? " · " + (Math.min(...tt) === Math.max(...tt) ? brl(tt[0]) : `${brl(Math.min(...tt))} a ${brl(Math.max(...tt))}`) : " · vazio"}`;
}

// Escolhe a variação do procedimento: restauração pelo nº de faces; canal pelo tipo de dente
function variante(proc, ctx){
  const ativos = (E.procs || []).filter(p => p.ativo);
  const base = n => semAcento(n.split("(")[0]).trim();
  if (ctx.faces && /\(\s*\d\s*faces?\s*\)/i.test(proc.nome)){
    const alvo = Math.min(4, ctx.faces);
    const v = ativos.find(p => base(p.nome) === base(proc.nome) && new RegExp(`\\(\\s*${alvo}\\s*faces?\\s*\\)`, "i").test(p.nome));
    if (v) return v;
  }
  if (ctx.dente && ctx.dente < 50 && /canal/i.test(proc.nome)){
    const t = tipoDente(ctx.dente), raiz = t === "mol" ? "multi" : t === "pre" ? "bi" : "uni";
    const ret = semAcento(proc.nome).startsWith("retratamento");
    const v = ativos.find(p => semAcento(p.nome).startsWith(ret ? "retratamento" : "canal") && semAcento(p.nome).includes(raiz + "radicular"));
    if (v) return v;
  }
  return proc;
}

/* ---------- Calculadora de preço (Procedimentos → Calculadora de preço) ----------
   Custo da hora clínica = (custos fixos do consultório + retirada desejada das dentistas) ÷ horas de atendimento no mês.
   Custo do procedimento = hora clínica × tempo de cadeira + material + laboratório.
   Preço mínimo  = custo ÷ (1 − impostos − taxa do cartão)            → paga tudo, inclusive a retirada, sem lucro extra.
   Preço sugerido = custo ÷ (1 − impostos − taxa do cartão − margem)  → arredondado para cima de R$ 5 em R$ 5. */
const CALC_PADRAO = { fixos: 0, prolabore: 0, horas: 0, impostos: 10, cartao: 3, margem: 20 };
const calcP = () => ({ ...CALC_PADRAO, ...(E.calc || {}) });
const horaClinica = c => c.horas > 0 ? r2((Number(c.fixos) + Number(c.prolabore)) / c.horas) : 0;
function precoCalc(p, c){
  const hc = horaClinica(c), ded = (Number(c.impostos) + Number(c.cartao)) / 100, mg = Number(c.margem) / 100;
  if (!p.tempo_min || !hc) return { ok: false };
  const custo = r2(hc * p.tempo_min / 60 + Number(p.custo_material || 0) + Number(p.custo_lab || 0));
  const minimo = ded < 1 ? r2(custo / (1 - ded)) : NaN;
  const sug = ded + mg < 1 ? Math.ceil(custo / (1 - ded - mg) / 5) * 5 : NaN;
  const preco = Number(p.valor), margemReal = preco > 0 ? (preco * (1 - ded) - custo) / preco : -1;
  const sit = preco < minimo - 0.009 ? { k: "prej", rot: "Abaixo do custo", cls: "faltou" } : margemReal < mg - 0.0005 ? { k: "baixa", rot: "Margem baixa", cls: "vence-hoje" } : { k: "ok", rot: "OK", cls: "confirmado" };
  return { ok: true, custo, minimo, sug, margemReal, sit };
}
async function carregarCalc(){
  try{ const c = await api.config(); E.calc = { ...CALC_PADRAO, ...(c.calc_preco || {}) }; E.calcFalta = !("calc_preco" in c); }catch(e){ E.calc = { ...CALC_PADRAO }; E.calcFalta = true; }
  // sugestões: média dos últimos 3 meses completos (contas a pagar e agenda)
  const h = new Date(), ini = new Date(h.getFullYear(), h.getMonth() - 3, 1), fim = new Date(h.getFullYear(), h.getMonth(), 0);
  E.calcSugFixos = null; E.calcSugHoras = null;
  if (podeDespesas()) try{
    const ds = await api.despesasMes(inputData(ini), inputData(fim));
    const l = ds.filter(d => d.status !== "cancelada" && d.competencia >= inputData(ini) && d.competencia <= inputData(fim) && !["material", "laboratorio"].includes(d.categoria) && d.valor_total != null);
    const meses = new Set(l.map(d => d.competencia.slice(0, 7))).size;
    if (meses) E.calcSugFixos = { v: r2(l.reduce((s, d) => s + (vCons(d) || 0), 0) / meses), meses };
  }catch(e){}
  try{
    const ag = await api.agenda(ini, new Date(h.getFullYear(), h.getMonth(), 1));
    const min = ag.filter(a => !["cancelado", "faltou"].includes(a.status)).reduce((s, a) => s + Math.max(0, (new Date(a.fim) - new Date(a.inicio)) / 60000), 0);
    if (min > 0) E.calcSugHoras = Math.round(min / 60 / 3);
  }catch(e){}
}
function calcHTML(){

        ${num("cPro", "Retirada desejada das dentistas por mês", c.prolabore, " R$", `<small>Soma do que as duas querem tirar</small>`)}
        ${num("cHoras", "Horas de atendimento por mês", c.horas, " h", E.calcSugHoras ? `<button type="button" class="link-btn" data-sug="cHoras" data-v="${E.calcSugHoras}">Usar a média da agenda: ${E.calcSugHoras} h</button>` : `<small>As duas juntas, só horas com paciente</small>`)}
        <div class="calc-res"><span>Hora clínica</span><b class="num" id="cHora">${hc ? brl(hc) : "—"}</b><small id="cMin">${hc ? brl(r2(hc / 60)) + " por minuto" : "preencha horas e custos"}</small></div>
        ${num("cImp", "Impostos (estimativa)", c.impostos, " %", `<small>IR do Carnê-Leão sobre o recebido</small>`)}
        ${num("cCart", "Taxa média do cartão", c.cartao, " %")}
        ${num("cMarg", "Margem de lucro desejada", c.margem, " %", `<small>Além da retirada, para reserva e investimento</small>`)}
      </div>

    </section>
    <section class="panel">
      <div class="odo-head"><div><h2>Preço de cada procedimento</h2><p class="sub" style="margin:0">Preencha o tempo de cadeira e o custo de material e laboratório (por dente, arcada ou unidade, como na tabela). O sistema calcula o custo e o preço.${pode ? " Salva sozinho." : ""}</p></div>
        <div class="seg" role="group" aria-label="Filtro">${[["todos", `Todos (${calc.length})`], ["prob", `Com problema (${cont("prej") + cont("baixa")})`], ["sem", `Sem tempo (${semDados})`]].map(([k, r]) => `<button type="button" data-cf="${k}" aria-pressed="${(E.calcFiltro || "todos") === k}">${r}</button>`).join("")}</div></div>

          ${r.ok ? `<td class="num r">${brl(r.custo)}</td><td class="num r">${brl(r.minimo)}</td><td class="num r"><b>${isNaN(r.sug) ? "—" : brl(r.sug)}</b></td>
            <td class="num r ${r.margemReal < 0 ? "dp-neg" : ""}">${Math.round(r.margemReal * 100)}%</td><td><span class="pill ${r.sit.cls}">${r.sit.rot}</span></td>
            <td class="r">${pode && !isNaN(r.sug) && r.sug > Number(p.valor) + 0.009 ? `<button type="button" class="btn" data-usar="${p.id}" data-v="${r.sug}">Usar ${brl(r.sug)}</button>` : ""}</td>`

}
function ligarCalc(){
  const pode = editoPrecos();
  document.querySelectorAll("[data-cf]").forEach(b => b.onclick = () => { E.calcFiltro = b.dataset.cf; desenhar(); });
  const ler = () => ({ fixos: lerValor($("#cFixos").value) || 0, prolabore: lerValor($("#cPro").value) || 0, horas: lerValor($("#cHoras").value) || 0,
    impostos: lerValor($("#cImp").value) || 0, cartao: lerValor($("#cCart").value) || 0, margem: lerValor($("#cMarg").value) || 0 });
  const mostraHora = () => { const hc = horaClinica(ler()); $("#cHora").textContent = hc ? brl(hc) : "—"; $("#cMin").textContent = hc ? brl(r2(hc / 60)) + " por minuto" : "preencha horas e custos"; };
  ["#cFixos", "#cPro", "#cHoras"].forEach(s => { const i = $(s); if (i) i.oninput = mostraHora; });
  document.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { const i = $("#" + b.dataset.sug); if (i.disabled) return; i.value = fmtValor(Number(b.dataset.v)).replace(",00", ""); mostraHora(); });
  const sv = $("#calcSalvar");
  if (sv) sv.onclick = async () => {
    const c = ler(), err = $("#eCalc"); err.hidden = true;
    const bad = Object.entries(c).find(([, v]) => isNaN(v) || v < 0);
    if (bad) { err.textContent = "Confira os números (use, por exemplo, 2.500 ou 12,5)."; err.hidden = false; return; }
    if (c.impostos + c.cartao + c.margem >= 90){ err.textContent = "Impostos + cartão + margem estão altos demais (somam 90% ou mais)."; err.hidden = false; return; }
    sv.disabled = true;
    try{ await api.salvarConfig("calc_preco", c); E.calc = c; E.calcFalta = false; toast("Hora clínica salva"); desenhar(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; sv.disabled = false; }
  };
  if (!pode) return;
  document.querySelectorAll("tr[data-cp] .calc-cell").forEach(inp => inp.onchange = async () => {
    const id = inp.closest("tr").dataset.cp, f = inp.dataset.f, t = inp.value.trim();
    let v = t === "" ? (f === "tempo_min" ? null : 0) : f === "tempo_min" ? Math.round(lerValor(t)) : lerValor(t);
    if (v !== null && (isNaN(v) || v < 0 || (f === "tempo_min" && (v < 1 || v > 600)))){ toast(f === "tempo_min" ? "Tempo de 1 a 600 minutos." : "Valor inválido."); inp.focus(); return; }
    try{ const r = await api.salvarCustosProc(id, { [f]: v }); Object.assign(E.procs.find(p => p.id === id), r); const foco = document.activeElement?.closest?.("tr")?.dataset.cp + "|" + document.activeElement?.dataset?.f;
      desenhar(); const [fid, ff] = foco.split("|"); const el = document.querySelector(`tr[data-cp="${fid}"] [data-f="${ff}"]`); if (el){ el.focus(); el.select?.(); } }
    catch(e){ toast(/tempo_min|custo_|proc_tempo/.test(String(e.message)) ? "Falta rodar o arquivo 17_calculadora_preco.sql no Supabase." : erroAmigavel(e)); }
  });
  document.querySelectorAll("[data-usar]").forEach(b => b.onclick = async () => {
    if (!b.dataset.ok){ b.dataset.ok = 1; b.textContent = "Confirmar " + brl(Number(b.dataset.v)); return; }
    b.disabled = true;
    try{ const r = await api.salvarCustosProc(b.dataset.usar, { valor: Number(b.dataset.v) }); Object.assign(E.procs.find(p => p.id === b.dataset.usar), r); toast("Preço atualizado"); desenhar(); }
    catch(e){ toast(erroAmigavel(e)); b.disabled = false; }
  });
}

  ligaLinhas();
}

async function carregarOrcamento(){
  const o = await api.orcamento(E.orcId);
  const pid = o.paciente_id;
  const [pac, procs, odo, ass, termos] = await Promise.all([api.paciente(pid), api.procedimentos(), api.odontograma(pid),
    api.assinaturas(pid).catch(() => []), api.termos().catch(() => [])]);
  Object.assign(E, { orc: o, paciente: pac, procs, odonto: odo, assinaturas: ass, termos });
  E.orcParcs = []; E.orcRecs = [];
  try{ E.taxas = await api.taxas(); }catch(e){ E.taxas = []; }
  try{ const c = await api.config(); E.semJuros = Number(c.cartao_sem_juros_ate ?? 12); E.maqs = c.maquininhas || {}; }catch(e){ E.semJuros = 12; E.maqs = {}; }
  if (["aprovado", "cancelado"].includes(o.status)){
    try{ [E.orcParcs, E.orcRecs] = await Promise.all([api.parcelasDoOrcamento(o.id), api.recebimentosDoPaciente(pid)]); }
    catch(e){ avisoFalta11(e); }
  }
  if (E.orcRascId !== o.id || o.status !== "rascunho" || !E.orcRasc){ E.orcRasc = clone(o.opcoes || []); E.orcRascId = o.id; E.orcValidade = o.validade; E.orcEstado = ""; E.orcAba = null; }
  if (E.odoPac !== pid){ E.odoPend = []; E.odoPac = pid; E.odoDecidua = (idade(pac.data_nascimento) ?? 99) < 6; }
}

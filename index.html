<!doctype html>
<html lang="pt-BR">
<head>
<title>Agenda Ramirez Olmedo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
/* ================================================================
   CONFIGURAÇÃO — preencha para ligar ao banco de dados real.
   Com os dois campos vazios, a agenda abre em modo demonstração.
   (Os valores ficam no <script> no fim do arquivo: SUPABASE_URL
    e SUPABASE_CHAVE_PUBLICA.)
   ================================================================ */
:root{
  --bg:#F8F4EC; --surface:#FFFDF9; --surface-2:#F1EBDF; --ink:#2B2621; --muted:#776C5E;
  --line:#E4DACA; --line-soft:#EEE7DA; --gold:#A07C45; --gold-strong:#85632F; --on-gold:#FFFDF9;
  --ok:#3F7D55; --warn:#A86E14; --bad:#B4473B; --info:#3D6E8F;
  --shadow:0 10px 30px rgba(60,45,25,.14), 0 2px 6px rgba(60,45,25,.08);
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans:Karla, "Segoe UI", system-ui, -apple-system, sans-serif;
  --px-min:1.4px;  /* altura de 1 minuto na grade */
}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1814; --surface:#231E19; --surface-2:#2D2720; --ink:#EFE7DA; --muted:#A89B89;
    --line:#3A332A; --line-soft:#2F2922; --gold:#C9A46A; --gold-strong:#DDBB83; --on-gold:#1B1814;
    --ok:#6FB38A; --warn:#D9A24E; --bad:#E07A6E; --info:#7FB0D0;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1814; --surface:#231E19; --surface-2:#2D2720; --ink:#EFE7DA; --muted:#A89B89;
  --line:#3A332A; --line-soft:#2F2922; --gold:#C9A46A; --gold-strong:#DDBB83; --on-gold:#1B1814;
  --ok:#6FB38A; --warn:#D9A24E; --bad:#E07A6E; --info:#7FB0D0;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:600 26px/1 var(--serif);letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.demo-tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--gold-strong);border:1px solid var(--line)}

/* Barra de controles */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding-block:10px;border-block:1px solid var(--line)}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.date-title{font:600 22px/1.1 var(--serif);min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.icon{padding:7px 10px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.primary:hover{background:var(--gold-strong);border-color:var(--gold-strong)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.ok{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--gold-strong);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 8px;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="true"]{border-color:var(--c)}

/* Layout principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}

/* Grade da agenda */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-scroll{overflow:auto;max-height:max(480px, calc(100dvh - 200px))}
.cal-inner{min-width:100%}
.cal-head{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.cal-head div{padding:10px 8px;font-size:13px;font-weight:600;text-align:center;border-left:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.cal-head div:first-child{border-left:0}
.cal-head .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cal-head .today{color:var(--gold-strong)}
.cal-head small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cal-body{display:grid;position:relative}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line-soft);cursor:copy;
  background-image:linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
  background-size:100% calc(var(--px-min) * 30)}
.col.out{background-color:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

.appt{position:absolute;left:4px;right:4px;border-radius:7px;padding:4px 7px;overflow:hidden;cursor:pointer;z-index:1;
  background:color-mix(in srgb, var(--c) 16%, var(--surface));border:1px solid color-mix(in srgb, var(--c) 45%, var(--surface));
  display:flex;flex-direction:column;gap:1px;text-align:left;font-size:12.5px;line-height:1.25}
.appt:hover{box-shadow:var(--shadow);z-index:2}
.appt .t{font-weight:700;color:var(--ink)}
.appt .p{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .row{display:flex;gap:6px;align-items:center;justify-content:space-between;min-width:0}
.appt .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.s-concluido{opacity:.62}
.appt.s-faltou{background:color-mix(in srgb, var(--bad) 10%, var(--surface));border-color:color-mix(in srgb, var(--bad) 40%, var(--surface))}
.appt.s-faltou .nm{text-decoration:line-through}
.block{position:absolute;left:0;right:0;z-index:0;cursor:pointer;
  background:repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px);
  border-block:1px dashed var(--line);display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-size:11.5px;color:var(--muted);text-align:center}
.block span{background:var(--surface);padding:1px 6px;border-radius:4px}

/* Pílulas de status */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.agendado{color:var(--muted)}
.pill.confirmado{color:var(--ok)}
.pill.em_atendimento{color:var(--info)}
.pill.concluido{color:var(--muted);border-style:dotted}
.pill.faltou,.pill.cancelado{color:var(--bad)}

/* Painel lateral */
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font:600 19px/1.2 var(--serif);margin:0 0 2px}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line-soft);border-radius:8px;padding:8px}
.stat b{display:block;font:600 24px/1 var(--serif)}
.stat span{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding-block:9px;border-top:1px solid var(--line-soft)}
.li:first-child{border-top:0}
.li .h{font-weight:700;font-size:13px}
.li .n{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n small{display:block;color:var(--muted);font-size:12px}
.wa{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ok);text-decoration:none;border:1px solid color-mix(in srgb, var(--ok) 45%, var(--surface));border-radius:7px;padding:4px 8px;background:transparent}
.wa:hover{background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
.empty{font-size:13px;color:var(--muted);padding-block:6px}

/* Diálogos */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(520px, calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(30,22,12,.42)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg header{padding:16px 18px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line-soft)}
.dlg header h3{margin:0;font:600 22px/1.15 var(--serif)}
.dlg header p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.dlg .body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:12px 18px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--line-soft)}
.dlg footer .spacer{flex:1}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
.search{position:relative}
.results{position:static;margin-top:6px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-top:1px solid var(--line-soft)}
.results button:first-child{border-top:0}
.results button:hover,.results button.act{background:var(--surface-2)}
.results small{color:var(--muted)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--gold);background:color-mix(in srgb, var(--gold) 8%, var(--surface));border-radius:8px;padding:8px 10px}
.picked small{color:var(--muted);display:block}
.newp{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.newp p{margin:0;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;font-weight:500;background:color-mix(in srgb, var(--bad) 8%, var(--surface));border-radius:8px;padding:8px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.status-row{display:flex;flex-wrap:wrap;gap:6px}
.status-row button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.status-row button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}

/* Navegação entre telas */
.nav{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nav a{white-space:nowrap;padding:6px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--gold-strong)}
.nav a:hover{color:var(--ink)}
@media (max-width:560px){.nav a{padding:6px 10px;font-size:13.5px}}

/* Lista de pacientes */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:10px;border-block:1px solid var(--line)}
.tools .search-in{flex:1 1 280px;max-width:460px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .nm{font-weight:600}
.tbl .inativo{color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}

/* Ficha */
.back{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.back:hover{color:var(--gold-strong)}
.ficha-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ficha-top h1{font:600 34px/1.05 var(--serif);margin:4px 0 6px;text-wrap:balance}
.ficha-top .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.ficha-grid{grid-template-columns:minmax(0,1fr)}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.panel .acts .note{margin-right:auto}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border:1px solid var(--line-soft);border-radius:8px;padding:9px 10px;min-width:0}
.tile span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile b{display:block;font:600 19px/1.2 var(--serif);margin-top:3px}
.tile small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;flex-direction:column}
.hist button{display:grid;grid-template-columns:86px 1fr auto;gap:2px 12px;align-items:center;text-align:left;border:0;background:transparent;border-top:1px solid var(--line-soft);padding:10px 4px;width:100%}
.hist button:first-child{border-top:0}
.hist button:hover{background:var(--surface-2)}
.hist .d{font-weight:700;font-size:13px}
.hist .d small{display:block;font-weight:400;color:var(--muted)}
.hist .p{font-size:13.5px;min-width:0}
.hist .p small{display:block;color:var(--muted);font-size:12.5px}
.pront{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pront div{border:1px dashed var(--line);border-radius:8px;padding:10px}
.pront b{display:block;font-size:14px}
.pront small{color:var(--muted);font-size:12px}
.status-row button:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Anamnese */
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-gold)}
.tit{font:600 24px/1.15 var(--serif);margin:0}
.an-form{display:flex;flex-direction:column;gap:12px}
.an-secao{font:600 18px/1.2 var(--serif);margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line-soft);color:var(--gold-strong)}
.an-form .an-secao:first-child{border-top:0;padding-top:0;margin-top:0}
.an-q{display:flex;flex-direction:column;gap:6px}
.an-t{font-weight:600;font-size:14px}
.an-t .obr{color:var(--bad)}
.an-q textarea,.an-q .an-det{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.an-opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.an-op{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.an-escala{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.an-escala small{color:var(--muted);font-size:12px;margin-inline:4px}
.an-n{position:relative}
.an-n input{position:absolute;opacity:0;inset:0;cursor:pointer}
.an-n span{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:var(--surface)}
.an-n input:checked + span{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.an-n input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.leitura .an-q{padding:6px 8px;border-radius:8px}
.leitura .an-q.alerta{background:color-mix(in srgb, var(--bad) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--bad) 35%, var(--surface))}
.leitura input:disabled,.leitura textarea:disabled{opacity:1;color:var(--ink)}
.leitura .an-op:has(input:not(:checked)){opacity:.45}
.an-bloco{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.an-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.alertas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alertas span{font-size:12.5px;font-weight:600;color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 45%, var(--surface));background:color-mix(in srgb, var(--bad) 8%, var(--surface));border-radius:999px;padding:3px 10px}
#dlgAn{width:min(720px, calc(100vw - 24px))}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.ed-grid .prev{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto}
@media (max-width:980px){.ed-grid{grid-template-columns:minmax(0,1fr)}.ed-grid .prev{position:static;max-height:none}}
.ed-list{display:flex;flex-direction:column;gap:10px}
.ed-q{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ed-q.secao{background:var(--surface-2)}
.ed-top{display:flex;gap:8px;align-items:center}
.ed-n{font:600 16px/1 var(--serif);color:var(--gold-strong);min-width:22px;text-align:center}
.ed-acts{margin-left:auto;display:inline-flex;gap:4px}
.ed-q select,.ed-q input:not([type="checkbox"]),.ed-q textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;min-width:0}
.ed-q > input,.ed-q > textarea{width:100%}
.ed-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px}
.ed-row input[type="number"]{width:62px}
.ed-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.ed-hist{margin-top:14px;font-size:13.5px;color:var(--muted)}
.ed-hist summary{cursor:pointer;font-weight:600}

/* Odontograma */
.odo{margin-top:0}
.odo-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.odo-tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px}
.odo-t{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;display:inline-flex;gap:7px;align-items:center;font-size:13.5px}
.odo-t i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line)}
.odo-t[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.odo-proc{flex:1 1 220px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.odo-scroll{overflow-x:auto;margin-top:14px;padding-bottom:4px}
.odo-arc{min-width:760px;display:flex;flex-direction:column;gap:4px}
.odo-rot{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.odo-linha{display:grid;grid-template-columns:1fr 1fr}
.odo-lado{display:flex;gap:4px;justify-content:flex-end;padding-inline:8px}
.odo-lado.dir{justify-content:flex-start;border-left:2px solid var(--line)}
.odo-meio{height:2px;background:var(--line);margin-block:6px}
.odo-d{border:0;background:transparent;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px;width:44px;cursor:default}
.odo-d .num{font-size:11.5px;font-weight:700;color:var(--muted)}
.dente{width:40px;height:40px;display:block}
.dente .fc{stroke:var(--muted);stroke-width:1;cursor:pointer}
.dente .fc:hover{stroke:var(--ink);stroke-width:2}
.dente .fc.pend{stroke:var(--gold);stroke-width:2.5}
.dente .xis{stroke:#1F1B17;stroke-width:3;stroke-linecap:round}
:root[data-theme="dark"] .dente .xis{stroke:#EFE7DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dente .xis{stroke:#EFE7DA}}
.dente.ausente .fc{fill:var(--surface-2)!important;opacity:.6}
.dente .anel{fill:none;stroke:#2F6DB5;stroke-width:3}
.dente .xis,.dente .anel{pointer-events:none}
.odo-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px}
.odo-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.odo-leg small{color:var(--muted)}
.odo-save{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;padding:10px;border:1px dashed var(--gold);border-radius:10px;background:color-mix(in srgb, var(--gold) 7%, var(--surface))}
.odo-save span{margin-right:auto;font-size:13.5px}

/* Evolução */
.evo-form{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--bg)}
.evo-form textarea{min-height:96px}
.evo-lista{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.evo-i{position:relative;padding:12px 0 12px 18px;border-left:2px solid var(--line);margin-left:6px}
.evo-i::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.evo-i.corrigida{opacity:.6}
.evo-i.corrigida .evo-txt{text-decoration:line-through;text-decoration-color:var(--muted)}
.evo-i.corrigida::before{background:var(--muted)}
.evo-meta{font-size:13px;color:var(--muted)}
.evo-meta b{color:var(--ink)}
.evo-txt{white-space:pre-wrap;margin-top:6px;font-size:14.5px;max-width:80ch}
.evo-dentes{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.evo-dentes span{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface-2)}
.evo-tag{font-size:12.5px;color:var(--muted);margin-top:4px}
.evo-tag.aviso{color:var(--warn);font-weight:600}
.evo-cor{margin-top:6px;padding:3px 10px;font-size:12.5px}

/* Exames e imagens */
.anx-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.anx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.anx{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer;display:flex;flex-direction:column}
.anx:hover{border-color:var(--gold)}
.anx.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.anx-img{position:relative;aspect-ratio:4/3;background:#15120F;display:grid;place-items:center;overflow:hidden;max-width:100%}
.anx-img img{width:100%;height:100%;object-fit:cover}
.anx-pdf{font:700 22px/1 var(--sans);color:#EFE7DA;letter-spacing:.08em}
.anx-tag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 7px}
.anx-chk{position:absolute;right:6px;bottom:6px;font-size:11.5px;background:rgba(255,255,255,.9);color:#2B2621;border-radius:6px;padding:2px 7px;display:inline-flex;gap:4px;align-items:center}
.anx figcaption{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.anx figcaption b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anx figcaption small{color:var(--muted)}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:22px 12px;cursor:pointer;background:var(--bg)}
.drop.over,.drop:hover{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 6%, var(--bg))}
.drop small{color:var(--muted)}
.anx-fila{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.anx-fila li{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-size:13.5px;border-bottom:1px solid var(--line-soft);padding-block:4px}
.anx-fila li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anx-fila small{color:var(--muted)}
.anx-fila .st.ok{color:var(--ok)} .anx-fila .st.erro{color:var(--bad)} .anx-fila .st.env{color:var(--muted)}
#dlgImg{width:min(1100px, calc(100vw - 24px))}
.viewer-img{background:#0E0C0A;border-radius:10px;display:grid;place-items:center;min-height:300px;max-height:68dvh;overflow:auto}
.viewer-img img{max-width:100%;max-height:68dvh;object-fit:contain}
.viewer-ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px}
.viewer-ctl input[type=range]{vertical-align:middle;width:140px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp-lado{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp-lado figcaption{font-size:13.5px}
.cmp-lado img{width:100%;max-height:62dvh;object-fit:contain;background:#0E0C0A;border-radius:10px}

/* Assinaturas */
#dlgAss{width:min(760px, calc(100vw - 24px))}
.ass-texto{white-space:pre-wrap;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 16px;max-height:34dvh;overflow:auto;font:15px/1.6 var(--serif)}
.ass-texto.impresso{max-height:none;background:transparent;border:0;padding:0;font-size:16px}
.pad-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pad-wrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.pad-linha{position:absolute;left:16px;right:16px;bottom:34px;border-top:1px solid #bbb;font-size:11px;color:#999;padding-top:2px;pointer-events:none}
.ass-img{margin-top:16px}
.ass-img img{max-width:340px;width:100%;background:#fff;border-bottom:1px solid var(--ink);border-radius:4px}
.ass-nome{margin:6px 0 2px}
.ass-meta{font-size:12.5px;color:var(--muted);margin:0}
.ass-meta code{font-size:12px}

/* Odontograma anatômico */
.odo-a{width:44px;gap:3px;padding:2px}
.anat{width:40px;height:74px;display:block}
.anat .fc-dente{cursor:pointer}
.anat .coroa{fill:#F6F0E2;stroke:#8A7B66;stroke-width:1.1}
.anat .raiz{fill:#EDE3CC;stroke:#8A7B66;stroke-width:1.1}
.anat .fc-dente:hover .coroa,.anat .fc-dente:hover .raiz{stroke:var(--ink);stroke-width:1.8}
.anat.pend .coroa,.anat.pend .raiz,.anat.pend .impl{stroke:var(--gold);stroke-width:2.4}
.anat.ausente .coroa,.anat.ausente .raiz{opacity:.28}
.anat .impl{fill:#C9D8EC;stroke:#2F6DB5;stroke-width:1.4}
.anat .rosca{stroke:#2F6DB5;stroke-width:1.2}
.anat.implante .coroa{stroke:#2F6DB5;stroke-width:2.2}
.anat .canal{stroke-width:2.6;stroke-linecap:round;fill:none}
.anat .xis{stroke:#1F1B17;stroke-width:3;stroke-linecap:round;pointer-events:none}
:root[data-theme="dark"] .anat .xis{stroke:#EFE7DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .anat .xis{stroke:#EFE7DA}}
.circ{width:34px;height:34px;display:block}
.circ .fc{stroke:var(--muted);stroke-width:1;cursor:pointer}
.circ .fc:hover{stroke:var(--ink);stroke-width:2}
.circ .fc.pend{stroke:var(--gold);stroke-width:2.5}
.circ.ausente .fc{fill:var(--surface-2)!important;opacity:.5}
.anat-linha .odo-lado{align-items:flex-end}
.anat-linha + .odo-meio + .anat-linha .odo-lado{align-items:flex-start}

/* Orçamentos */
#dlgOrc{width:min(660px, calc(100vw - 24px))}
.tbl th.r,.tbl td.r{text-align:right}
.ficha-top h1 .pill{font-family:var(--sans)}
.pill.orc-rascunho{color:var(--muted);border-style:dotted}
.pill.orc-apresentado{color:var(--info)}
.pill.orc-aprovado{color:var(--ok)}
.pill.orc-recusado{color:var(--bad)}
.pill.orc-cancelado{color:var(--bad);border-style:dashed}
.orc-passos{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;counter-reset:passo}
.orc-passos li{counter-increment:passo;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.orc-passos li::before{content:counter(passo);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:12px}
.orc-passos li.feito{color:var(--ok)}
.orc-passos li.feito::before{content:"✓";background:color-mix(in srgb, var(--ok) 16%, var(--surface))}
.orc-passos li.atual{color:var(--ink);border-color:var(--gold);font-weight:600}
.orc-passos li.atual::before{background:var(--gold);color:var(--on-gold)}
.orc-abas{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.orc-aba{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:118px;max-width:230px}
.orc-aba b{font-size:14px}
.orc-aba span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.orc-aba small{font-weight:700;font-size:13px;color:var(--gold-strong)}
.orc-aba[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:color-mix(in srgb, var(--gold) 8%, var(--surface))}
.orc-aba-w{position:relative;display:flex}
.orc-aba-w .orc-aba{padding-right:28px}
.orc-x{position:absolute;top:3px;right:3px;border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:3px 6px;border-radius:6px}
.orc-x:hover{background:color-mix(in srgb, var(--bad) 12%, var(--surface));color:var(--bad)}
.orc-x[data-conf]{font-size:12px;font-weight:700;color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, var(--surface))}
.orc-aba.mais,.orc-aba.cmp{justify-content:center;align-items:center;min-width:0;font-weight:600;font-size:14px}
.orc-aba.mais{border-style:dashed;color:var(--gold-strong)}
.orc-op-head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.orc-n{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-strong);font-weight:700}
.orc-tit{flex:1 1 260px;font:600 20px/1.2 var(--serif);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0}
.orc-tit:disabled{background:transparent;border-color:transparent;color:var(--ink)}
.orc-itens-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 8px}
.orc-itens-head h3{margin:0;font:600 17px/1.2 var(--serif)}
.orc-tbl{min-width:620px}
.orc-tbl td{vertical-align:top}
.orc-tbl small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.orc-tbl .x{font-size:20px;padding:0 6px}
.orc-tot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:760px){.orc-tot{grid-template-columns:minmax(0,1fr)}}
.orc-soma{border:1px solid var(--line-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.orc-soma .ln{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.orc-soma .ln.tot{font:600 26px/1.1 var(--serif);border-top:1px solid var(--line);padding-top:8px}
.orc-soma .desc{display:inline-flex;gap:6px;align-items:center}
.orc-soma .desc select,.orc-soma .desc input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px}
.orc-soma .desc input{width:84px}
.orc-pag{font-size:13.5px;color:var(--muted)}
.orc-soma .orc-pag{text-align:right}
.orc-item-tot{font:600 20px/1.2 var(--serif);padding-top:6px}
.orc-barra{position:sticky;bottom:8px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.orc-barra > .note{margin-right:auto}
.orc-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.orc-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.orc-card.esc{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb, var(--ok) 40%, transparent)}
.orc-card.apagada{opacity:.55}
.orc-card .n{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-strong);font-weight:700}
.orc-card h3{margin:2px 0 0;font:600 21px/1.15 var(--serif)}
.orc-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;flex:1}
.orc-card li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line-soft);padding-bottom:5px}
.orc-card li small{display:block;color:var(--muted);font-size:12px}
.orc-card .tot{font:600 28px/1 var(--serif)}
.orc-cons.ok{border-color:color-mix(in srgb, var(--ok) 50%, var(--line))}
.orc-faces{display:flex;gap:6px;flex-wrap:wrap}
.orc-faces button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;min-width:44px}
.orc-faces button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.proc-lista{max-height:min(320px, 42dvh);overflow:auto;border:1px solid var(--line);border-radius:10px}
.proc-lista .cat{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:5px 12px;z-index:1}
.proc-lista button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line-soft);background:transparent;padding:8px 12px;font-size:14px}
.proc-lista .cat + button{border-top:0}
.proc-lista button:hover,.proc-lista button:focus-visible{background:var(--surface-2)}
.proc-lista small{color:var(--muted);white-space:nowrap}
.so-leitura .fc,.so-leitura .fc-dente{cursor:default;pointer-events:none}

/* Financeiro */
#dlgFin{width:min(680px, calc(100vw - 24px))}
.fin-tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 4px}
.fin-top .tile{background:var(--surface);padding:12px 14px}
.fin-top .tile b{font-size:24px}
.tile.ok b{color:var(--ok)}
.tile.bad b{color:var(--bad)}
.fin-h3{margin:16px 0 8px;font:600 17px/1.2 var(--serif)}
.fin-tbl{min-width:640px}
.fin-tbl td{vertical-align:middle}
.fin-tbl small{display:block;color:var(--muted);font-size:12px}
.fin-tbl tr.estornado td{color:var(--muted);text-decoration:line-through}
.fin-tbl tr.estornado td small{display:inline-block;text-decoration:none}
.fin-tbl .fin-tot td{font-weight:700;border-top:2px solid var(--line)}
.fin-acts{white-space:nowrap}
.fin-acts .wa{margin-left:6px}
.fin-in{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 7px}
.fin-formas{flex-wrap:wrap}
.fin-formas button{flex:1 1 auto}
.crm-tiles .crm-tile{text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.crm-tiles .crm-tile[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.crm-tile span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.crm-tile b{font:600 24px/1.1 var(--serif)}
.crm-tile small{font-size:12px;color:var(--muted)}
.crm-funil{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.crm-col{background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.crm-col h3{margin:2px 4px;font:600 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
.crm-col[data-etapa=fechou] h3{color:var(--ok)}.crm-col[data-etapa=perdido] h3{color:var(--bad)}
.crm-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.crm-card:hover,.crm-card:focus{border-color:var(--gold);outline:none}
.crm-card b{font-size:14px}.crm-card small{font-size:12px;color:var(--muted)}
.crm-acts{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:4px}
.crm-acts .btn.icon{width:30px;height:30px}
.crm-atras{color:var(--bad);font-weight:600}
.crm-vazio{text-align:center;margin:8px 0}
tr.crm-dest td{background:color-mix(in srgb, var(--warn) 8%, transparent)}
.crm-etapas{flex-wrap:wrap}
.crm-hist{border-top:1px solid var(--line-soft);padding-top:10px}
.ret-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;flex-wrap:wrap}
@media (max-width:900px){.crm-funil{grid-template-columns:repeat(5,200px)}}
.lab-li{width:100%;text-align:left;background:none;border:0;font:inherit;cursor:pointer}
.pr-funil .crm-acts .btn{font-size:13px;padding:5px 9px}
.ficha-atalhos{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.ficha-atalhos .btn{font-size:14px}
[data-dobra]{scroll-margin-top:70px}
.cad-mais-bt{margin:10px 0 4px;font-size:14px}
.cad-mais{margin-top:10px}
.pr-vista{margin:0 0 10px}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px;margin-top:12px;align-items:start}
.calc-in{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.calc-in span{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:400}
.calc-in input{width:100%;min-width:0}
.calc-in small{font-weight:400;font-size:12px}
.calc-res{border:1px solid var(--gold);border-radius:10px;padding:10px 12px;background:color-mix(in srgb, var(--gold) 8%, var(--surface));display:flex;flex-direction:column;gap:2px}
.calc-res span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}

const dia0 = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);

function avisoFalta07(e){ toast(erroAmigavel(e)); return []; }
function erroAmigavel(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (e && e.code === "23P01" || /sem_conflito/.test(m)) return "Esta dentista já tem uma consulta nesse horário.";

  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if (/cpf/i.test(m) && /duplicate|unique/i.test(m)) return "Já existe paciente com esse CPF.";
  if (/JSON object requested|0 rows|invalid input syntax for type uuid/i.test(m)) return "Paciente não encontrado.";
  if (/(column|coluna).*(cep|numero|bairro|cidade|complemento|uf)|'(cep|numero|bairro|cidade|complemento|uf)' column/i.test(m))
    return "O banco ainda não tem os campos de endereço com CEP. Rode o arquivo 05_endereco_cep.sql no Supabase (SQL Editor) e tente de novo.";
  if (/pacientes_cep_check/.test(m)) return "O CEP precisa ter 8 números.";
  if (/Payload too large|exceeded the maximum allowed size|413/i.test(m)) return "Arquivo grande demais para enviar.";
  if (/(procedimentos|orcamentos)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m))
    return "Falta rodar o arquivo 07_orcamentos.sql no Supabase (SQL Editor) para usar os orçamentos.";
  if (/(parcelas|recebimentos|taxas_cartao|parcelas_em_aberto)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m))
    return "Falta rodar o arquivo 11_recebimentos.sql no Supabase (SQL Editor) para usar o financeiro.";
  if (/(responsavel_cpf|receita_saude)/.test(m) && /(column|coluna|schema cache)/i.test(m))
    return "Falta rodar o arquivo 15_receita_saude.sql no Supabase (SQL Editor).";
  if (/pacientes_responsavel_cpf_check/.test(m)) return "O CPF do responsável precisa ter 11 números.";
  if (/profissional_id/.test(m) && /(column|coluna|schema cache)/i.test(m))
    return "Falta rodar o arquivo 14_taxas_por_dentista.sql no Supabase (SQL Editor).";
  if (/assinaturas_tipo_check/.test(m)) return "Falta rodar o arquivo 07_orcamentos.sql no Supabase para assinar o consentimento do orçamento.";
  if (/orc_tres_opcoes|orc_uma_opcao/.test(m)) return "Para apresentar ao paciente, o orçamento precisa de pelo menos 1 opção com procedimentos.";
  if (/já foi aprovado; não pode ser alterado/.test(m)) return "Falta rodar o arquivo 12_desfazer_escolha.sql no Supabase para poder desfazer a escolha.";
  if (/orcamentos_status_check|motivo_cancelamento|cancelado_em/.test(m) && !/Informe o motivo/.test(m)) return "Falta rodar o arquivo 09_cancelar_orcamento.sql no Supabase para cancelar orçamento aprovado.";
  if (/orc_escolha/.test(m)) return "Indique qual opção o paciente escolheu.";
  if (/procedimentos_nome_idx/.test(m)) return "Já existe um procedimento com esse nome.";
  if (/Bucket not found/i.test(m)) return "O espaço de arquivos \"prontuario\" não existe no Supabase. Avise quem configurou o sistema.";
  return m;
}

};
// clique no título de uma seção da ficha abre/fecha (lembrado neste computador)
function alternarDobra(k){
  if (E.fechadas.has(k)) E.fechadas.delete(k); else E.fechadas.add(k);
  try{ localStorage.setItem("odonto_fechadas", JSON.stringify([...E.fechadas])); }catch(e){}
  const app = document.querySelector(".app"); if (app) app.dataset.fechadas = [...E.fechadas].join(" ");
  document.querySelectorAll(`[data-dobra="${k}"] h2`).forEach(h => h.setAttribute("aria-expanded", !E.fechadas.has(k)));
}
document.addEventListener("click", ev => { const h = ev.target.closest("[data-dobra] h2"); if (!h || ev.target.closest("a,button:not(h2)")) return; alternarDobra(h.closest("[data-dobra]").dataset.dobra); });
document.addEventListener("keydown", ev => { const h = ev.target.closest?.("[data-dobra] h2"); if (h && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); alternarDobra(h.closest("[data-dobra]").dataset.dobra); } });
const tituloDobra = (txt, k, res) => `<h2 tabindex="0" role="button" aria-expanded="${!E.fechadas.has(k)}">${txt}${res ? ` <small class="dobra-res">· ${res}</small>` : ""}</h2>`;
const vejoProntuario = () => ["dentista","gestor"].includes(E.usuario?.papel);
const corDe = id => (E.equipe.find(e=>e.id===id)||{}).cor_agenda || "#A07C45";
const curto = e => e ? (e.curto || e.nome.replace(/^(Dra?\.)\s+(\S+).*/, "$1 $2")) : "";
const dentista = id => E.equipe.find(e=>e.id===id);

function periodo(){
  if (E.visao === "dia") return [dia0(E.data), somaDias(dia0(E.data),1)];
  const s = segunda(E.data); return [s, somaDias(s,6)];
}

async function carregar(){
  try{
    if (E.tela === "pacientes"){ E.lista = await api.listarPacientes(E.busca.trim(), E.inativos); return desenhar(); }
    if (E.tela === "ficha"){
      E.respostas = [];
      if (E.pacienteId === "novo"){ E.paciente = null; E.consultas = []; }
      else {
        [E.paciente, E.consultas] = await Promise.all([api.paciente(E.pacienteId), api.consultasDoPaciente(E.pacienteId)]);
        if (E.odoPac !== E.pacienteId){ E.orcsTodos = false; E.histTodos = false; E.evoTodos = false; E.parcTodas = false; E.odoPend = []; E.odoPac = E.pacienteId; E.evoRasc = ""; E.evoDentesRasc = ""; E.evoCorrigindo = null; E.anxSel = []; E.anxFiltro = "todos"; E.odoDecidua = (idade(E.paciente.data_nascimento) ?? 99) < 6; }
        if (vejoProntuario()) [E.respostas, E.modelos, E.odonto, E.odoHist] = await Promise.all([api.respostasDoPaciente(E.pacienteId), api.modelos(),
          api.odontograma(E.pacienteId), api.historicoOdonto(E.pacienteId)]);
        if (vejoProntuario()){
          [E.evolucoes, E.anexos, E.assinaturas, E.termos] = await Promise.all([api.evolucoes(E.pacienteId), api.anexos(E.pacienteId),
            api.assinaturas(E.pacienteId).catch(avisoFalta06), api.termos().catch(avisoFalta06)]);
          E.orcs = await api.orcamentos(E.pacienteId).catch(avisoFalta07);
          E.anxUrls = {};
        }
        try{ [E.parcs, E.recs, E.taxas] = await Promise.all([api.parcelasDoPaciente(E.pacienteId), api.recebimentosDoPaciente(E.pacienteId), api.taxas()]); E.finFalta = false; }
        catch(e){ avisoFalta11(e); E.parcs = []; E.recs = []; E.taxas = []; E.finFalta = true; }
        try{ E.maqs = (await api.config()).maquininhas || {}; }catch(e){ E.maqs = {}; }
      }
      return desenhar();
    }
    if (E.tela === "procedimentos"){ E.procs = await api.procedimentos(); if (E.procVista === "calc") await carregarCalc(); return desenhar(); }
    if (E.tela === "orcamento"){ await carregarOrcamento(); return desenhar(); }
    if (E.tela === "financeiro"){ await carregarFinanceiro(); return desenhar(); }
    if (E.tela === "despesas"){ await carregarDespesas(); return desenhar(); }
    if (E.tela === "crm"){ await carregarCrm(); return desenhar(); }
    if (E.tela === "proteses"){ await carregarProteses(); return desenhar(); }
    if (E.tela === "painel"){ await carregarPainel(); return desenhar(); }
    if (E.tela === "anamneses" || E.tela === "editor"){ [E.modelos, E.termos] = await Promise.all([api.modelos(), api.termos().catch(avisoFalta06)]); return desenhar(); }
  }catch(e){ toast(erroAmigavel(e)); if (E.tela === "orcamento"){ lerEndereco._ok = true; location.hash = E.orc?.paciente_id ? "#paciente/" + E.orc.paciente_id : "#pacientes"; return; } if (E.tela === "ficha"){ lerEndereco._ok = true; location.hash = "#pacientes"; } else if (E.tela !== "agenda") desenhar(); return; }
  const [ini, fim] = periodo();
  // próximo dia útil com consultas a confirmar
  const amanha = somaDias(dia0(new Date()),1);
  const alvo = amanha.getDay()===0 ? somaDias(amanha,1) : amanha;
  try{
    const [ag, bl, prox] = await Promise.all([api.agenda(ini, fim), api.bloqueios(ini, fim), api.agenda(alvo, somaDias(alvo,1))]);
    E.agenda = ag; E.bloqueios = bl; E.proximos = prox.filter(a => a.status==="agendado" || a.status==="confirmado"); E.proxDia = alvo;
  }catch(e){ toast(erroAmigavel(e)); }
  desenhar();
}

function desenhar(){
  if (E.tela === "pacientes") return desenharLista();
  if (E.tela === "ficha") return desenharFicha();
  if (E.tela === "anamneses") return desenharModelos();
  if (E.tela === "editor") return desenharEditor();
  if (E.tela === "procedimentos") return desenharProcedimentos();
  if (E.tela === "orcamento") return desenharOrcamento();
  if (E.tela === "financeiro") return desenharFinanceiro();
  if (E.tela === "despesas") return desenharDespesas();
  if (E.tela === "crm") return desenharCrm();
  if (E.tela === "proteses") return desenharProteses();
  if (E.tela === "painel") return desenharPainel();
  const [ini] = periodo();
  const tituloDia = fmtDia(E.data,{weekday:"long", day:"numeric", month:"long"});
  const titulo = E.visao==="dia"
    ? tituloDia.charAt(0).toUpperCase() + tituloDia.slice(1)
    : `Semana de ${fmtDia(ini,{day:"numeric", month:"short"})} a ${fmtDia(somaDias(ini,5),{day:"numeric", month:"short"})}`;
  const chips = E.equipe.map(e => `<button class="chip" style="--c:${esc(e.cor_agenda)}" data-dent="${e.id}" aria-pressed="${E.visao==='semana' ? E.semanaDe===e.id : E.visiveis.has(e.id)}"><span class="dot"></span>${esc(curto(e))}</button>`).join("");

  const rolagem = $(".cal-scroll")?.scrollTop || 0;
  $("#root").innerHTML = `
  <div class="app">
    ${cabecalhoHTML()}

    <div class="bar">
      <div class="group">
        <button class="btn icon" id="bAnt" aria-label="Anterior">‹</button>
        <button class="btn" id="bHoje">Hoje</button>
        <button class="btn icon" id="bProx" aria-label="Próximo">›</button>
        <input type="date" id="iData" class="btn" value="${inputData(E.data)}" aria-label="Ir para a data" style="padding:6px 8px">
        <div class="date-title">${esc(titulo)}</div>
      </div>
      <div class="group">
        <div class="seg" role="group" aria-label="Visão">
          <button data-visao="dia" aria-pressed="${E.visao==='dia'}">Dia</button>
          <button data-visao="semana" aria-pressed="${E.visao==='semana'}">Semana</button>
        </div>
        ${chips}
        <button class="btn" id="bBloq">Bloquear horário</button>
        <button class="btn primary" id="bNova">+ Nova consulta</button>
      </div>
    </div>

    <div class="main">
      <section class="cal" aria-label="Grade da agenda">${gradeHTML()}</section>
      <aside class="side">${painelHTML()}</aside>
    </div>
  </div>`;
  ligarEventos();
  const sc = $(".cal-scroll");
  if (sc){
    if (!desenhar._rolou){
      desenhar._rolou = true;
      const agora = new Date();
      const alvo = (mesmoDia(E.data, agora) && agora.getHours() >= EXPEDIENTE.inicio && agora.getHours() < HORA_FIM)
        ? minutosDoDia(agora) - HORA_INICIO*60 - 90 : (EXPEDIENTE.inicio - HORA_INICIO)*60 - 30;
      const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--px-min")) || 1.4;
      sc.scrollTop = Math.max(0, alvo * px);
    } else sc.scrollTop = rolagem;
  }
}

function colunas(){
  const [ini] = periodo();
  if (E.visao === "dia") return E.equipe.filter(e=>E.visiveis.has(e.id)).map(e => ({dia: dia0(E.data), dent: e}));
  const e = dentista(E.semanaDe) || E.equipe[0];
  return Array.from({length:6}, (_,i) => ({dia: somaDias(ini,i), dent: e}));
}

function gradeHTML(){
  const cols = colunas();
  if (!cols.length) return `<p class="empty" style="padding:24px">Selecione pelo menos uma dentista acima.</p>`;
  const alturaTotal = (HORA_FIM-HORA_INICIO)*60;
  const tpl = `56px repeat(${cols.length}, minmax(${E.visao==='semana' ? 118 : 150}px, 1fr))`;
  const hoje = new Date();
  const cab = cols.map(c => E.visao==="dia"
    ? `<div style="--c:${esc(c.dent.cor_agenda)}"><span class="dot"></span><span>${esc(curto(c.dent))}<small>${esc(c.dent.cro||"")}</small></span></div>`
    : `<div class="${mesmoDia(c.dia,hoje)?'today':''}"><span>${esc(fmtDia(c.dia,{weekday:"short"}))}<small class="num">${esc(fmtDia(c.dia,{day:"2-digit",month:"2-digit"}))}</small></span></div>`).join("");
  let horas = "";
  for (let h=HORA_INICIO+1; h<HORA_FIM; h++) horas += `<span class="num" style="top:calc(var(--px-min) * ${(h-HORA_INICIO)*60})">${String(h).padStart(2,"0")}:00</span>`;

  const corpo = cols.map((c, ci) => {
    const dIni = new Date(c.dia); dIni.setHours(HORA_INICIO,0,0,0);
    const dFim = new Date(c.dia); dFim.setHours(HORA_FIM,0,0,0);
    const topo = d => Math.max(0, Math.min(alturaTotal, (new Date(d)-dIni)/60000));
    const fora = [[HORA_INICIO, EXPEDIENTE.inicio],[EXPEDIENTE.fim, HORA_FIM]].map(([a,b]) =>
      `<div style="position:absolute;left:0;right:0;top:calc(var(--px-min) * ${(a-HORA_INICIO)*60});height:calc(var(--px-min) * ${(b-a)*60});background:color-mix(in srgb, var(--surface-2) 60%, transparent);pointer-events:none"></div>`).join("");
    const blq = E.bloqueios.filter(b => (!b.profissional_id || b.profissional_id===c.dent.id) && sobrepoe(b.inicio,b.fim,dIni,dFim)).map(b => {
      const t = topo(b.inicio), h = topo(b.fim)-t;
      return `<div class="block" data-bloq="${b.id}" style="top:calc(var(--px-min) * ${t});height:calc(var(--px-min) * ${h})" title="${esc(b.motivo)}"><span>${esc(b.motivo)}${b.profissional_id ? "" : " · consultório"}</span></div>`;
    }).join("");
    const ags = E.agenda.filter(a => a.profissional_id===c.dent.id && a.status!=="cancelado" && sobrepoe(a.inicio,a.fim,dIni,dFim)).map(a => {
      const t = topo(a.inicio), h = Math.max(22, topo(a.fim)-t);
      const curtoCard = h < 40;
      return `<button class="appt s-${a.status}" data-appt="${a.id}" style="--c:${esc(corDe(a.profissional_id))};top:calc(var(--px-min) * ${t});height:calc(var(--px-min) * ${h} - 2px)">
        <div class="row"><span class="t num">${hhmm(a.inicio)}${curtoCard ? "" : "–"+hhmm(a.fim)}</span><span class="pill ${a.status}">${STATUS[a.status].rot}</span></div>
        <div class="nm">${esc(a.paciente?.nome || "Paciente")}</div>
        ${curtoCard ? "" : `<div class="p">${esc(a.procedimento||"")}</div>`}
      </button>`;
    }).join("");
    const agora = mesmoDia(c.dia, hoje) && hoje>dIni && hoje<dFim ? `<div class="now-line" style="top:calc(var(--px-min) * ${topo(hoje)})"></div>` : "";
    return `<div class="col" data-col="${ci}" data-dia="${inputData(c.dia)}" data-dent="${c.dent.id}" style="height:calc(var(--px-min) * ${alturaTotal})">${fora}${blq}${ags}${agora}</div>`;
  }).join("");

  return `<div class="cal-scroll"><div class="cal-inner">
    <div class="cal-head" style="grid-template-columns:${tpl}"><div></div>${cab}</div>
    <div class="cal-body" style="grid-template-columns:${tpl}"><div class="hours" style="height:calc(var(--px-min) * ${alturaTotal})">${horas}</div>${corpo}</div>
  </div></div>`;
}

function painelHTML(){
  const hoje = new Date();
  const doDia = E.agenda.filter(a => mesmoDia(a.inicio, E.visao==="dia" ? E.data : hoje) && a.status!=="cancelado");
  const n = s => doDia.filter(a=>a.status===s).length;
  const rotDia = E.visao==="dia" ? (mesmoDia(E.data,hoje) ? "Hoje" : fmtDia(E.data,{day:"numeric",month:"short"})) : "Hoje";
  const pend = E.proximos.filter(a => a.status==="agendado");
  const conf = E.proximos.filter(a => a.status==="confirmado");
  const nomeProx = mesmoDia(E.proxDia||hoje, somaDias(dia0(hoje),1)) ? "amanhã" : fmtDia(E.proxDia||hoje,{weekday:"long"});
  const itens = pend.map(a => `
    <div class="li">
      <span class="h num">${hhmm(a.inicio)}</span>
      <span class="n">${esc(a.paciente?.nome)}<small>${esc(curto(dentista(a.profissional_id)))}${a.procedimento ? " · "+esc(a.procedimento) : ""}</small></span>
      ${a.paciente?.telefone ? `<a class="wa" href="${linkWhats(a)}" target="_blank" rel="noopener" data-wa="${a.id}">WhatsApp</a>` : `<span class="note">sem telefone</span>`}
    </div>`).join("");
  return `
    <div class="panel">
      <h2>${esc(rotDia)}</h2>
      <p class="sub">${doDia.length} consulta${doDia.length===1?"":"s"} ${E.equipe.length>1 && E.visao==="dia" ? "nas agendas visíveis" : ""}</p>
      <div class="stats">
        <div class="stat"><b class="num">${n("confirmado")+n("em_atendimento")}</b><span>confirmadas</span></div>
        <div class="stat"><b class="num">${n("agendado")}</b><span>a confirmar</span></div>
        <div class="stat"><b class="num">${n("concluido")}</b><span>concluídas</span></div>
      </div>
      ${n("faltou") ? `<p class="note" style="margin:10px 0 0;color:var(--bad)">${n("faltou")} falta${n("faltou")>1?"s":""} registrada${n("faltou")>1?"s":""}</p>` : ""}
    </div>
    <div class="panel">
      <h2>Confirmar ${esc(nomeProx)}</h2>
      <p class="sub">${pend.length ? `${pend.length} aguardando · ${conf.length} já confirmada${conf.length===1?"":"s"}` : (conf.length ? `Todas as ${conf.length} consultas confirmadas.` : "Nenhuma consulta marcada.")}</p>
      <div class="list">${itens || ""}</div>
      ${pend.length ? `<p class="note" style="margin:8px 0 0">O botão abre o WhatsApp com a mensagem pronta. Quando o paciente responder, abra a consulta e marque "Confirmado".</p>` : ""}
    </div>`;
}

function linkWhats(a){
  const d = dentista(a.profissional_id);
  const fone = soDigitos(a.paciente?.telefone);
  const num = fone.startsWith("55") && fone.length > 11 ? fone : "55"+fone;
  const primeiro = (a.paciente?.nome||"").split(" ")[0];
  const quando = mesmoDia(a.inicio, somaDias(new Date(),1)) ? "amanhã" : fmtDia(a.inicio,{weekday:"long", day:"numeric", month:"numeric"});
  const msg = `Olá, ${primeiro}! Aqui é do consultório ${CONSULTORIO}. Passando para confirmar sua consulta com a ${d ? d.nome.split(" ").slice(0,2).join(" ") : "dentista"} ${quando}, às ${hhmm(a.inicio)}. Podemos confirmar? Se precisar remarcar, é só responder esta mensagem.`;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

function ligarEventos(){
  const passo = E.visao==="dia" ? 1 : 7;
  $("#bAnt").onclick = () => { E.data = somaDias(E.data, -passo); if (E.visao==="dia" && E.data.getDay()===0) E.data = somaDias(E.data,-1); carregar(); };
  $("#bProx").onclick = () => { E.data = somaDias(E.data, passo); if (E.visao==="dia" && E.data.getDay()===0) E.data = somaDias(E.data,1); carregar(); };
  $("#bHoje").onclick = () => { E.data = dia0(new Date()); desenhar._rolou = false; carregar(); };
  $("#iData").onchange = e => { if (e.target.value){ E.data = juntar(e.target.value,"00:00"); carregar(); } };
  document.querySelectorAll("[data-visao]").forEach(b => b.onclick = () => { E.visao = b.dataset.visao; if (!E.semanaDe) E.semanaDe = E.equipe[0]?.id; carregar(); });
  document.querySelectorAll(".chip[data-dent]").forEach(b => b.onclick = () => {
    const id = b.dataset.dent;
    if (E.visao==="semana") E.semanaDe = id;
    else { if (E.visiveis.has(id) && E.visiveis.size>1) E.visiveis.delete(id); else E.visiveis.add(id); }
    desenhar();
  });
  $("#bNova").onclick = () => abrirForm({});
  $("#bBloq").onclick = () => abrirBloqueio({});
  ligarSair();

  document.querySelectorAll(".col").forEach(col => col.addEventListener("click", ev => {
    if (ev.target.closest(".appt") || ev.target.closest(".block")) return;
    const r = col.getBoundingClientRect();
    const pxMin = r.height / ((HORA_FIM-HORA_INICIO)*60);
    let min = Math.floor(((ev.clientY - r.top) / pxMin) / 15) * 15 + HORA_INICIO*60;
    const hora = `${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}`;
    abrirForm({data: col.dataset.dia, hora, profissional_id: col.dataset.dent});
  }));
  document.querySelectorAll("[data-appt]").forEach(el => el.onclick = () => abrirConsulta(el.dataset.appt));
  document.querySelectorAll("[data-bloq]").forEach(el => el.onclick = ev => { ev.stopPropagation(); abrirBloqueioExistente(el.dataset.bloq); });
  document.querySelectorAll("[data-wa]").forEach(el => el.addEventListener("click", () => marcarEnvio(el.dataset.wa)));
}

async function marcarEnvio(id){
  try{ await api.atualizarAgendamento(id, {confirmacao_enviada_em: new Date().toISOString()}); }catch(e){}
}

/* ---------------- Formulário: nova consulta / editar ---------------- */
function abrirForm(pre){
  const dlg = $("#dlgAppt");
  const ed = pre.id ? (pre.obj || E.agenda.find(a=>a.id===pre.id)) : null;
  const dIni = ed ? new Date(ed.inicio) : null;
  const dur = ed ? Math.round((new Date(ed.fim)-new Date(ed.inicio))/60000) : 60;
  let paciente = ed ? ed.paciente : (pre.paciente || null);
  const data = ed ? inputData(dIni) : (pre.data || inputData(E.data));
  const hora = ed ? inputHora(dIni) : (pre.hora || "09:00");
  const dent = ed ? ed.profissional_id : (pre.profissional_id || (E.visao==="semana" ? E.semanaDe : [...E.visiveis][0]) || E.equipe[0]?.id);
  const durs = [15,30,45,60,90,120,150,180]; if (!durs.includes(dur)) durs.push(dur);

  dlg.innerHTML = `
  <form class="dlg" id="fAppt" novalidate>
    <header><div><h3>${ed ? "Editar consulta" : "Nova consulta"}</h3><p>${ed ? esc(ed.paciente?.nome) : "Busque o paciente pelo nome ou telefone"}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="field">
        <label for="iPac">Paciente</label>
        <div id="pacBox"></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="iDia">Data</label><input type="date" id="iDia" value="${data}" required></div>
        <div class="field"><label for="iHora">Início</label><input type="time" id="iHora" value="${hora}" step="900" required></div>
        <div class="field"><label for="iDur">Duração</label><select id="iDur">${durs.sort((a,b)=>a-b).map(m=>`<option value="${m}" ${m===dur?"selected":""}>${m<60?m+" min":(m/60|0)+"h"+(m%60?String(m%60).padStart(2,"0"):"")}</option>`).join("")}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="iDent">Dentista</label><select id="iDent">${E.equipe.map(e=>`<option value="${e.id}" ${e.id===dent?"selected":""}>${esc(curto(e))}</option>`).join("")}</select></div>
        <div class="field"><label for="iProc">Procedimento</label><input id="iProc" list="lProc" value="${esc(ed?.procedimento||"")}" placeholder="Ex.: Avaliação"><datalist id="lProc">${PROCEDIMENTOS.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
      </div>
      <div class="field"><label for="iObs">Observações</label><textarea id="iObs" placeholder="Ex.: paciente prefere horário cedo; trazer exame">${esc(ed?.observacoes||"")}</textarea></div>
      <div class="err" id="eAppt" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="bSalvar">${ed ? "Salvar alterações" : "Marcar consulta"}</button></footer>
  </form>`;
  dlg.showModal();
  dlg.querySelectorAll("[data-fechar]").forEach(b => b.onclick = () => dlg.close());

  const box = $("#pacBox", dlg);
  const pintarPac = () => {
    if (paciente){
      box.innerHTML = `<div class="picked"><span><b>${esc(paciente.nome)}</b><small class="num">${esc(fmtFone(paciente.telefone)) || "sem telefone"}</small></span>${ed ? "" : `<button type="button" class="btn ghost" id="bTroca">Trocar</button>`}</div>`;
      const t = $("#bTroca", box); if (t) t.onclick = () => { paciente = null; pintarPac(); $("#iPac", dlg).focus(); };
      return;
    }
    box.innerHTML = `<div class="search"><input id="iPac" autocomplete="off" placeholder="Digite o nome ou o telefone"><div class="results" id="res" hidden></div></div><div id="novoBox"></div>`;
    const inp = $("#iPac", box), res = $("#res", box);
    let seq = 0;
    inp.oninput = async () => {
      const q = inp.value.trim(); const my = ++seq;
      if (q.length < 2){ res.hidden = true; return; }
      let lista = []; try{ lista = await api.buscarPacientes(q); }catch(e){ }
      if (my !== seq) return;
      res.innerHTML = lista.map(p=>`<button type="button" data-p='${esc(JSON.stringify(p))}'><span>${esc(p.nome)}</span><small class="num">${esc(fmtFone(p.telefone))}</small></button>`).join("")
        + (/\d{4}/.test(q) ? "" : `<button type="button" data-novo="1"><span>+ Cadastrar <b>${esc(q)}</b> como paciente novo</span></button>`);
      res.hidden = false;
      // mousedown (e não click): escolhe antes de o campo perder o foco
      res.querySelectorAll("[data-p]").forEach(b => b.onmousedown = ev => { ev.preventDefault(); paciente = JSON.parse(b.dataset.p); esconderErro(); pintarPac(); });
      const nv = res.querySelector("[data-novo]"); if (nv) nv.onmousedown = ev => { ev.preventDefault(); esconderErro(); novoPaciente(q); };
    };
    inp.onkeydown = ev => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      const primeiro = res.querySelector("[data-p]") || res.querySelector("[data-novo]");
      if (!res.hidden && primeiro) primeiro.dispatchEvent(new MouseEvent("mousedown", {cancelable:true}));
    };
    inp.onblur = () => setTimeout(()=> res.hidden = true, 180);
    inp.onfocus = () => { if (res.innerHTML) res.hidden = false; };
  };
  const novoPaciente = nome => {
    $(".search", box).hidden = true;
    $("#novoBox", box).innerHTML = `<div class="newp">
      <p>Cadastro rápido. Os demais dados (CPF, endereço, anamnese) são preenchidos na ficha do paciente.</p>
      <div class="grid2">
        <div class="field"><label for="nNome">Nome completo</label><input id="nNome" value="${esc(nome)}"></div>
        <div class="field"><label for="nFone">WhatsApp / telefone</label><input id="nFone" inputmode="tel" placeholder="(17) 99999-0000"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" id="nVolta">Voltar à busca</button><button type="button" class="btn" id="nOk">Cadastrar paciente</button></div>
    </div>`;
    $("#nFone", box).focus();
    $("#nVolta", box).onclick = () => pintarPac();
    $("#nOk", box).onclick = () => cadastrarNovo();
  };
  // Cadastra o paciente do formulário rápido. Devolve true se deu certo.
  const cadastrarNovo = async () => {
    const n = $("#nNome", box).value.trim().replace(/\s+/g," "), f = soDigitos($("#nFone", box).value);
    if (n.split(" ").length < 2){ mostrarErro("Informe nome e sobrenome do paciente."); $("#nNome", box).focus(); return false; }
    if (f.length < 10){ mostrarErro("Informe o telefone com DDD (10 ou 11 dígitos)."); $("#nFone", box).focus(); return false; }
    const btn = $("#nOk", box); if (btn) btn.disabled = true;
    try{ paciente = await api.criarPaciente({nome:n, telefone:f}); esconderErro(); pintarPac(); toast("Paciente cadastrado"); return true; }
    catch(e){ mostrarErro(erroAmigavel(e)); if (btn) btn.disabled = false; return false; }
  };
  const mostrarErro = m => { const e = $("#eAppt", dlg); e.textContent = m; e.hidden = false; };
  const esconderErro = () => $("#eAppt", dlg).hidden = true;
  pintarPac();
  if (!ed) setTimeout(()=> $("#iPac", dlg)?.focus(), 30);

  $("#fAppt").onsubmit = async ev => {
    ev.preventDefault();
    if (!paciente){
      // formulário de paciente novo preenchido: cadastra junto, num passo só
      if ($("#nNome", box)){ if (!(await cadastrarNovo())) return; }
      else if ($("#iPac", box)?.value.trim()) return mostrarErro("Clique no nome do paciente na lista, ou em \"+ Cadastrar ... como paciente novo\".");
      else return mostrarErro("Busque o paciente pelo nome ou telefone.");
    }
    const d = $("#iDia", dlg).value, h = $("#iHora", dlg).value;
    if (!d || !h) return mostrarErro("Informe data e horário.");
    const ini = juntar(d, h), fim = new Date(ini.getTime() + Number($("#iDur", dlg).value)*60000);
    const campos = { paciente_id: paciente.id, profissional_id: $("#iDent", dlg).value, inicio: ini.toISOString(), fim: fim.toISOString(),
      procedimento: $("#iProc", dlg).value.trim() || null, observacoes: $("#iObs", dlg).value.trim() || null };
    const b = $("#bSalvar", dlg); b.disabled = true;
    try{
      if (ed) await api.atualizarAgendamento(ed.id, campos); else await api.criarAgendamento(campos);
      dlg.close(); toast(ed ? "Consulta atualizada" : `Consulta marcada: ${fmtDia(ini,{day:"numeric",month:"short"})} às ${hhmm(ini)}`);
      E.data = dia0(ini); if (E.visao==="dia") E.visiveis.add(campos.profissional_id); else E.semanaDe = campos.profissional_id;
      desenhar._rolou = false;
      carregar();
    }catch(e){ mostrarErro(erroAmigavel(e)); b.disabled = false; }
  };
}

/* ---------------- Detalhe da consulta ---------------- */
function abrirConsulta(id, obj){
  const a = obj || E.agenda.find(x=>x.id===id) || E.consultas.find(x=>x.id===id); if (!a) return;
  const aindaNaoComecou = new Date(a.inicio) > new Date();
  const soDepois = ["em_atendimento","concluido","faltou"];
  const dlg = $("#dlgView"); const d = dentista(a.profissional_id);
  const passado = new Date(a.inicio) < new Date();
  dlg.innerHTML = `
  <div class="dlg">
    <header><div><h3>${esc(a.paciente?.nome)}</h3><p class="num">${esc(fmtDia(a.inicio,{weekday:"long",day:"numeric",month:"long"}))} · ${hhmm(a.inicio)}–${hhmm(a.fim)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <dl class="kv">
        <dt>Dentista</dt><dd>${esc(d?.nome||"")}</dd>
        <dt>Procedimento</dt><dd>${esc(a.procedimento||"—")}</dd>
        <dt>Telefone</dt><dd class="num">${esc(fmtFone(a.paciente?.telefone))||"—"}</dd>
        ${a.observacoes ? `<dt>Observações</dt><dd>${esc(a.observacoes)}</dd>` : ""}
        <dt>Confirmação</dt><dd>${a.confirmacao_enviada_em ? `WhatsApp aberto em ${esc(fmtDia(a.confirmacao_enviada_em,{day:"2-digit",month:"2-digit"}))} às ${hhmm(a.confirmacao_enviada_em)}` : "Mensagem ainda não enviada"}</dd>
      </dl>
      <div class="field">
        <label>Situação</label>
        <div class="status-row">${Object.entries(STATUS).map(([k,v])=>`<button type="button" data-st="${k}" aria-pressed="${a.status===k}" ${aindaNaoComecou && soDepois.includes(k) && a.status!==k ? "disabled" : ""}>${v.rot}</button>`).join("")}</div>
        ${aindaNaoComecou ? `<p class="note" style="margin:0">"Em atendimento", "Concluído" e "Faltou" ficam disponíveis a partir do horário da consulta.</p>` : ""}
      </div>
      <div class="err" id="eView" hidden></div>
    </div>
    <footer>
      ${a.paciente?.telefone && !passado ? `<a class="wa" href="${linkWhats(a)}" target="_blank" rel="noopener" id="vWa">Confirmar pelo WhatsApp</a>` : ""}
      <span class="spacer"></span>
      ${E.tela === "ficha" ? "" : `<a class="btn" href="#paciente/${a.paciente_id}" id="vFicha">Ficha do paciente</a>`}
      ${E.tela !== "ficha" && souDentista() && !aindaNaoComecou && a.status !== "cancelado" ? `<a class="btn" href="#paciente/${a.paciente_id}" id="vEvo">Registrar atendimento</a>` : ""}
      <button type="button" class="btn" id="vEdit">Editar / remarcar</button>
    </footer>
  </div>`;
  dlg.showModal();
  dlg.querySelectorAll("[data-fechar]").forEach(b => b.onclick = () => dlg.close());
  const wa = $("#vWa", dlg); if (wa) wa.addEventListener("click", async () => { await marcarEnvio(a.id); });
  $("#vEdit", dlg).onclick = () => { dlg.close(); abrirForm({id: a.id, obj: a}); };
  const vf = $("#vFicha", dlg); if (vf) vf.onclick = () => dlg.close();
  const ve = $("#vEvo", dlg); if (ve) ve.onclick = () => { E.evoPre = a.id; E.evoFoco = true; dlg.close(); };
  dlg.querySelectorAll("[data-st]").forEach(b => b.onclick = async () => {
    const st = b.dataset.st; if (st === a.status) return;
    try{
      await api.atualizarAgendamento(a.id, {status: st});
      dlg.close(); toast(`Situação: ${STATUS[st].rot}`); carregar();
    }catch(e){ const el = $("#eView", dlg); el.textContent = erroAmigavel(e); el.hidden = false; }
  });
}

/* ---------------- Bloqueios ---------------- */
function abrirBloqueio(){
  const dlg = $("#dlgBlock");
  const dent = E.visao==="semana" ? E.semanaDe : [...E.visiveis][0];
  dlg.innerHTML = `
  <form class="dlg" id="fBloq" novalidate>
    <header><div><h3>Bloquear horário</h3><p>Almoço, curso, férias ou feriado. Ninguém consegue marcar consulta por cima.</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="field"><label for="bDent">Agenda</label><select id="bDent"><option value="">Consultório inteiro</option>${E.equipe.map(e=>`<option value="${e.id}" ${e.id===dent?"selected":""}>${esc(curto(e))}</option>`).join("")}</select></div>
      <div class="grid2">
        <div class="field"><label for="bIniD">Início</label><input type="date" id="bIniD" value="${inputData(E.data)}"></div>
        <div class="field"><label for="bIniH">&nbsp;</label><input type="time" id="bIniH" value="12:00" step="900"></div>
        <div class="field"><label for="bFimD">Fim</label><input type="date" id="bFimD" value="${inputData(E.data)}"></div>
        <div class="field"><label for="bFimH">&nbsp;</label><input type="time" id="bFimH" value="13:30" step="900"></div>
      </div>
      <div class="field"><label for="bMot">Motivo</label><input id="bMot" list="lMot" placeholder="Ex.: Almoço"><datalist id="lMot"><option value="Almoço"><option value="Curso"><option value="Férias"><option value="Feriado"><option value="Compromisso pessoal"></datalist></div>
      <div class="err" id="eBloq" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary">Bloquear</button></footer>
  </form>`;
  dlg.showModal();
  dlg.querySelectorAll("[data-fechar]").forEach(b => b.onclick = () => dlg.close());
  $("#bIniD", dlg).onchange = e => { $("#bFimD", dlg).value = e.target.value; };
  $("#fBloq").onsubmit = async ev => {
    ev.preventDefault();
    const ini = juntar($("#bIniD",dlg).value, $("#bIniH",dlg).value), fim = juntar($("#bFimD",dlg).value, $("#bFimH",dlg).value);
    const mot = $("#bMot", dlg).value.trim(); const err = $("#eBloq", dlg);
    const pid = $("#bDent", dlg).value || null;
    if (!mot){ err.textContent = "Informe o motivo do bloqueio."; err.hidden = false; return; }
    if (fim <= ini){ err.textContent = "O fim precisa ser depois do início."; err.hidden = false; return; }
    const choque = (await api.agenda(ini, fim)).filter(a => !["cancelado","faltou"].includes(a.status) && (!pid || a.profissional_id===pid));
    if (choque.length && !ev.submitter?.dataset.forcar){
      err.innerHTML = `Já há ${choque.length} consulta${choque.length>1?"s":""} nesse período (${choque.map(a=>esc(a.paciente?.nome?.split(" ")[0])+" "+hhmm(a.inicio)).join(", ")}). Remarque ${choque.length>1?"essas consultas":"essa consulta"} antes, ou bloqueie mesmo assim.`;
      err.hidden = false;
      const f = dlg.querySelector("footer"); if (!f.querySelector("[data-forcar]")) f.insertAdjacentHTML("afterbegin", `<button type="submit" class="btn danger" data-forcar="1">Bloquear mesmo assim</button><span class="spacer"></span>`);
      return;
    }
    try{ await api.criarBloqueio({profissional_id: pid, inicio: ini.toISOString(), fim: fim.toISOString(), motivo: mot}); dlg.close(); toast("Horário bloqueado"); carregar(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; }
  };
}

function abrirBloqueioExistente(id){
  const b = E.bloqueios.find(x=>x.id===id); if (!b) return;
  const dlg = $("#dlgBlock");
  dlg.innerHTML = `
  <div class="dlg">
    <header><div><h3>${esc(b.motivo)}</h3><p class="num">${b.profissional_id ? esc(curto(dentista(b.profissional_id))) : "Consultório inteiro"} · ${esc(fmtDia(b.inicio,{day:"numeric",month:"short"}))} ${hhmm(b.inicio)} até ${mesmoDia(b.inicio,b.fim) ? "" : esc(fmtDia(b.fim,{day:"numeric",month:"short"}))+" "}${hhmm(b.fim)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body"><p class="note" id="bMsg" style="margin:0">Remover o bloqueio libera esse horário para novas consultas.</p><div class="err" id="eB2" hidden></div></div>
    <footer><button type="button" class="btn ghost" data-fechar>Fechar</button><button type="button" class="btn danger" id="bDel">Remover bloqueio</button></footer>
  </div>`;
  dlg.showModal();
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  const del = $("#bDel", dlg);
  del.onclick = async () => {
    if (!del.dataset.certo){ del.dataset.certo = "1"; del.textContent = "Confirmar remoção"; $("#bMsg", dlg).textContent = "Clique de novo para confirmar."; return; }
    try{ await api.apagarBloqueio(b.id); dlg.close(); toast("Bloqueio removido"); carregar(); }
    catch(e){ const el = $("#eB2", dlg); el.textContent = erroAmigavel(e); el.hidden = false; }
  };
}

function ligarSair(){

  if (bs) bs.onclick = async () => { await api.sair(); history.replaceState(null, "", location.pathname); iniciar(); };
}
const numWhats = fone => { const f = soDigitos(fone); return f.startsWith("55") && f.length > 11 ? f : "55" + f; };

function desenharLista(){
  const lista = E.pacDent ? E.lista.filter(p => p.dentista_responsavel === E.pacDent) : E.lista;
  const linhas = lista.map(p => {
    const i = idade(p.data_nascimento);

      <td class="num">${esc(fmtFone(p.telefone)) || "—"}</td>
      <td class="num">${i === null ? "—" : i + " anos"}</td>
      <td class="num">${esc(fmtCpf(p.cpf)) || "—"}</td><td>${p.dentista_responsavel ? esc(curto(dentista(p.dentista_responsavel))) : "—"}</td></tr>`;
  }).join("");
  const n = lista.length;
  $("#root").innerHTML = `<div class="app">${cabecalhoHTML()}
    <div class="tools">
      <input id="iBusca" class="search-in" type="search" placeholder="Buscar por nome, telefone ou CPF" value="${esc(E.busca)}" autocomplete="off" aria-label="Buscar paciente">
      <div class="group">
        <div class="seg" role="group" aria-label="Dentista responsável"><button type="button" data-pd="" aria-pressed="${!E.pacDent}">Todas</button>${E.equipe.map(e => `<button type="button" data-pd="${e.id}" aria-pressed="${E.pacDent === e.id}">${esc(curto(e))}</button>`).join("")}</div>
        <label class="chk"><input type="checkbox" id="iInat" ${E.inativos ? "checked" : ""}> Mostrar inativos</label>
        <a class="btn primary" href="#paciente/novo">+ Novo paciente</a>
      </div>
    </div>
    <p class="note" style="margin:0">${n} paciente${n === 1 ? "" : "s"}${E.busca.trim() ? ` para "${esc(E.busca.trim())}"` : ""}</p>
    ${n ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Nome</th><th>WhatsApp / telefone</th><th>Idade</th><th>CPF</th><th>Dentista</th></tr></thead>
        <tbody>${linhas}</tbody></table></div>`
      : `<div class="panel"><p class="empty">${E.busca.trim()
          ? "Nenhum paciente encontrado. Confira a grafia ou busque pelo telefone."
          : "Nenhum paciente cadastrado ainda. Os pacientes marcados pela agenda aparecem aqui."}</p></div>`}
  </div>`;
  ligarSair();
  const b = $("#iBusca"); let t;
  b.oninput = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      E.busca = b.value; await carregar();
      const nb = $("#iBusca"); if (nb){ nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); }
    }, 250);
  };
  $("#iInat").onchange = e => { E.inativos = e.target.checked; carregar(); };
  document.querySelectorAll("[data-pd]").forEach(x => x.onclick = () => { E.pacDent = x.dataset.pd || null; desenharLista(); });
  document.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.onclick = () => location.hash = "#paciente/" + tr.dataset.id;
    tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); };
  });
  if (E.busca){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
}

function lerFormPaciente(){
  const out = {};
  document.querySelectorAll("#fPac [data-campo]").forEach(el => { out[el.dataset.campo] = el.value.trim(); });
  const at = $("#pAtivo"); if (at) out.ativo = at.checked;

  if (!novo && vejoProntuario()){ ligarOdonto(); ligarEvolucao(); ligarImagens(); ligarAssinaturas(); ligarOrcamentosFicha(); }
  if (!novo && !E.finFalta) ligarFinanceiroFicha();

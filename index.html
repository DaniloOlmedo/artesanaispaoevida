    <div class="orc-itens-head"><h3>Procedimentos desta opção</h3>${pode ? `<button type="button" class="btn" id="opSemDente">+ Procedimento sem dente</button>` : ""}</div>
    ${linhas ? `<div class="tbl-wrap"><table class="tbl orc-tbl"><thead><tr><th>Procedimento</th><th>Local</th><th class="r">Qtd</th><th class="r">Valor</th><th class="r">Total</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`
      : `<p class="empty">${pode ? "Nenhum procedimento ainda. Clique num dente acima ou use “+ Procedimento sem dente” (consulta, profilaxia, clareamento…)." : "Opção vazia."}</p>`}
    <div class="orc-tot">
      <div class="orc-pagto">
        <div class="grid2">
          <div class="field"><label for="opForma">Forma de pagamento</label><select id="opForma" ${dis}>${FORMAS_PAG.map(f => `<option ${op.forma === f ? "selected" : ""}>${f}</option>`).join("")}</select></div>
          <div class="field" id="boxParc" ${COM_PARCELAS.includes(op.forma) ? "" : "hidden"}><label for="opParc">Parcelas</label><input id="opParc" type="number" min="1" max="36" value="${op.parcelas || 1}" ${dis}></div>
          <div class="field" id="boxEnt" ${op.forma === "Entrada + parcelas" ? "" : "hidden"}><label for="opEnt">Entrada (R$)</label><input id="opEnt" inputmode="decimal" value="${fmtValor(op.entrada || 0)}" ${dis}></div>
        </div>
        <div id="opSim">${simHTML(op, pode)}</div>
        <div class="field" style="margin-top:10px"><label for="opObs">Observações para o paciente</label><textarea id="opObs" rows="2" placeholder="Ex.: número de sessões, garantia, o que está incluso" ${dis}>${esc(op.obs || "")}</textarea></div>
      </div>
      <div class="orc-soma">
        <div class="ln"><span>Subtotal</span><b class="num" id="opSub">${brl(t.subtotal)}</b></div>
        <div class="ln"><span class="desc">Desconto <select id="opDTipo" aria-label="Tipo de desconto" ${dis}><option value="valor" ${op.desc_tipo !== "pct" ? "selected" : ""}>R$</option><option value="pct" ${op.desc_tipo === "pct" ? "selected" : ""}>%</option></select>
          <input id="opDVal" inputmode="decimal" aria-label="Valor do desconto" value="${fmtValor(op.desc_valor || 0)}" ${dis}></span><span class="num" id="opDesc">${t.desconto ? "− " + brl(t.desconto) : brl(0)}</span></div>
        <div class="ln tot"><span>Total</span><span class="num" id="opTot">${brl(t.total)}</span></div>
        <div class="orc-pag" id="opPag">${esc(pagamentoTexto(op))}</div>
      </div>
    </div>
  </section>`;
}

function comparaHTML(o, ops){
  const escolhe = o.status === "apresentado" && souDentista();
  return `${o.status === "rascunho" ? `<p class="note" style="margin:0">Visão do paciente. Depois de “Apresentar ao paciente”, cada opção ganha o botão para registrar a escolha.</p>` : ""}
  ${escolhe ? `<p class="note" style="margin:0">${ops.length > 1 ? "Mostre as opções ao paciente. Quando ele decidir, clique em “Paciente escolheu esta opção”." : "Mostre o orçamento ao paciente. Se ele aceitar, clique em “Paciente aceitou o orçamento”."}</p>` : ""}
  <div class="orc-cmp">${ops.map((op, i) => {
    const t = totaisOpcao(op), foi = foiEscolhida(o, i);
    return `<article class="orc-card${foi && o.status === "aprovado" ? " esc" : ["aprovado", "cancelado"].includes(o.status) ? " apagada" : ""}">
      <div><span class="n">Opção ${i + 1}</span>${op.titulo?.trim() ? `<h3>${esc(op.titulo)}</h3>` : ""}</div>
      <ul>${(op.itens || []).map(it => `<li><span>${esc(it.nome)}${localItem(it) ? `<small>${esc(localItem(it))}${it.qtd > 1 ? ` · ${it.qtd} × ${brl(it.valor_unit)}` : ""}</small>` : it.qtd > 1 ? `<small>${it.qtd} × ${brl(it.valor_unit)}</small>` : ""}</span><b class="num">${brl(it.valor_total)}</b></li>`).join("") || `<li class="note">Sem procedimentos.</li>`}</ul>
      ${t.desconto ? `<div class="note num">Subtotal ${brl(t.subtotal)} · desconto ${brl(t.desconto)}</div>` : ""}
      <div><div class="tot num">${brl(t.total)}</div><div class="orc-pag">${esc(pagamentoTexto(op))}</div>${op.forma !== "Cartão de crédito" && (E.taxas || []).length ? `<div class="orc-pag" style="margin-top:4px">${esc(resumoCartao(op))}</div>` : ""}</div>
      ${op.obs?.trim() ? `<p class="note" style="margin:0">${esc(op.obs)}</p>` : ""}
      ${escolhe ? `<button type="button" class="btn primary" data-escolher="${i}">${ops.length > 1 ? "Paciente escolheu esta opção" : "Paciente aceitou o orçamento"}</button>` : ""}
      ${foi ? `<span class="pill ${o.status === "cancelado" ? "cancelado" : "confirmado"}" style="align-self:flex-start">${o.status === "cancelado" ? "Escolhida (orçamento cancelado)" : "Escolhida pelo paciente"}</span>` : ""}
    </article>`; }).join("")}</div>`;
}

function consentimentoHTML(o){
  const a = consentDe(o);
  if (o.status === "cancelado") return a ? `<section class="panel orc-cons"><div class="odo-head"><div><h2>Consentimento</h2><p class="sub" style="margin:0">Assinado por <b>${esc(a.assinante_nome)}</b> em ${fmtDia(a.assinado_em, { day: "2-digit", month: "2-digit", year: "numeric" })}, antes do cancelamento. Fica guardado.</p></div><button type="button" class="btn" id="orcVerCons">Ver documento assinado</button></div></section>` : "";
  if (o.status !== "aprovado") return "";
  return `<section class="panel orc-cons ${a ? "ok" : ""}">
    <div class="odo-head"><div><h2>Consentimento</h2>
      <p class="sub" style="margin:0">${a ? `Assinado por <b>${esc(a.assinante_nome)}</b> em ${fmtDia(a.assinado_em, { day: "2-digit", month: "2-digit", year: "numeric" })} às ${hhmm(a.assinado_em)}.`
        : `Escolha confirmada em ${fmtDia(o.aprovado_em, { day: "2-digit", month: "2-digit", year: "numeric" })}. Falta o paciente assinar o consentimento do tratamento escolhido.`}</p></div>
      ${a ? `<button type="button" class="btn" id="orcVerCons">Ver documento assinado</button>` : souDentista() ? `<button type="button" class="btn primary" id="orcColetar">Coletar assinatura do consentimento</button>` : ""}</div>
  </section>`;
}

function barraOrcHTML(o){
  const dent = souDentista(), wa = E.paciente?.telefone && !["rascunho", "cancelado"].includes(o.status);
  const b = [];
  if (o.status === "rascunho" && dent) b.push(`<span class="note" id="orcSalvo" aria-live="polite">${esc(E.orcEstado || "As alterações são salvas sozinhas.")}</span>`,
    `<button type="button" class="btn ghost danger" id="orcExcluir">Excluir rascunho</button>`, `<button type="button" class="btn" id="orcImprimir">Imprimir</button>`,
    `<button type="button" class="btn primary" id="orcApresentar">Apresentar ao paciente</button>`);
  else {
    b.push(`<span class="note">${o.status === "apresentado" ? "Para mudar alguma opção, volte à edição." : o.status === "aprovado" ? (!consentDe(o) && !(E.orcParcs || []).some(p => p.status !== "cancelada") ? "Escolha confirmada. Algo errado (forma de pagamento, opção)? Antes da assinatura, use “Desfazer escolha” e depois “Voltar a editar”." : "Orçamento aprovado: não pode mais ser alterado. Se foi engano ou o paciente desistiu, use “Cancelar orçamento”.") : o.status === "cancelado" ? "Orçamento cancelado: fica guardado no histórico." : ""}</span>`);
    if (o.status === "aprovado" && dent && !consentDe(o) && !(E.orcParcs || []).some(p => p.status !== "cancelada"))
      b.push(`<button type="button" class="btn ghost" id="orcDesfazer" title="Volta para a escolha do paciente. Só enquanto ele não assinou o consentimento.">Desfazer escolha</button>`);
    if (o.status === "aprovado" && dent) b.push(`<button type="button" class="btn ghost danger" id="orcCancelar">Cancelar orçamento</button>`);
    if (o.status === "apresentado" && dent) b.push(`<button type="button" class="btn ghost" id="orcEditar">Voltar a editar</button>`, `<button type="button" class="btn ghost danger" id="orcRecusou">Paciente recusou</button>`);
    if (wa) b.push(`<a class="wa" id="orcWa" target="_blank" rel="noopener" href="${linkWhatsOrc(o)}">Enviar por WhatsApp</a>`);
    b.push(`<button type="button" class="btn" id="orcImprimir">Imprimir</button>`);
    if (["aprovado", "recusado", "cancelado"].includes(o.status) && dent) b.push(`<button type="button" class="btn" id="orcCopiar">Copiar para um novo orçamento</button>`);
  }
  return `<div class="orc-barra">${b.join("")}</div>`;
}

function desenharOrcamento(){
  const o = E.orc, p = E.paciente, pode = orcEditavel(), ops = opcoesOrc();
  if (E.orcAba !== "comparar" && (E.orcAba == null || E.orcAba >= ops.length)) E.orcAba = pode ? 0 : "comparar";
  const aba = E.orcAba, prof = dentista(o.profissional_id);
  const y = window.scrollY;
  $("#root").innerHTML = `<div class="app">${cabecalhoHTML()}
    <div>
      <a class="back" href="#paciente/${p.id}">‹ ${esc(p.nome)}</a>
      <div class="ficha-top">
        <div>
          <h1>Orçamento nº ${o.numero} <span class="pill orc-${o.status}" style="vertical-align:middle;font-size:12px">${ORC_STATUS[o.status]}</span></h1>
          <div class="meta num"><span>${esc(p.nome)}</span><span>Feito em ${fmtDia(o.criado_em, { day: "2-digit", month: "2-digit", year: "numeric" })}${prof ? " por " + esc(curto(prof)) : ""}</span>
            ${pode ? `<label class="chk" style="font-size:14px">Válido até <input type="date" id="orcVal" value="${esc(E.orcValidade || "")}" class="btn" style="padding:3px 6px"></label>`
              : o.validade ? `<span>Válido até ${fmtDia(o.validade + "T12:00:00", { day: "2-digit", month: "2-digit", year: "numeric" })}</span>` : ""}</div>
        </div>
      </div>
    </div>
    ${passosOrc(o)}
    <div class="orc-abas" role="tablist" aria-label="Opções do orçamento">
      ${ops.map((op, i) => `<span class="orc-aba-w"><button type="button" class="orc-aba" role="tab" data-aba="${i}" aria-pressed="${aba === i}"><b>Opção ${i + 1}${foiEscolhida(o, i) ? " ✓" : ""}</b><span>${esc(op.titulo?.trim() || ((op.itens || []).length ? (op.itens.length + " procedimento" + (op.itens.length > 1 ? "s" : "")) : "vazia"))}</span><small class="num">${brl(totaisOpcao(op).total)}</small></button>${pode && ops.length > 1 ? `<button type="button" class="orc-x" data-delop="${i}" aria-label="Excluir a Opção ${i + 1}" title="Excluir a Opção ${i + 1}">×</button>` : ""}</span>`).join("")}
      ${pode ? `<button type="button" class="orc-aba mais" id="orcMais">+ Opção</button>` : ""}
      <button type="button" class="orc-aba cmp" data-aba="comparar" aria-pressed="${aba === "comparar"}">${ops.length > 1 ? "Comparar opções" : "Visão do paciente"}</button>
    </div>
    <div class="err" id="eOrc" hidden></div>
    ${aba === "comparar" ? comparaHTML(o, ops) : opcaoHTML(ops[aba], aba, pode)}
    ${consentimentoHTML(o)}
    ${pagamentoOrcHTML(o)}
    ${barraOrcHTML(o)}
  </div>`;
  window.scrollTo(0, y);
  ligarSair(); ligarOrcamento();
}

function erroOrc(m){ const e = $("#eOrc"); e.textContent = m; e.hidden = false; e.scrollIntoView({ block: "center" }); }
function confirmaDuplo(bt, texto, acao){
  // primeiro clique pede confirmação; segundo executa (evita janelas do navegador)
  bt.onclick = () => {
    if (bt.dataset.conf){ acao(); return; }
    const orig = bt.textContent; bt.dataset.conf = "1"; bt.textContent = texto;
    setTimeout(() => { if (bt.isConnected){ delete bt.dataset.conf; bt.textContent = orig; } }, 4000);
  };
}

function ligarOrcamento(){
  const o = E.orc, pode = orcEditavel(), ops = opcoesOrc();
  document.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => { E.orcAba = b.dataset.aba === "comparar" ? "comparar" : Number(b.dataset.aba); desenhar(); });
  document.querySelectorAll("[data-odeci]").forEach(b => b.onclick = () => { E.odoDecidua = b.dataset.odeci === "1"; desenhar(); });
  const imp = $("#orcImprimir"); if (imp) imp.onclick = () => imprimir(orcamentoImpressoHTML(o, ops), `Orçamento ${o.numero} — ${E.paciente.nome}`);
  ligarPagamentoOrc(o);
  const vc = $("#orcVerCons"); if (vc) vc.onclick = () => verAssinatura(consentDe(o).id);
  const co = $("#orcColetar"); if (co) co.onclick = () => abrirColeta(consentimentoOrcamento(o));
  document.querySelectorAll("[data-escolher]").forEach(b => b.onclick = () => confirmarEscolha(Number(b.dataset.escolher)));
  const ed = $("#orcEditar"); if (ed) ed.onclick = () => mudarStatus({ status: "rascunho" }, "Orçamento de volta à edição", () => { E.orcRasc = null; E.orcAba = 0; });
  const cc = $("#orcCancelar"); if (cc) cc.onclick = () => cancelarOrc();
  const dz = $("#orcDesfazer"); if (dz) confirmaDuplo(dz, "Confirmar: desfazer escolha", () => mudarStatus({ status: "apresentado" }, "Escolha desfeita. Use “Voltar a editar” para corrigir.", () => { E.orcAba = "comparar"; }));
  const rc = $("#orcRecusou"); if (rc) confirmaDuplo(rc, "Confirmar recusa", () => mudarStatus({ status: "recusado" }, "Recusa registrada"));
  const cp = $("#orcCopiar");
  if (cp) cp.onclick = async () => { cp.disabled = true;
    try{ const n = await api.criarOrcamento({ paciente_id: o.paciente_id, opcoes: clone(ops).map((x, i) => ({ ...x, numero: i + 1 })) }); toast("Novo orçamento criado a partir do nº " + o.numero); location.hash = "#orcamento/" + n.id; }
    catch(e){ toast(erroAmigavel(e)); cp.disabled = false; } };
  if (!pode){
    if (typeof E.orcAba === "number") document.querySelectorAll(".orc-tbl tr[data-item]").forEach(tr => tr.style.cursor = "default");
    return;
  }
  // ---- edição (rascunho) ----
  const vd = $("#orcVal"); if (vd) vd.onchange = () => { E.orcValidade = vd.value || null; orcMudou(); };
  $("#orcMais").onclick = () => { E.orcRasc.push(novaOpcao(E.orcRasc.length + 1)); E.orcAba = E.orcRasc.length - 1; orcMudou(); desenhar(); };
  const ex = $("#orcExcluir");
  if (ex) confirmaDuplo(ex, "Confirmar exclusão", async () => {
    try{ clearTimeout(E.orcTimer); E.orcTimer = null; await api.apagarOrcamento(o.id); toast("Rascunho excluído"); E.orcRasc = null; location.hash = "#paciente/" + o.paciente_id; }
    catch(e){ erroOrc(erroAmigavel(e)); } });
  $("#orcApresentar").onclick = apresentarOrc;
  if (typeof E.orcAba !== "number") return;
  const op = E.orcRasc[E.orcAba];
  const ligaSim = () => document.querySelectorAll("[data-simn]").forEach(b => b.onclick = () => { op.parcelas = Number(b.dataset.simn); $("#opParc").value = op.parcelas; atualizaTotais(); orcMudou(); });
  const atualizaTotais = () => {
    const t = totaisOpcao(op);
    $("#opSub").textContent = brl(t.subtotal); $("#opDesc").textContent = t.desconto ? "− " + brl(t.desconto) : brl(0);
    $("#opTot").textContent = brl(t.total); $("#opPag").textContent = pagamentoTexto(op);
    $("#opSim").innerHTML = simHTML(op, true); ligaSim();
    const ab = document.querySelector(`[data-aba="${E.orcAba}"] small`); if (ab) ab.textContent = brl(t.total);
  };
  $("#opTit").oninput = e => { op.titulo = e.target.value; const s = document.querySelector(`[data-aba="${E.orcAba}"] span`); if (s) s.textContent = op.titulo.trim() || (op.itens.length ? op.itens.length + " procedimento" + (op.itens.length > 1 ? "s" : "") : "vazia"); orcMudou(); };
  $("#opForma").onchange = e => { op.forma = e.target.value; if (!COM_PARCELAS.includes(op.forma)) op.parcelas = 1; if (op.forma === "Cartão de crédito") op.parcelas = Math.min(12, op.parcelas || 1); if (op.forma !== "Entrada + parcelas") op.entrada = 0;
    $("#boxParc").hidden = !COM_PARCELAS.includes(op.forma); $("#boxEnt").hidden = op.forma !== "Entrada + parcelas"; $("#opParc").value = op.parcelas; atualizaTotais(); orcMudou(); };
  $("#opParc").oninput = e => { op.parcelas = Math.min(op.forma === "Cartão de crédito" ? 12 : 36, Math.max(1, parseInt(e.target.value) || 1)); atualizaTotais(); orcMudou(); };
  ligaSim();
  $("#opEnt").oninput = e => { const v = lerValor(e.target.value); op.entrada = isNaN(v) ? 0 : v; atualizaTotais(); orcMudou(); };
  $("#opObs").oninput = e => { op.obs = e.target.value; orcMudou(); };
  $("#opDTipo").onchange = e => { op.desc_tipo = e.target.value; atualizaTotais(); orcMudou(); };
  $("#opDVal").oninput = e => { const v = lerValor(e.target.value); op.desc_valor = isNaN(v) ? 0 : (op.desc_tipo === "pct" ? Math.min(100, v) : v); atualizaTotais(); orcMudou(); };
  $("#opDup").onclick = () => { const c = clone(op); c.titulo = (op.titulo || "").trim() ? op.titulo.trim() + " (cópia)" : ""; E.orcRasc.splice(E.orcAba + 1, 0, c); E.orcAba++; orcMudou(); desenhar(); toast("Opção duplicada: ajuste o que muda nesta cópia"); };
  const del = $("#opDel");
  document.querySelectorAll("[data-delop]").forEach(b => {
    const i = Number(b.dataset.delop), vazia = !(E.orcRasc[i].itens || []).length;
    const apaga = () => { E.orcRasc.splice(i, 1); if (typeof E.orcAba === "number" && E.orcAba >= i) E.orcAba = Math.max(0, E.orcAba - 1); orcMudou(); desenhar(); toast(`Opção ${i + 1} excluída`); };
    if (vazia) b.onclick = apaga; else confirmaDuplo(b, "Excluir?", apaga);
  });
  if (del && !del.disabled) confirmaDuplo(del, "Confirmar: excluir opção", () => { E.orcRasc.splice(E.orcAba, 1); E.orcAba = Math.max(0, E.orcAba - 1); orcMudou(); desenhar(); });
  $("#opSemDente").onclick = () => abrirItem({});
  document.querySelectorAll("#orcOdo .odo-d .fc, #orcOdo .odo-d .fc-dente").forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation(); abrirItem({ dente: Number(el.dataset.d), face: el.dataset.f || null });
  }));
  document.querySelectorAll(".orc-tbl tr[data-item]").forEach(tr => { tr.onclick = () => abrirItem({ idx: Number(tr.dataset.item) }); tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); }; });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = ev => { ev.stopPropagation(); op.itens.splice(Number(b.dataset.rm), 1); orcMudou(); desenhar(); });
}

async function mudarStatus(campos, msg, depois){
  try{
    clearTimeout(E.orcTimer); E.orcTimer = null;
    E.orc = await api.atualizarOrcamento(E.orc.id, campos);
    depois?.(); toast(msg); await carregar();
  }catch(e){ erroOrc(erroAmigavel(e)); }
}

function apresentarOrc(){
  const ops = E.orcRasc;
  if (!ops.length) return erroOrc("O orçamento precisa de pelo menos 1 opção. Use “+ Opção”.");
  const vazia = ops.findIndex(x => !(x.itens || []).length);
  if (vazia >= 0){ E.orcAba = vazia; desenhar(); return erroOrc(`A Opção ${vazia + 1} está sem procedimentos. Lance os procedimentos ou exclua a opção (no “×” da aba).`); }
  const iguais = ops.findIndex((x, i) => ops.some((y, j) => j < i && JSON.stringify(x.itens) === JSON.stringify(y.itens) && totaisOpcao(x).total === totaisOpcao(y).total));
  if (iguais >= 0){ E.orcAba = iguais; desenhar(); return erroOrc(`A Opção ${iguais + 1} está igual a outra. Mude os procedimentos ou o valor para que seja uma alternativa de verdade.`); }
  E.orcAba = "comparar";
  const cartao = cfgCartao(null);
  mudarStatus({ opcoes: opcoesParaSalvar().map(x => ({ ...x, cartao })), validade: E.orcValidade || null, status: "apresentado" }, "Orçamento pronto para apresentar ao paciente");
}

function cancelarOrc(){
  const o = E.orc, dlg = $("#dlgOrc"), temCons = !!consentDe(o);
  dlg.innerHTML = `<form class="dlg" id="fCanc" novalidate><header><div><h3>Cancelar orçamento nº ${o.numero}</h3><p>${esc(E.paciente.nome)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="field"><label for="cancMot">Motivo do cancelamento</label><textarea id="cancMot" rows="3" placeholder="Ex.: escolha confirmada por engano; paciente desistiu do tratamento; plano mudou após nova avaliação"></textarea></div>
      <p class="note" style="margin:0">O orçamento não é apagado: fica no histórico como “Cancelado”, com o motivo, a data e quem cancelou.${temCons ? " O consentimento assinado também continua guardado." : ""} As marcações “A fazer” que entraram no odontograma não saem sozinhas: se precisar, use “Limpar” no odontograma da ficha.</p>
      <p class="note" style="margin:0">Para propor outro tratamento, depois use “Copiar para um novo orçamento”.</p>
      <div class="err" id="eCanc" hidden></div></div>
    <footer><button type="button" class="btn ghost" data-fechar>Voltar</button><button type="submit" class="btn danger" id="cancOk">Cancelar orçamento</button></footer></form>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#fCanc", dlg).onsubmit = async ev => {
    ev.preventDefault();
    const motivo = $("#cancMot", dlg).value.trim(), err = $("#eCanc", dlg);
    if (motivo.length < 4){ err.textContent = "Escreva o motivo do cancelamento."; err.hidden = false; return; }
    const bt = $("#cancOk", dlg); bt.disabled = true;
    try{ E.orc = await api.atualizarOrcamento(o.id, { status: "cancelado", motivo_cancelamento: motivo }); dlg.close(); toast("Orçamento cancelado"); await carregar(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; bt.disabled = false; }
  };
  dlg.showModal(); setTimeout(() => $("#cancMot", dlg)?.focus(), 30);
}

function confirmarEscolha(i){
  const o = E.orc, op = o.opcoes[i], t = totaisOpcao(op), dlg = $("#dlgOrc");
  const comDente = op.itens.some(it => (it.dentes || []).length);
  dlg.innerHTML = `<form class="dlg" id="fEsc" novalidate><header><div><h3>Confirmar a escolha do paciente</h3><p>${esc(E.paciente.nome)} · Orçamento nº ${o.numero}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <div class="picked" style="flex-direction:column;align-items:stretch"><b>${esc(nomeOpcao(op, i))}</b>
        <small>${op.itens.map(it => esc(it.nome) + (localItem(it) ? " (" + esc(localItem(it)) + ")" : "")).join(" · ")}</small>
        <span style="font:600 22px/1.2 var(--serif)" class="num">${brl(t.total)} <small style="display:inline;font:13px var(--sans)">${esc(pagamentoTexto(op))}</small></span></div>
      ${comDente ? `<label class="chk"><input type="checkbox" id="escOdo" checked> Marcar estes procedimentos como “A fazer” no odontograma</label>` : ""}
      <p class="note" style="margin:0">Depois de confirmado, o orçamento fica travado (não pode mais ser alterado) e em seguida abre o termo de consentimento para o paciente assinar.</p>
      <div class="err" id="eEsc" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="escOk">Confirmar e gerar consentimento</button></footer></form>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#fEsc", dlg).onsubmit = async ev => {
    ev.preventDefault();
    const bt = $("#escOk", dlg); bt.disabled = true;
    try{
      E.orc = await api.atualizarOrcamento(o.id, { status: "aprovado", opcao_escolhida: i + 1 });
    }catch(e){ const er = $("#eEsc", dlg); er.textContent = erroAmigavel(e); er.hidden = false; bt.disabled = false; return; }
    if ($("#escOdo", dlg)?.checked){
      const rows = op.itens.flatMap(it => (it.dentes || []).flatMap(d => (it.faces?.length ? it.faces : [null])
        .map(f => ({ paciente_id: E.paciente.id, dente: d, face: f, condicao: "a_fazer", procedimento: it.nome }))));
      try{ if (rows.length) await api.salvarMarcacoes(rows); }
      catch(e){ toast("Escolha registrada, mas o odontograma não foi atualizado: " + erroAmigavel(e)); }
    }
    dlg.close(); toast(`Opção ${i + 1} confirmada`);
    await carregar();
    abrirColeta(consentimentoOrcamento(E.orc));
  };
  dlg.showModal();
}

function consentimentoOrcamento(o){
  const i = o.opcao_escolhida - 1, op = o.opcoes[i], t = totaisOpcao(op);
  const L = [`Orçamento nº ${o.numero} — ${nomeOpcao(op, i)}`, ""];
  for (const it of op.itens) L.push(`• ${it.nome}${localItem(it) ? " — " + localItem(it) : ""}${it.qtd > 1 ? ` (${it.qtd} × ${brl(it.valor_unit)})` : ""}: ${brl(it.valor_total)}`);
  L.push("", `Valor total: ${brl(t.total)}${t.desconto ? ` (já com desconto de ${brl(t.desconto)})` : ""}.`, `Forma de pagamento: ${pagamentoTexto(op)}.`);
  if (op.obs?.trim()) L.push(`Observações: ${op.obs.trim()}`);
  const outras = o.opcoes.map((x, k) => k === i ? null : `${nomeOpcao(x, k)} (${brl(totaisOpcao(x).total)})`).filter(Boolean);
  if (outras.length) L.push("", `Também me foram apresentadas as seguintes alternativas de tratamento: ${outras.join("; ")}. Escolhi livremente a opção acima.`);
  const ativos = (E.termos || []).filter(x => x.ativo && temCampo(x.texto, "tratamento"));
  const termo = ativos.find(x => /tratamento proposto/i.test(x.titulo)) || ativos[0] || MODELOS_TERMOS[0];
  return { tipo: "orcamento", referencia_id: o.id, titulo: `Consentimento — orçamento nº ${o.numero} (${nomeOpcao(op, i)})`, texto: preencherTermo(termo.texto, { tratamento: L.join("\n") }) };
}

function linkWhatsOrc(o){

    L.push(`*${nomeOpcao(op, o.opcao_escolhida - 1)}* (opção escolhida)`, ...op.itens.map(it => `• ${it.nome}${localItem(it) ? " — " + localItem(it) : ""}`), `Total: ${brl(totaisOpcao(op).total)} · ${pagamentoTexto(op)}`);
  } else ops.forEach((op, i) => L.push(`*${nomeOpcao(op, i)}*: ${brl(totaisOpcao(op).total)} — ${pagamentoTexto(op)}`));

/* ---------- Diálogo: lançar procedimento ---------- */
function abrirItem(ctx){
  const op = E.orcRasc[E.orcAba], dlg = $("#dlgOrc");
  const ed = ctx.idx != null ? op.itens[ctx.idx] : null;
  const st = ed
    ? { proc: E.procs.find(p => p.id === ed.procedimento_id) || { id: ed.procedimento_id, nome: ed.nome, codigo: ed.codigo, cobranca: ed.cobranca, valor: ed.valor_unit, categoria: "", ativo: true },
        dentes: [...(ed.dentes || [])], faces: [...(ed.faces || [])], arcadas: [...(ed.arcadas || [])], qtd: ed.qtd, qtdManual: true, valor: ed.valor_unit, busca: "", ajuste: "", invalidos: [] }
    : { proc: null, dentes: ctx.dente ? [ctx.dente] : [], faces: ctx.face ? [ctx.face] : [], arcadas: ctx.dente ? [arcadaDe(ctx.dente)] : [],
        qtd: 1, qtdManual: false, valor: 0, busca: "", ajuste: "", todas: false, invalidos: [] };
  const cob = () => st.proc?.cobranca;
  const autoQtd = () => { const c = cob();
    if (c === "dente") return Math.max(1, st.dentes.length);
    if (c === "arcada") return Math.max(1, st.arcadas.length);
    if (c === "quadrante") return Math.max(1, new Set(st.dentes.map(quad)).size);
    return 1; };
  const recalc = () => { if (!st.qtdManual) st.qtd = autoQtd(); };
  const escolher = (proc, porFaces) => {
    const v = variante(proc, { faces: st.faces.length, dente: st.dentes[0] });
    st.ajuste = v !== proc ? `Ajustado para “${v.nome}” ${porFaces || /face/i.test(v.nome) ? `(${st.faces.length} face${st.faces.length > 1 ? "s" : ""})` : `(dente ${st.dentes[0]})`}.` : "";
    st.proc = v; st.valor = Number(v.valor); recalc();
  };
  const listaHTML = () => {
    const q = semAcento(st.busca.trim()).split(/\s+/).filter(Boolean);
    const l = E.procs.filter(p => p.ativo && q.every(w => semAcento(p.nome + " " + (p.codigo ?? "") + " " + p.categoria).includes(w)))
      .sort((a, b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));
    if (!l.length) return `<p class="empty" style="padding:8px 12px">Nada encontrado. ${editoPrecos() ? `Cadastre na aba <a href="#procedimentos">Procedimentos</a>.` : ""}</p>`;
    let cat = "", h = "";
    for (const p of l){ if (p.categoria !== cat){ cat = p.categoria; h += `<div class="cat">${esc(cat)}</div>`; }
      h += `<button type="button" data-proc="${p.id}"><span>${esc(p.nome)}</span><small class="num">${brl(p.valor)}${COBRANCA[p.cobranca]?.suf || ""}</small></button>`; }
    return h;
  };
  const totalTxt = () => isNaN(st.valor) ? "—" : brl(st.qtd * st.valor);
  const pinta = () => {
    const c = cob();
    dlg.innerHTML = `<form class="dlg" id="fItem" novalidate>
      <header><div><h3>${ed ? "Editar procedimento" : "Lançar procedimento"}</h3><p>${esc(nomeOpcao(op, E.orcAba))}${!ed && ctx.dente ? ` · dente ${ctx.dente}${ctx.face ? " · face " + FACE_NOME[ctx.face] : ""}` : ""}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        ${st.aviso ? `<p class="note" style="margin:0;color:var(--warn);font-weight:600">${esc(st.aviso)} Para prótese ou implante, procure o procedimento correspondente.</p>` : ""}
        ${st.proc ? `<div class="picked"><div><b>${esc(st.proc.nome)}</b><small>${esc(st.proc.categoria || "")}${st.proc.categoria ? " · " : ""}${esc(COBRANCA[c]?.rot || "")} · tabela ${brl(st.proc.valor)}</small></div><button type="button" class="btn ghost" id="itTrocar">Trocar</button></div>
          ${st.ajuste ? `<p class="note" style="margin:0">${esc(st.ajuste)}</p>` : ""}`
        : `<div class="field"><label for="itBusca">Procedimento</label><input id="itBusca" type="search" placeholder="Digite parte do nome: resina, canal, faceta, coroa…" autocomplete="off" value="${esc(st.busca)}"></div>
           <div class="proc-lista" id="itLista">${listaHTML()}</div>`}
        ${st.proc && ["dente", "conjunto", "quadrante"].includes(c) ? `<div class="field"><label for="itDentes">${c === "dente" ? "Dente(s)" : "Dentes envolvidos (opcional)"}</label>
          <input id="itDentes" inputmode="numeric" placeholder="Ex.: 11, 21" value="${st.dentes.join(", ")}"><small class="note" id="itDMsg">${c === "dente" ? "Separe por vírgula para lançar em vários dentes." : c === "conjunto" ? "Valor fechado, não multiplica pelos dentes." : "A quantidade conta os quadrantes dos dentes informados."}</small></div>` : ""}
        ${st.proc && c === "dente" ? `<div class="field"><label>Faces (opcional)</label><div class="orc-faces">${ORDEM_FACES.map(f => `<button type="button" data-face="${f}" aria-pressed="${st.faces.includes(f)}" title="${FACE_NOME[f]}">${f}</button>`).join("")}</div>
          <small class="note">O oclusal/incisal · V vestibular · L lingual/palatina · M mesial · D distal. Em restauração, o nº de faces escolhe o valor.</small></div>` : ""}
        ${st.proc && c === "arcada" ? `<div class="field"><label>Arcada</label><div class="an-opts">${[["sup", "Superior"], ["inf", "Inferior"]].map(([k, r]) => `<label class="an-op"><input type="checkbox" data-arc="${k}" ${st.arcadas.includes(k) ? "checked" : ""}> ${r}</label>`).join("")}</div></div>` : ""}
        ${st.proc ? `<div class="grid3">
            <div class="field"><label for="itValor">Valor unitário (R$)</label><input id="itValor" inputmode="decimal" value="${fmtValor(st.valor)}"></div>
            <div class="field"><label for="itQtd">Quantidade</label><input id="itQtd" type="number" min="1" max="99" value="${st.qtd}"></div>
            <div class="field"><label>Total</label><div class="orc-item-tot num" id="itTot">${totalTxt()}</div></div></div>
          ${!ed && E.orcRasc.length > 1 ? `<label class="chk"><input type="checkbox" id="itTodas" ${st.todas ? "checked" : ""}> Lançar também nas outras opções (ex.: consulta, profilaxia)</label>` : ""}` : ""}
        <div class="err" id="eItem" hidden></div>
      </div>
      <footer>${ed ? `<button type="button" class="btn ghost danger" id="itRemover" style="margin-right:auto">Remover</button>` : ""}<button type="button" class="btn ghost" data-fechar>Cancelar</button>${st.proc ? `<button type="submit" class="btn primary" id="itOk">${ed ? "Salvar" : "Lançar"}</button>` : ""}</footer>
    </form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    $("a", dlg)?.addEventListener("click", () => dlg.close());
    const ligaLista = () => dlg.querySelectorAll("[data-proc]").forEach(b => b.onclick = () => { escolher(E.procs.find(p => p.id === b.dataset.proc)); pinta(); $("#itValor", dlg)?.focus(); });
    const bu = $("#itBusca", dlg);
    if (bu){
      bu.oninput = () => { st.busca = bu.value; $("#itLista", dlg).innerHTML = listaHTML(); ligaLista(); };
      bu.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("[data-proc]", dlg)?.click(); } };
      ligaLista(); setTimeout(() => bu.focus(), 30);
    }
    const tr = $("#itTrocar", dlg); if (tr) tr.onclick = () => { st.proc = null; st.ajuste = ""; st.qtdManual = false; pinta(); };
    const atTot = () => { const t = $("#itTot", dlg); if (t) t.textContent = totalTxt(); const q = $("#itQtd", dlg); if (q && Number(q.value) !== st.qtd) q.value = st.qtd; };
    const de = $("#itDentes", dlg);
    if (de) de.oninput = () => { const r = lerDentes(de.value); st.dentes = r.dentes; st.invalidos = r.invalidos;
      const m = $("#itDMsg", dlg); if (r.invalidos.length){ m.textContent = `Dente inválido: ${r.invalidos.join(", ")}. Use a numeração FDI (11–48; decíduos 51–85).`; m.style.color = "var(--bad)"; } else m.style.color = "";
      recalc(); atTot(); };
    dlg.querySelectorAll("[data-face]").forEach(b => b.onclick = () => {
      const f = b.dataset.face; st.faces = st.faces.includes(f) ? st.faces.filter(x => x !== f) : ORDEM_FACES.filter(x => x === f || st.faces.includes(x));
      if (/\(\s*\d\s*faces?\s*\)/i.test(st.proc.nome) && st.faces.length) escolher(st.proc, true); else st.ajuste = "";
      pinta(); });
    dlg.querySelectorAll("[data-arc]").forEach(b => b.onchange = () => { st.arcadas = [...dlg.querySelectorAll("[data-arc]:checked")].map(x => x.dataset.arc); recalc(); atTot(); });
    const va = $("#itValor", dlg); if (va) va.oninput = () => { st.valor = lerValor(va.value); atTot(); };
    const qt = $("#itQtd", dlg); if (qt) qt.oninput = () => { st.qtd = Math.min(99, Math.max(1, parseInt(qt.value) || 1)); st.qtdManual = true; atTot(); };
    const td = $("#itTodas", dlg); if (td) td.onchange = () => st.todas = td.checked;
    const rm = $("#itRemover", dlg); if (rm) rm.onclick = () => { op.itens.splice(ctx.idx, 1); dlg.close(); orcMudou(); desenhar(); };
    $("#fItem", dlg).onsubmit = ev => {
      ev.preventDefault();
      const err = $("#eItem", dlg), erro = m => { err.textContent = m; err.hidden = false; };
      if (!st.proc) return erro("Escolha o procedimento.");
      const c = cob();
      if (st.invalidos.length) return erro(`Dente inválido: ${st.invalidos.join(", ")}. Use a numeração FDI (11 a 48; decíduos 51 a 85).`);
      if (c === "dente" && !st.dentes.length) return erro("Informe o dente (ou os dentes).");
      if (c === "arcada" && !st.arcadas.length) return erro("Marque a arcada (superior, inferior ou as duas).");
      if (isNaN(st.valor)) return erro("Valor inválido. Use, por exemplo, 150 ou 1.500,00.");
      const item = { procedimento_id: st.proc.id, codigo: st.proc.codigo ?? null, nome: st.proc.nome, cobranca: c,
        dentes: ["dente", "conjunto", "quadrante"].includes(c) ? st.dentes : [], faces: c === "dente" ? st.faces : [],
        arcadas: c === "arcada" ? ["sup", "inf"].filter(a => st.arcadas.includes(a)) : [],
        qtd: st.qtd, valor_unit: st.valor, valor_total: r2(st.qtd * st.valor) };
      if (ed) op.itens[ctx.idx] = item;
      else { op.itens.push(item); if (st.todas) E.orcRasc.forEach((x, k) => { if (k !== E.orcAba) x.itens.push(clone(item)); }); }
      dlg.close(); orcMudou(); desenhar();
      toast(ed ? "Procedimento atualizado" : st.todas ? "Lançado em todas as opções" : "Procedimento lançado");
    };
  };
  if (!ed && ctx.dente && estadoOdonto()[ctx.dente]?.inteiro === "ausente") st.aviso = `O dente ${ctx.dente} está marcado como ausente no prontuário.`;
  if (ed && st.proc && !E.procs.some(p => p.id === st.proc.id)) st.ajuste = "Este procedimento não está mais na tabela; o valor do orçamento foi mantido.";
  pinta(); dlg.showModal();
}

/* =================================================================
   FINANCEIRO — parcelas (a receber), recebimentos e taxas do cartão
   Parcela: {id, paciente_id, orcamento_id, numero (0 = entrada), total,
             descricao, vencimento, valor, forma_prevista, status aberta|cancelada}
   Recebimento: {id, paciente_id, parcela_id, data, valor, forma,
             parcelas_cartao, taxa_pct, valor_liquido, descricao,
             registrado_por, estornado, estorno_motivo}
   Toda a equipe registra. Nada se apaga: recebimento errado é estornado.
   ================================================================= */
const FORMAS_REC = { pix: "Pix", dinheiro: "Dinheiro", debito: "Cartão de débito", credito: "Cartão de crédito", transferencia: "Transferência", boleto: "Boleto" };
const SIT_PARC = {
  paga:       { rot: "Paga",          cls: "confirmado" },
  aberta:     { rot: "Em aberto",     cls: "agendado" },
  parcial:    { rot: "Paga em parte", cls: "em_atendimento" },
  vence_hoje: { rot: "Vence hoje",    cls: "vence-hoje" },
  atrasada:   { rot: "Atrasada",      cls: "faltou" },
  cancelada:  { rot: "Cancelada",     cls: "concluido" },
};
const hojeStr = () => inputData(new Date());
const dataBR = s => s ? fmtDia(String(s).length === 10 ? s + "T12:00:00" : s, { day: "2-digit", month: "2-digit", year: "numeric" }) : "—";
const somaMeses = (s, n) => { const [y, m, d] = s.split("-").map(Number); const ult = new Date(y, m - 1 + n + 1, 0).getDate(); return inputData(new Date(y, m - 1 + n, Math.min(d, ult))); };
// com a lista de recebimentos soma os dela; sem lista usa o campo 'recebido' (visão parcelas_em_aberto)
const recebidoDe = (p, recs) => recs ? r2(recs.filter(r => r.parcela_id === p.id && !r.estornado).reduce((s, r) => s + Number(r.valor), 0)) : r2(Number(p.recebido || 0));
function situacaoParcela(p, recs){
  if (p.status === "cancelada") return "cancelada";
  const rec = recebidoDe(p, recs);
  if (rec >= Number(p.valor) - 0.009) return "paga";
  if (p.vencimento < hojeStr()) return "atrasada";
  if (p.vencimento === hojeStr()) return "vence_hoje";
  return rec > 0 ? "parcial" : "aberta";
}
// tabela de taxas da dentista (se ela não tiver, usa a tabela padrão do consultório)
const taxasDe = prof => { const t = E.taxas || [], own = prof ? t.filter(x => x.profissional_id === prof) : []; return own.length ? own : t.filter(x => !x.profissional_id); };
const taxaDe = (forma, n, prof) => { const t = taxasDe(prof);
  return forma === "debito" ? Number(t.find(x => x.tipo === "debito")?.taxa_pct || 0) : forma === "credito" ? Number(t.find(x => x.tipo === "credito" && x.parcelas === n)?.taxa_pct || 0) : 0; };
const nomeDent = id => curto(dentista(id)) || "—";
const dentPadrao = () => souDentista() && dentista(E.usuario.id) ? E.usuario.id : E.equipe[0]?.id;
const dentOpts = sel => E.equipe.map(e => `<option value="${e.id}" ${e.id === sel ? "selected" : ""}>${esc(e.nome)}${E.maqs?.[e.id] ? " · " + esc(E.maqs[e.id]) : ""}</option>`).join("");
const quemNome = r => r?.quem?.nome ? curto({ nome: r.quem.nome }) : (curto(dentista(r?.registrado_por)) || "—");
const formaTxt = r => FORMAS_REC[r.forma] + (r.forma === "credito" && r.parcelas_cartao > 1 ? ` ${r.parcelas_cartao}×` : "");
function avisoFalta11(e){
  const m = (e && e.message) || String(e);
  if (/(parcelas|recebimentos|taxas_cartao)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m)) toast("Falta rodar o arquivo 11_recebimentos.sql no Supabase para usar o financeiro.");
  else toast(erroAmigavel(e));
  return [];
}

/* ---------- Na ficha ---------- */
function financeiroFichaHTML(){
  const ps = (E.parcs || []).slice().sort((a, b) => a.vencimento.localeCompare(b.vencimento) || a.numero - b.numero), rs = E.recs || [];
  const ativas = ps.filter(p => p.status !== "cancelada");
  const lancado = r2(ativas.reduce((s, p) => s + Number(p.valor), 0));
  const recebido = r2(rs.filter(r => !r.estornado).reduce((s, r) => s + Number(r.valor), 0));
  const aberto = r2(ativas.reduce((s, p) => s + Math.max(0, Number(p.valor) - recebidoDe(p, rs)), 0));
  const atrasado = r2(ativas.filter(p => situacaoParcela(p, rs) === "atrasada").reduce((s, p) => s + Number(p.valor) - recebidoDe(p, rs), 0));
  const tile = (rot, val, cls = "") => `<div class="tile ${cls}"><span>${rot}</span><b class="num">${val}</b></div>`;
  const quitada = p => ["paga", "cancelada"].includes(situacaoParcela(p, rs));
  const psVis = E.parcTodas ? ps : ps.filter(p => !quitada(p)), psOcultas = ps.length - psVis.length;
  const linhasP = psVis.map(p => { const sit = situacaoParcela(p, rs), rec = recebidoDe(p, rs);
    return `<tr data-parc="${p.id}" tabindex="0" class="${p.status === "cancelada" ? "inativo" : ""}">
      <td class="num">${dataBR(p.vencimento)}</td><td>${esc(p.descricao)}${p.forma_prevista ? `<small>${esc(p.forma_prevista)}</small>` : ""}</td>
      <td class="num r">${brl(p.valor)}</td><td class="num r">${rec ? brl(rec) : "—"}</td>
      <td><span class="pill ${SIT_PARC[sit].cls}">${SIT_PARC[sit].rot}</span></td>
      <td class="r">${["aberta", "parcial", "vence_hoje", "atrasada"].includes(sit) ? `<button type="button" class="btn" data-receber="${p.id}">Receber</button>` : ""}</td></tr>`; }).join("");
  const linhasR = rs.slice().sort((a, b) => b.data.localeCompare(a.data) || String(b.registrado_em).localeCompare(String(a.registrado_em))).map(r => {
    const p = ps.find(x => x.id === r.parcela_id);
    return `<tr data-rec="${r.id}" tabindex="0" class="${r.estornado ? "estornado" : ""}">
      <td class="num">${dataBR(r.data)}</td><td>${esc(p ? p.descricao : r.descricao || "Recebimento avulso")}${r.estornado ? `<small>Estornado: ${esc(r.estorno_motivo || "")}</small>` : ""}</td>
      <td>${esc(formaTxt(r))}</td><td class="num r">${brl(r.valor)}</td><td class="num r">${brl(r.valor_liquido)}</td><td>${esc(nomeDent(r.profissional_id))}</td></tr>`; }).join("");
  const resFin = ps.length || rs.length ? [aberto ? `em aberto ${brl(aberto)}` : "nada em aberto", atrasado ? `atrasado ${brl(atrasado)}` : "", recebido ? `recebido ${brl(recebido)}` : ""].filter(Boolean).join(" · ") : "sem lançamentos";
  return `<section class="panel" id="fin" data-dobra="fin">
    <div class="odo-head"><div>${tituloDobra("Financeiro", "fin", resFin)}<p class="sub">Parcelas a receber e pagamentos deste paciente. Nada é apagado: pagamento lançado errado é estornado.</p></div>
      <div class="group"><button type="button" class="btn" id="finCobranca">+ Cobrança avulsa</button><button type="button" class="btn primary" id="finAvulso">+ Receber pagamento</button></div></div>
    <div class="tiles fin-tiles">${tile("Total lançado", brl(lancado))}${tile("Recebido", brl(recebido), "ok")}${tile("Em aberto", brl(aberto))}${tile("Atrasado", brl(atrasado), atrasado ? "bad" : "")}</div>
    <h3 class="fin-h3">Parcelas</h3>
    ${linhasP ? `<div class="tbl-wrap"><table class="tbl fin-tbl"><thead><tr><th>Vencimento</th><th>Descrição</th><th class="r">Valor</th><th class="r">Recebido</th><th>Situação</th><th></th></tr></thead><tbody>${linhasP}</tbody></table></div>`
      : `<p class="empty">${ps.length ? "Nenhuma parcela em aberto." : "Nenhuma parcela. As parcelas nascem do orçamento aprovado (botão “Gerar parcelas” no orçamento) ou de “+ Cobrança avulsa”."}</p>`}
    ${psOcultas || E.parcTodas ? `<button type="button" class="mais-lista" id="parcTodas">${E.parcTodas ? "Mostrar só as em aberto" : `Mostrar também as pagas e canceladas (${psOcultas})`}</button>` : ""}
    <details class="ed-hist"${rs.length && rs.length <= 3 ? " open" : ""}><summary>Pagamentos recebidos (${rs.length})</summary>
    ${linhasR ? `<div class="tbl-wrap" style="margin-top:8px"><table class="tbl fin-tbl"><thead><tr><th>Data</th><th>Referente a</th><th>Forma</th><th class="r">Valor</th><th class="r">Líquido</th><th>Em nome de</th></tr></thead><tbody>${linhasR}</tbody></table></div>`
      : `<p class="empty">Nenhum pagamento registrado.</p>`}
    </details>
  </section>`;
}
async function recarregarFinFicha(){
  const pid = E.paciente.id;
  [E.parcs, E.recs] = await Promise.all([api.parcelasDoPaciente(pid), api.recebimentosDoPaciente(pid)]);
  if (E.tela === "ficha"){ const el = $("#fin"); if (el){ el.outerHTML = financeiroFichaHTML(); ligarFinanceiroFicha(); } }
  else carregar();
}
function ligarFinanceiroFicha(){
  const pt = $("#parcTodas"); if (pt) pt.onclick = () => { E.parcTodas = !E.parcTodas; const el = $("#fin"); el.outerHTML = financeiroFichaHTML(); ligarFinanceiroFicha(); };
  $("#finAvulso").onclick = () => abrirReceber(null);
  $("#finCobranca").onclick = () => editarParcela(null);
  document.querySelectorAll("[data-receber]").forEach(b => b.onclick = ev => { ev.stopPropagation(); abrirReceber((E.parcs || []).find(p => p.id === b.dataset.receber)); });
  document.querySelectorAll("tr[data-parc]").forEach(tr => { tr.onclick = () => editarParcela(tr.dataset.parc); tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); }; });
  document.querySelectorAll("tr[data-rec]").forEach(tr => { tr.onclick = () => verRecebimento(tr.dataset.rec); tr.onkeydown = e => { if (e.key === "Enter") tr.onclick(); }; });
}

/* ---------- Receber pagamento ---------- */
// parc: parcela (com paciente) ou null para recebimento avulso. ctx.depois: função após salvar
function abrirReceber(parc, ctx = {}){
  const dlg = $("#dlgFin"), pac = ctx.paciente || E.paciente;
  const recs = ctx.paciente ? null : (E.recs || []);
  const saldo = parc ? r2(Number(parc.valor) - recebidoDe(parc, recs)) : 0;
  const st = { forma: "pix", n: 1, taxa: 0, taxaManual: false, valor: saldo || 0, prof: parc?.profissional_id || ctx.prof || dentPadrao() };
  const pinta = () => {
    const cartao = ["debito", "credito"].includes(st.forma);
    if (!st.taxaManual) st.taxa = taxaDe(st.forma, st.n, st.prof);
    const liq = isNaN(st.valor) ? NaN : r2(st.valor * (1 - (cartao ? st.taxa : 0) / 100));
    const semTaxa = cartao && !st.taxa;
    dlg.innerHTML = `<form class="dlg" id="fRec" novalidate><header><div><h3>Receber pagamento</h3><p>${esc(pac.nome)}${parc ? " · " + esc(parc.descricao) : ""}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
      <div class="body">
        ${parc ? `<div class="picked"><div><b>${esc(parc.descricao)}</b><small>Vencimento ${dataBR(parc.vencimento)} · valor ${brl(parc.valor)}${saldo < Number(parc.valor) ? ` · falta ${brl(saldo)}` : ""}</small></div></div>`
          : `<div class="field"><label for="recDesc">Referente a</label><input id="recDesc" placeholder="Ex.: Consulta de avaliação; Profilaxia" value="${esc(st.desc || "")}"></div>`}
        <div class="field"><label for="recProf">Recebido por (em nome de)</label><select id="recProf">${dentOpts(st.prof)}</select>
          ${parc?.profissional_id && st.prof !== parc.profissional_id ? `<small class="note" style="color:var(--warn)">Esta parcela é da ${esc(nomeDent(parc.profissional_id))}.</small>` : ""}</div>
        <div class="field"><label>Forma de pagamento</label><div class="seg fin-formas" role="group">${Object.entries(FORMAS_REC).map(([k, r]) => `<button type="button" data-forma="${k}" aria-pressed="${st.forma === k}">${r.replace("Cartão de ", "")}</button>`).join("")}</div></div>
        <div class="grid3">
          <div class="field"><label for="recValor">Valor recebido (R$)</label><input id="recValor" inputmode="decimal" value="${fmtValor(st.valor)}"></div>
          <div class="field"><label for="recData">Data</label><input id="recData" type="date" value="${esc(st.data || hojeStr())}" max="${hojeStr()}"></div>
          ${st.forma === "credito" ? `<div class="field"><label for="recN">Parcelas no cartão</label><select id="recN">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${st.n === i + 1 ? "selected" : ""}>${i + 1}×</option>`).join("")}</select></div>` : "<div></div>"}
        </div>
        ${cartao ? `<div class="grid3">
          <div class="field"><label for="recTaxa">Taxa da maquininha (%)</label><input id="recTaxa" inputmode="decimal" value="${fmtValor(st.taxa)}"></div>
          <div class="field"><label>Taxa (R$)</label><div class="orc-item-tot num" id="recTaxaV">${isNaN(liq) ? "—" : brl(st.valor - liq)}</div></div>
          <div class="field"><label>Líquido (fica para a dentista)</label><div class="orc-item-tot num" id="recLiq">${isNaN(liq) ? "—" : brl(liq)}</div></div></div>
          ${semTaxa ? `<p class="note" style="margin:0;color:var(--warn);font-weight:600">Taxa da maquininha ainda não configurada. Configure em Financeiro → Taxas da maquininha, ou digite a taxa aqui.</p>` : ""}` : ""}
        ${parc ? `<div class="field"><label for="recObs">Observação (opcional)</label><input id="recObs" value="${esc(st.obs || "")}"></div>` : ""}
        <div class="err" id="eRec" hidden></div>
      </div>
      <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="recOk">Registrar pagamento</button></footer></form>`;
    dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
    const guarda = () => { st.data = $("#recData", dlg).value; const d = $("#recDesc", dlg); if (d) st.desc = d.value; const o = $("#recObs", dlg); if (o) st.obs = o.value; };
    dlg.querySelectorAll("[data-forma]").forEach(b => b.onclick = () => { guarda(); st.forma = b.dataset.forma; st.taxaManual = false; if (st.forma !== "credito") st.n = 1; pinta(); });
    const atual = () => { const liq = r2(st.valor * (1 - st.taxa / 100)); const l = $("#recLiq", dlg), t = $("#recTaxaV", dlg);
      if (l) l.textContent = isNaN(liq) ? "—" : brl(liq); if (t) t.textContent = isNaN(liq) ? "—" : brl(st.valor - liq); };
    $("#recValor", dlg).oninput = e => { st.valor = lerValor(e.target.value); atual(); };
    $("#recProf", dlg).onchange = e => { guarda(); st.valor = lerValor($("#recValor", dlg).value); st.prof = e.target.value; st.taxaManual = false; pinta(); };
    const n = $("#recN", dlg); if (n) n.onchange = () => { guarda(); st.n = Number(n.value); st.taxaManual = false; pinta(); };
    const tx = $("#recTaxa", dlg); if (tx) tx.oninput = () => { const v = lerValor(tx.value); st.taxa = isNaN(v) ? 0 : Math.min(30, v); st.taxaManual = true; atual(); };
    $("#fRec", dlg).onsubmit = async ev => {
      ev.preventDefault(); guarda();
      const err = $("#eRec", dlg), erro = m => { err.textContent = m; err.hidden = false; };
      if (isNaN(st.valor) || st.valor <= 0) return erro("Informe o valor recebido.");
      if (parc && st.valor > saldo + 0.009) return erro(`O valor é maior que o que falta pagar desta parcela (${brl(saldo)}).`);
      if (!parc && !(st.desc || "").trim()) return erro("Diga a que se refere o pagamento.");
      if (!st.data || st.data > hojeStr()) return erro("Data inválida.");
      const bt = $("#recOk", dlg); bt.disabled = true;
      try{
        const r = await api.registrarRecebimento({ paciente_id: pac.id, parcela_id: parc ? parc.id : null, data: st.data, valor: st.valor, forma: st.forma,
          parcelas_cartao: st.forma === "credito" ? st.n : 1, taxa_pct: ["debito", "credito"].includes(st.forma) ? st.taxa : 0,
          descricao: parc ? ((st.obs || "").trim() || null) : st.desc.trim(), profissional_id: st.prof || null });
        dlg.close(); toast("Pagamento registrado");
        if (ctx.depois) await ctx.depois(); else await recarregarFinFicha();
        verRecebimento(r.id, { paciente: pac, recebimento: r, parcela: parc, novo: true });
      }catch(e){ erro(erroAmigavel(e)); bt.disabled = false; }
    };
  };
  pinta(); dlg.showModal(); setTimeout(() => $("#recValor", dlg)?.select(), 30);
}

/* ---------- Ver recebimento: recibo e estorno ---------- */
function verRecebimento(id, ctx = {}){
  const r = ctx.recebimento || (E.recs || []).find(x => x.id === id); if (!r) return;
  const pac = ctx.paciente || E.paciente, parc = ctx.parcela || (E.parcs || []).find(p => p.id === r.parcela_id);
  const dlg = $("#dlgFin"), ref = parc ? parc.descricao : r.descricao || "Recebimento avulso";
  dlg.innerHTML = `<div class="dlg"><header><div><h3>${ctx.novo ? "Pagamento registrado" : "Pagamento"}</h3><p>${esc(pac.nome)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      ${r.estornado ? `<p class="err" style="margin:0">Estornado em ${dataBR(r.estornado_em)}. Motivo: ${esc(r.estorno_motivo || "")}</p>` : ""}
      <dl class="kv">
        <dt>Referente a</dt><dd>${esc(ref)}${parc && r.descricao ? ` <small class="note">(${esc(r.descricao)})</small>` : ""}</dd>
        <dt>Data</dt><dd class="num">${dataBR(r.data)}</dd>
        <dt>Forma</dt><dd>${esc(formaTxt(r))}</dd>
        <dt>Valor</dt><dd class="num"><b>${brl(r.valor)}</b></dd>
        ${Number(r.taxa_pct) ? `<dt>Taxa</dt><dd class="num">${fmtValor(r.taxa_pct)}% · ${brl(Number(r.valor) - Number(r.valor_liquido))}</dd><dt>Líquido</dt><dd class="num">${brl(r.valor_liquido)}</dd>` : ""}
        <dt>Em nome de</dt><dd>${esc(nomeDent(r.profissional_id))}</dd>
        <dt>Receita Saúde</dt><dd>${r.receita_saude_em ? "recibo emitido em " + dataBR(r.receita_saude_em) : "recibo ainda não emitido (Financeiro → Receita Saúde)"}</dd>
        <dt>Lançado por</dt><dd>${esc(quemNome(r))}</dd>
      </dl>
      <div id="boxEst" hidden><div class="field"><label for="estMot">Motivo do estorno</label><textarea id="estMot" rows="2" placeholder="Ex.: valor digitado errado; lançado no paciente errado; pagamento devolvido"></textarea></div>
        <p class="note" style="margin:0">O pagamento continua no histórico, riscado, e deixa de contar como recebido. Se foi erro de digitação, depois lance o valor certo.</p></div>
      <div class="err" id="eEst" hidden></div>
    </div>
    <footer>${r.estornado ? "" : `<button type="button" class="btn ghost danger" id="recEst" style="margin-right:auto">Estornar</button>`}
      ${r.estornado ? "" : `<button type="button" class="btn" id="recRecibo">Imprimir recibo</button>`}<button type="button" class="btn primary" data-fechar>Fechar</button></footer></div>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  const rb = $("#recRecibo", dlg); if (rb) rb.onclick = () => imprimir(reciboHTML(r, pac, ref), "Recibo — " + pac.nome);
  const es = $("#recEst", dlg);
  if (es) es.onclick = async () => {
    const box = $("#boxEst", dlg);
    if (box.hidden){ box.hidden = false; es.textContent = "Confirmar estorno"; $("#estMot", dlg).focus(); return; }
    const motivo = $("#estMot", dlg).value.trim(), err = $("#eEst", dlg);
    if (motivo.length < 4){ err.textContent = "Escreva o motivo do estorno."; err.hidden = false; return; }
    es.disabled = true;
    try{ await api.estornarRecebimento(r.id, motivo); dlg.close(); toast("Pagamento estornado");
      if (E.tela === "ficha") await recarregarFinFicha(); else await carregar(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; es.disabled = false; }
  };
  if (!dlg.open) dlg.showModal();
}
function reciboHTML(r, pac, ref){
  const d = dentista(r.profissional_id);
  return `<h2 style="margin:0 0 4px">Recibo</h2>
    <p style="margin:0 0 22px;color:#555;font:13px Arial,sans-serif">${esc(CONSULTORIO)} · Olímpia-SP</p>
    <p style="font-size:17px;line-height:1.7">${d ? `Eu, <b>${esc(d.nome)}</b>${d.cro ? ", " + esc(d.cro) + "," : ""} recebi` : "Recebemos"} de <b>${esc(pac.nome)}</b>${pac.cpf ? `, CPF ${esc(fmtCpf(pac.cpf))},` : ""} a importância de <b>${brl(r.valor)}</b>,
      referente a ${esc(ref)}, paga em ${esc(formaTxt(r).toLowerCase())}.</p>
    <p style="font-size:17px">Olímpia, ${fmtDia(r.data + "T12:00:00", { day: "numeric", month: "long", year: "numeric" })}.</p>
    <div style="margin-top:70px;width:340px;border-top:1px solid #333;padding-top:6px;font:13px Arial,sans-serif">${d ? esc(d.nome) + (d.cro ? "<br>" + esc(d.cro) : "") : esc(CONSULTORIO)}</div>
    <p style="margin-top:40px;font:11px Arial,sans-serif;color:#777">Comprovante de controle do consultório. O recibo para o Imposto de Renda do paciente é emitido no Receita Saúde (Receita Federal).</p>`;
}

/* ---------- Cobrança (parcela) avulsa ou edição de parcela ---------- */
function editarParcela(id){
  const p = id ? (E.parcs || []).find(x => x.id === id) : null, dlg = $("#dlgFin"), rs = E.recs || [];
  const rec = p ? recebidoDe(p, rs) : 0, sit = p ? situacaoParcela(p, rs) : "aberta";
  const pode = !p || p.status !== "cancelada";
  const recsP = p ? rs.filter(r => r.parcela_id === p.id) : [];
  dlg.innerHTML = `<form class="dlg" id="fParc" novalidate><header><div><h3>${p ? "Parcela" : "Cobrança avulsa"}</h3><p>${esc(E.paciente.nome)}${p ? ` · <span class="pill ${SIT_PARC[sit].cls}">${SIT_PARC[sit].rot}</span>` : ""}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      ${p ? "" : `<p class="note" style="margin:0">Para valores combinados fora de um orçamento, ex.: consulta a pagar depois.</p>`}
      <div class="field"><label for="paDesc">Descrição</label><input id="paDesc" value="${esc(p ? p.descricao : "")}" placeholder="Ex.: Consulta de avaliação" ${p ? "disabled" : ""}></div>
      ${p ? (p.profissional_id ? `<p class="note" style="margin:0">Em nome de ${esc(nomeDent(p.profissional_id))}</p>` : "") : `<div class="field"><label for="paProf">Dentista (em nome de quem vai ser recebido)</label><select id="paProf">${dentOpts(dentPadrao())}</select></div>`}
      <div class="grid2">
        <div class="field"><label for="paVenc">Vencimento</label><input id="paVenc" type="date" value="${esc(p ? p.vencimento : hojeStr())}" ${pode ? "" : "disabled"}></div>
        <div class="field"><label for="paVal">Valor (R$)</label><input id="paVal" inputmode="decimal" value="${fmtValor(p ? p.valor : 0)}" ${pode ? "" : "disabled"}></div>
      </div>
      ${p && rec ? `<p class="note" style="margin:0">Já recebido: <b>${brl(rec)}</b>. O valor não pode ficar menor que isso.</p>` : ""}
      ${p && p.status === "cancelada" ? `<p class="err" style="margin:0">Cancelada. Motivo: ${esc(p.motivo_cancelamento || "")}</p>` : ""}
      ${recsP.length ? `<div class="field"><label>Pagamentos desta parcela</label><ul class="fin-mini">${recsP.map(r => `<li class="${r.estornado ? "estornado" : ""}">${dataBR(r.data)} · ${esc(formaTxt(r))} · <b>${brl(r.valor)}</b>${r.estornado ? " (estornado)" : ""}</li>`).join("")}</ul></div>` : ""}
      <div id="boxPC" hidden><div class="field"><label for="pcMot">Motivo do cancelamento</label><input id="pcMot" placeholder="Ex.: orçamento cancelado; combinado com o paciente"></div></div>
      <div class="err" id="ePa" hidden></div>
    </div>

    const motivo = $("#pcMot", dlg).value.trim(); if (motivo.length < 4) return erro("Escreva o motivo do cancelamento.");
    try{ await api.atualizarParcela(p.id, { status: "cancelada", motivo_cancelamento: motivo }); dlg.close(); toast("Parcela cancelada"); await recarregarFinFicha(); }
    catch(e){ erro(erroAmigavel(e)); }
  };

    ev.preventDefault();
    const venc = $("#paVenc", dlg).value, valor = lerValor($("#paVal", dlg).value), desc = $("#paDesc", dlg).value.trim();
    if (!p && desc.length < 3) return erro("Informe a descrição.");
    if (!venc) return erro("Informe o vencimento.");
    if (isNaN(valor) || valor <= 0) return erro("Informe o valor.");
    if (p && valor < rec - 0.009) return erro(`O valor não pode ficar menor que o já recebido (${brl(rec)}).`);
    try{
      if (p) await api.atualizarParcela(p.id, { vencimento: venc, valor });
      else await api.criarParcelas([{ paciente_id: E.paciente.id, descricao: desc, vencimento: venc, valor, numero: 1, total: 1, profissional_id: $("#paProf", dlg).value || null }]);
      dlg.close(); toast(p ? "Parcela atualizada" : "Cobrança lançada"); await recarregarFinFicha();
    }catch(e){ erro(erroAmigavel(e)); }
  };
  dlg.showModal();
}

/* ---------- No orçamento aprovado: gerar parcelas ---------- */
function pagamentoOrcHTML(o){
  if (!["aprovado", "cancelado"].includes(o.status)) return "";

  if (o.status === "cancelado"){
    const abertas = ps.filter(p => recebidoDe(p, rs) === 0);

      <button type="button" class="btn danger" id="orcCancParc">Cancelar parcelas em aberto</button></div></section>`;
  }
  if (!ps.length) return `<section class="panel orc-pag-box"><div class="odo-head"><div><h2>Pagamento</h2><p class="sub" style="margin:0">Próximo passo: gerar as parcelas do que foi combinado (${esc(pagamentoTexto(o.opcoes[o.opcao_escolhida - 1]))}). Elas aparecem no financeiro do paciente para registrar cada pagamento.</p></div>
    <button type="button" class="btn primary" id="orcGerarParc">Gerar parcelas</button></div></section>`;
  const tot = r2(ps.reduce((s, p) => s + Number(p.valor), 0)), rec = r2(ps.reduce((s, p) => s + recebidoDe(p, rs), 0));
  return `<section class="panel"><div class="odo-head"><div><h2>Pagamento</h2><p class="sub" style="margin:0">${ps.length} parcela${ps.length > 1 ? "s" : ""} · recebido ${brl(rec)} de ${brl(tot)}.</p></div>
    <a class="btn" href="#paciente/${o.paciente_id}" data-irfin>Ver no financeiro do paciente</a></div>
    <ul class="fin-mini">${ps.sort((a, b) => a.vencimento.localeCompare(b.vencimento)).map(p => { const s = situacaoParcela(p, rs); return `<li>${dataBR(p.vencimento)} · ${esc(p.descricao)} · <b class="num">${brl(p.valor)}</b> <span class="pill ${SIT_PARC[s].cls}">${SIT_PARC[s].rot}</span></li>`; }).join("")}</ul></section>`;
}
function ligarPagamentoOrc(o){
  const g = $("#orcGerarParc"); if (g) g.onclick = () => gerarParcelas(o);
  const ir = document.querySelector("[data-irfin]"); if (ir) ir.addEventListener("click", () => { E.finFoco = true; });
  const cp = $("#orcCancParc");
  if (cp) confirmaDuplo(cp, "Confirmar: cancelar parcelas", async () => {
    try{ for (const p of (E.orcParcs || []).filter(p => p.status !== "cancelada" && recebidoDe(p, E.orcRecs) === 0))
        await api.atualizarParcela(p.id, { status: "cancelada", motivo_cancelamento: `Orçamento nº ${o.numero} cancelado` });
      toast("Parcelas canceladas"); await carregar(); }
    catch(e){ erroOrc(erroAmigavel(e)); }
  });
}
function gerarParcelas(o){
  const op = o.opcoes[o.opcao_escolhida - 1], total = totalCobrado(op), dlg = $("#dlgFin");
  const umaVez = ["Cartão de crédito", "Cartão de débito", "À vista (Pix ou dinheiro)"].includes(op.forma);
  const st = { n: umaVez ? 1 : Math.max(1, Number(op.parcelas) || 1), entrada: op.forma === "Entrada + parcelas" ? Math.min(total, Number(op.entrada) || 0) : 0,
    primeiro: op.forma === "Entrada + parcelas" || op.forma === "Boleto / carnê" ? somaMeses(hojeStr(), 1) : hojeStr(), linhas: [] };
  const prevista = op.forma === "Cartão de crédito" ? `Cartão de crédito em ${Math.max(1, Number(op.parcelas) || 1)}×` : op.forma;
  const monta = () => {
    const L = [], resto = r2(total - st.entrada), base = Math.floor(resto / st.n * 100) / 100;
    if (st.entrada > 0) L.push({ numero: 0, descricao: `Orçamento nº ${o.numero} — entrada`, vencimento: hojeStr(), valor: st.entrada });
    if (resto > 0.009) for (let k = 1; k <= st.n; k++) L.push({ numero: k, descricao: `Orçamento nº ${o.numero} — ${st.n > 1 ? `parcela ${k}/${st.n}` : st.entrada > 0 ? "restante" : "pagamento"}`,
      vencimento: somaMeses(st.primeiro, k - 1), valor: k === st.n ? r2(resto - base * (st.n - 1)) : base });
    st.linhas = L;
  };
  const conta = () => { const soma = r2(st.linhas.reduce((s, l) => s + (isNaN(l.valor) ? 0 : l.valor), 0)); return { soma, dif: r2(total - soma) }; };
  const somaHTML = () => { const { soma, dif } = conta(); const ok = Math.abs(dif) <= 0.009;
    return `<span style="${ok ? "" : "color:var(--bad);font-weight:600"}">Soma: ${brl(soma)}${ok ? " ✓" : ` · diferença de ${brl(dif)} para o total`}</span>`; };
  const linhasHTML = () => st.linhas.map((l, i) => `<tr style="cursor:default"><td>${esc(l.descricao)}</td><td><input type="date" data-gv="${i}" value="${l.vencimento}" class="fin-in"></td><td class="r"><input data-gval="${i}" inputmode="decimal" value="${fmtValor(l.valor)}" class="fin-in num" style="text-align:right;width:110px"></td></tr>`).join("");
  const refaz = () => {
    $("#gBody", dlg).innerHTML = linhasHTML(); $("#gSoma", dlg).innerHTML = somaHTML();
    $("#gOk", dlg).textContent = `Gerar ${st.linhas.length} parcela${st.linhas.length > 1 ? "s" : ""}`;
    dlg.querySelectorAll("[data-gv]").forEach(x => x.oninput = () => { st.linhas[x.dataset.gv].vencimento = x.value; });
    dlg.querySelectorAll("[data-gval]").forEach(x => x.oninput = () => { st.linhas[x.dataset.gval].valor = lerValor(x.value); $("#gSoma", dlg).innerHTML = somaHTML(); });
  };
  monta();
  dlg.innerHTML = `<form class="dlg" id="fGer" novalidate><header><div><h3>Gerar parcelas</h3><p>Orçamento nº ${o.numero} · ${esc(nomeOpcao(op, o.opcao_escolhida - 1))} · ${brl(total)}</p></div><button type="button" class="x" data-fechar aria-label="Fechar">×</button></header>
    <div class="body">
      <p class="note" style="margin:0">Combinado: <b>${esc(pagamentoTexto(op))}</b>.${op.forma === "Cartão de crédito" ? " No cartão, o paciente paga tudo de uma vez na maquininha (parcelado pela operadora): fica 1 parcela com o valor total." : ""} Ajuste o que precisar.</p>
      <div class="grid3">
        <div class="field"><label for="gEnt">Entrada (R$)</label><input id="gEnt" inputmode="decimal" value="${fmtValor(st.entrada)}"></div>
        <div class="field"><label for="gN">Nº de parcelas</label><input id="gN" type="number" min="1" max="36" value="${st.n}"></div>
        <div class="field"><label for="gPri">1º vencimento</label><input id="gPri" type="date" value="${st.primeiro}"></div>
      </div>
      <div class="tbl-wrap"><table class="tbl fin-tbl"><thead><tr><th>Descrição</th><th>Vencimento</th><th class="r">Valor (R$)</th></tr></thead><tbody id="gBody"></tbody></table></div>
      <p class="num" id="gSoma" style="margin:0;text-align:right"></p>
      <div class="err" id="eGer" hidden></div>
    </div>
    <footer><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn primary" id="gOk"></button></footer></form>`;
  dlg.querySelectorAll("[data-fechar]").forEach(x => x.onclick = () => dlg.close());
  $("#gEnt", dlg).oninput = e => { const v = lerValor(e.target.value); st.entrada = isNaN(v) ? 0 : Math.min(total, v); monta(); refaz(); };
  $("#gN", dlg).oninput = e => { st.n = Math.min(36, Math.max(1, parseInt(e.target.value) || 1)); monta(); refaz(); };
  $("#gPri", dlg).oninput = e => { if (e.target.value){ st.primeiro = e.target.value; monta(); refaz(); } };
  $("#fGer", dlg).onsubmit = async ev => {
    ev.preventDefault();
    const err = $("#eGer", dlg), erro = m => { err.textContent = m; err.hidden = false; };
    const { soma, dif } = conta();
    if (!st.linhas.length) return erro("Não há parcelas para gerar.");
    if (st.linhas.some(l => isNaN(l.valor) || l.valor <= 0 || !l.vencimento)) return erro("Confira os valores e vencimentos: todos precisam ser preenchidos e maiores que zero.");
    if (Math.abs(dif) > 0.009) return erro(`A soma das parcelas (${brl(soma)}) precisa ser igual ao total do orçamento (${brl(total)}).`);
    const bt = $("#gOk", dlg); bt.disabled = true;
    try{
      await api.criarParcelas(st.linhas.map(l => ({ paciente_id: o.paciente_id, orcamento_id: o.id, numero: l.numero, total: st.n, descricao: l.descricao, vencimento: l.vencimento, valor: r2(l.valor), forma_prevista: prevista, profissional_id: o.profissional_id })));
      dlg.close(); toast("Parcelas geradas"); await carregar();
    }catch(e){ erro(erroAmigavel(e)); bt.disabled = false; }
  };
  refaz(); dlg.showModal();
}

  try{ const c = await api.config(); E.semJuros = Number(c.cartao_sem_juros_ate ?? 12); E.maqs = c.maquininhas || {}; E.cpfProfs = c.cpf_profissionais || {}; E.cfgFalta = false; }catch(e){ E.semJuros = 12; E.maqs = {}; E.cpfProfs = {}; E.cfgFalta = true; }

  document.querySelectorAll("[data-txp]").forEach(b => b.onclick = () => { E.txProf = b.dataset.txp; desenhar(); });
  ligarReceitaSaude();
  document.querySelectorAll("tr[data-fpac]").forEach(tr => { tr.onclick = ev => { if (ev.target.closest("[data-wa],[data-freceber]")) return; E.finFoco = true; location.hash = "#paciente/" + tr.dataset.fpac; };

      const atual = Number(taxasDe(E.txProf).find(x => x.tipo === tipo && x.parcelas === Number(n) && x.profissional_id === E.txProf)?.taxa_pct ?? -1);
      if (Math.abs(atual - v) > 0.0001) mud.push({ tipo, parcelas: Number(n), taxa_pct: v });
    }
    const sjSel = $("#semJuros"), sj = sjSel && !sjSel.disabled ? Number(sjSel.value) : E.semJuros;
    const mq = $("#maqNome"), maq = mq && !mq.disabled ? mq.value.trim() : (E.maqs?.[E.txProf] || "");

    sv.disabled = true;
    try{ for (const m of mud) await api.salvarTaxa(E.txProf, m.tipo, m.parcelas, m.taxa_pct);
      if (maqMudou) await api.salvarConfig("maquininhas", { ...(E.maqs || {}), [E.txProf]: maq });
      if (sj !== E.semJuros) await api.salvarConfig("cartao_sem_juros_ate", sj);
      toast("Taxas salvas"); await carregar(); }
    catch(e){ err.textContent = erroAmigavel(e); err.hidden = false; sv.disabled = false; }

}

/* ---------- Contas a pagar (despesas) ----------
   A casa é dividida entre moradia e consultório: cada conta guarda o valor total e a
   parte do consultório (%). "Em nome de" = CPF que deduz no Carnê-Leão; "quem arca" =
   só uma dentista ou dividida entre as dentistas (comum). Despesas fixas geram a conta
   de cada mês sozinhas. Nada se apaga: cancela com motivo; pagamento errado se desfaz. */
const CAT_DESP = { aluguel: "Aluguel", energia: "Energia elétrica", agua: "Água", internet: "Internet e telefone", residuos: "Coleta de resíduos",
  material: "Material odontológico", laboratorio: "Laboratório / prótese", impostos: "Impostos e taxas (CRO, INSS…)", manutencao: "Manutenção e equipamentos",
  marketing: "Marketing", sistemas: "Sistemas e assinaturas", outros: "Outros" };
const PCT_CASA = { aluguel: 50, energia: 50, agua: 50, internet: 50 };
const FORMAS_DESP = { pix: "Pix", boleto: "Boleto", debito_auto: "Débito automático", dinheiro: "Dinheiro", cartao: "Cartão", transferencia: "Transferência" };
const RATEIOS = { meio: "Metade cada", proporcional: "Proporcional ao recebido", horas: "Pelas horas na agenda" };
const podeDespesas = () => api.demo || souDentista() || !!E.usuario?.admin;
const primeiroDia = s => s.slice(0, 7) + "-01";
const vencNoMes = (comp, dia) => { const [y, m] = comp.split("-").map(Number); const ult = new Date(y, m, 0).getDate(); return inputData(new Date(y, m - 1, Math.min(dia, ult))); };
const quemArca = d => d.arca_profissional_id ? "Só " + nomeDent(d.arca_profissional_id) : "Dividida";
function situacaoDesp(d){
  if (d.status === "cancelada") return { k: "cancelada", rot: "Cancelada", cls: "concluido" };
  if (d.status === "paga") return { k: "paga", rot: "Paga", cls: "confirmado" };
  if (d.vencimento < hojeStr()) return { k: "atrasada", rot: "Atrasada", cls: "faltou" };
  if (d.vencimento === hojeStr()) return { k: "hoje", rot: "Vence hoje", cls: "vence-hoje" };
  if (d.valor_total == null) return { k: "informar", rot: "Valor a informar", cls: "em_atendimento" };
  return { k: "aberta", rot: "A pagar", cls: "agendado" };
}
const vCons = d => d.valor_total == null ? null : r2(Number(d.valor_total) * Number(d.pct_consultorio) / 100);
function avisoFalta16(e){
  const m = (e && e.message) || String(e);
  if (/(despesas)/.test(m) && /(does not exist|schema cache|não existe)/i.test(m)) toast("Falta rodar o arquivo 16_despesas.sql no Supabase para usar as contas a pagar.");
  else toast(erroAmigavel(e));
}

// cria as contas do mês das despesas fixas (do início de cada uma até o mês que vem; no máximo 12 meses para trás)
async function garantirFixas(fixas){
  const hoje = new Date(), atual = inputData(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), prox = somaMeses(atual, 1), limite = somaMeses(atual, -11);
  const ativas = fixas.filter(f => f.ativo);
  if (!ativas.length) return 0;
  const desde = ativas.map(f => primeiroDia(f.inicio) < limite ? limite : primeiroDia(f.inicio)).sort()[0];
  const tem = new Set((await api.chavesFixas(desde)).map(x => x.fixa_id + "|" + x.competencia));
  const novas = [];
  for (const f of ativas){
    for (let c = primeiroDia(f.inicio) < limite ? limite : primeiroDia(f.inicio); c <= prox; c = somaMeses(c, 1)){
      if (tem.has(f.id + "|" + c)) continue;
      novas.push({ fixa_id: f.id, competencia: c, descricao: f.descricao, categoria: f.categoria, fornecedor: f.fornecedor || null, vencimento: vencNoMes(c, f.dia_vencimento),
        valor_total: f.valor_previsto ?? null, pct_consultorio: f.pct_consultorio, em_nome_de: f.em_nome_de || null, arca_profissional_id: f.arca_profissional_id || null, dedutivel: f.dedutivel !== false });
    }
  }
  if (novas.length) await api.gerarDespesas(novas);
  return novas.length;
}

async function carregarDespesas(){
  const ini = inputData(E.dpMes), fim = inputData(new Date(E.dpMes.getFullYear(), E.dpMes.getMonth() + 1, 0));
  try{
    E.dpFixas = await api.despesasFixas();
    await garantirFixas(E.dpFixas);
    const fimAg = new Date(E.dpMes.getFullYear(), E.dpMes.getMonth() + 1, 1);
    [E.dpAbertas, E.dpMesRows, E.dpRecs, E.dpAgenda] = await Promise.all([api.despesasAbertas(), api.despesasMes(ini, fim),
      api.recebimentosPeriodo(ini, fim).catch(() => []), api.agenda(E.dpMes, fimAg).catch(() => [])]);
    try{ const c = await api.config(); E.dpRateio = RATEIOS[c.rateio_despesas] ? c.rateio_despesas : "proporcional"; E.cpfProfs = c.cpf_profissionais || {}; }catch(e){ E.dpRateio = "proporcional"; }
    E.dpFalta = false;
  }catch(e){ avisoFalta16(e); E.dpFixas = []; E.dpAbertas = []; E.dpMesRows = []; E.dpRecs = []; E.dpAgenda = []; E.dpFalta = true; }
}

// quanto cada dentista assume das despesas comuns, em cada forma de divisão
function partesRateio(){
  const ds = E.equipe.map(e => e.id), n = ds.length || 1;
  const igual = Object.fromEntries(ds.map(d => [d, 1 / n]));
  const rec = Object.fromEntries(ds.map(d => [d, r2((E.dpRecs || []).filter(r => !r.estornado && r.profissional_id === d).reduce((s, r) => s + Number(r.valor_liquido), 0))]));
  const totRec = Object.values(rec).reduce((s, v) => s + v, 0);
  const min = Object.fromEntries(ds.map(d => [d, (E.dpAgenda || []).filter(a => a.profissional_id === d && !["cancelado", "faltou"].includes(a.status))
    .reduce((s, a) => s + Math.max(0, (new Date(a.fim) - new Date(a.inicio)) / 60000), 0)]));
  const totMin = Object.values(min).reduce((s, v) => s + v, 0);
  return { rec, min,
    meio: igual,
    proporcional: totRec > 0 ? Object.fromEntries(ds.map(d => [d, rec[d] / totRec])) : igual,
    horas: totMin > 0 ? Object.fromEntries(ds.map(d => [d, min[d] / totMin])) : igual,
    semRec: !(totRec > 0), semMin: !(totMin > 0) };
}

    const parte = r2(comuns * (P[met][e.id] || 0)); return { e, rec: P.rec[e.id] || 0, proprias, parte, res: r2((P.rec[e.id] || 0) - proprias - parte) }; });
  const semDentRec = r2((E.dpRecs || []).filter(r => !r.estornado && !r.profissional_id).reduce((s, r) => s + Number(r.valor_liquido), 0));

    else for (const id in saldo) saldo[id] -= v * (P[met][id] || 0); }
  const credores = Object.entries(saldo).filter(([, v]) => v > 0.009).sort((a, b) => b[1] - a[1]), devedores = Object.entries(saldo).filter(([, v]) => v < -0.009).sort((a, b) => a[1] - b[1]);
  const acertos = []; { const c = credores.map(([id, v]) => [id, v]), dv = devedores.map(([id, v]) => [id, -v]); let i = 0, j = 0;
    while (i < c.length && j < dv.length){ const x = Math.min(c[i][1], dv[j][1]); if (x > 0.009) acertos.push([dv[j][0], c[i][0], r2(x)]); c[i][1] -= x; dv[j][1] -= x; if (c[i][1] < 0.01) i++; if (dv[j][1] < 0.01) j++; } }
